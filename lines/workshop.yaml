# Dialogue for the workshop (road-to-1.4.md D2), laid over lines/cafe.yaml: same format, same rules.
# Xiaoding the tinkerer does all the work; Adeng only minds the counter and answers now and then.
# Spots: 工作台 (counter), 工具墙 (board), 零件柜 (shelf), 大木桌 (table), 旧电脑 (corner).

opening:
  - { id: ws_revise_again_01, speaker: xiaoding, when: revise_again, bubbles: ["上回拧的是{lastAsk}。", "这回{brief}，没问题！"] }
  - { id: ws_revise_01, speaker: xiaoding, when: revise, bubbles: ["{brief}？好嘞。", "不拆旧的，在上面改。"] }
  - { id: ws_revise_02, speaker: xiaoding, when: revise, bubbles: ["用了一阵，是有点松。", "{brief}，我来紧一紧。"] }
  - { id: ws_revise_03, speaker: xiaoding, when: revise, bubbles: ["旧的先放零件柜里。", "{brief}，改完叫你试。"] }
  - { id: ws_mem_02, speaker: xiaoding, when: has_stuck_note, bubbles: ["{brief}，好嘞。", "上回在{stuckNote}卡过。", "这回先拿那儿开刀。"] }
  - { id: ws_mem_01, speaker: xiaoding, when: has_memory, bubbles: ["{brief}，好嘞。", "上回你挑的{lastChoice}。", "先照那个装，不行再换。"] }
  - { id: ws_tpl_tool_01, speaker: xiaoding, when: tpl_tool, bubbles: ["做小工具，我最拿手。", "能做成网页就做成网页。"] }
  - { id: ws_handed_01, speaker: xiaoding, when: handed, bubbles: ["东西收到，我先拆开看看。", "{brief}，好嘞。"] }
  - { id: ws_opening_01, speaker: xiaoding, bubbles: ["{brief}？", "好嘞，先试试再说！"] }
  - { id: ws_opening_02, speaker: xiaoding, bubbles: ["{brief}……", "螺丝刀呢？……在耳朵上夹着。"] }
  - { id: ws_opening_03, speaker: xiaoding, bubbles: ["来活儿了！", "{brief}，我先搭个架子。"] }

planning:
  - { id: ws_plan_01, speaker: xiaoding, bubbles: ["先在工具墙上画个草图。"] }
  - { id: ws_plan_02, speaker: xiaoding, bubbles: ["先装哪块呢……"] }
  - { id: ws_plan_03, speaker: xiaoding, bubbles: ["三步，搞定！"] }

draft_ready:
  - { id: ws_draft_ready_01, speaker: xiaoding, bubbles: ["信写好了，在工作台上。", "你看完自己寄。"] }
  - { id: ws_draft_ready_02, speaker: xiaoding, bubbles: ["草稿好了！", "寄不寄你说了算。"] }
  - { id: ws_draft_ready_03, speaker: xiaoding, bubbles: ["信没寄，我拿扳手压着呢。"] }

writing:
  - { id: ws_write_01, speaker: xiaoding, bubbles: ["开装！"] }
  - { id: ws_write_02, speaker: xiaoding, bubbles: ["这块拧好了，下一块。"] }
  - { id: ws_write_03, speaker: xiaoding, bubbles: ["哼哼哼……", "这颗螺丝刚好。"] }
  - { id: ws_write_04, speaker: xiaoding, bubbles: ["先拼起来，好不好看再说。"] }

sub_go_research:
  - { id: ws_go_rs_rain, speaker: xiaoding, when: sky_rain, bubbles: ["下雨了，零件别受潮。", "我去零件柜找{topic}。"] }
  - { id: ws_go_rs_01, speaker: xiaoding, bubbles: ["{topic}？零件柜里翻翻！"] }
  - { id: ws_go_rs_02, speaker: xiaoding, bubbles: ["我记得有个现成的，等我。"] }
  - { id: ws_go_rs_03, speaker: xiaoding, bubbles: ["第三个抽屉，还是第四个……"] }

sub_back_research:
  - { id: ws_back_rs_01, speaker: xiaoding, bubbles: ["翻到了！", "能用的有{count}个。"] }
  - { id: ws_back_rs_02, speaker: xiaoding, bubbles: ["这个零件正合适。", "还顺手找着一把旧钥匙。"] }
  - { id: ws_back_rs_03, speaker: xiaoding, bubbles: ["都在这儿，按大小排好了。"] }

sub_go_review:
  - { id: ws_go_rv_01, speaker: xiaoding, bubbles: ["我去旧电脑上跑一遍。"] }
  - { id: ws_go_rv_02, speaker: xiaoding, bubbles: ["敲敲打打，看哪儿会响。"] }
  - { id: ws_go_rv_03, speaker: xiaoding, bubbles: ["试一下才知道！"] }

sub_back_review:
  - { id: ws_back_rv_issue, speaker: xiaoding, when: has_issues, bubbles: ["{issueCount}处会响。", "我贴了胶布做记号。"] }
  - { id: ws_back_rv_ok, speaker: xiaoding, when: no_issues, bubbles: ["跑了三遍，一点不卡！"] }
  - { id: ws_back_rv_ok2, speaker: xiaoding, when: no_issues, bubbles: ["敲遍了，结实。"] }

sub_go_design:
  - { id: ws_go_ds_rain, speaker: xiaoding, when: sky_rain, bubbles: ["下雨天，正好画图纸。", "我去工具墙那边。"] }
  - { id: ws_go_ds_01, speaker: xiaoding, bubbles: ["我在工具墙上画张图纸。"] }
  - { id: ws_go_ds_02, speaker: xiaoding, bubbles: ["按钮放哪儿，我比划比划。"] }
  - { id: ws_go_ds_03, speaker: xiaoding, bubbles: ["先拿纸板搭个样子！"] }

sub_back_design:
  - { id: ws_back_ds_01, speaker: xiaoding, bubbles: ["图纸画好了！", "按钮在右边，手一伸就到。"] }
  - { id: ws_back_ds_02, speaker: xiaoding, bubbles: ["纸板样子搭好了。", "你按按看。"] }
  - { id: ws_back_ds_03, speaker: xiaoding, bubbles: ["画了三版，我觉得第二版好。"] }

stuck:
  - { id: ws_stuck_01, speaker: xiaoding, bubbles: ["咦？拧不上。", "换个螺丝试试。"] }
  - { id: ws_stuck_02, speaker: xiaoding, bubbles: ["不对。{whatsWrong}。"] }
  - { id: ws_stuck_03, speaker: xiaoding, bubbles: ["又冒烟了……"] }
  - { id: ws_stuck_04, speaker: xiaoding, bubbles: ["哎，装反了。", "拆了重来！"] }

stuck_long:
  - { id: ws_stuck_long_01, speaker: xiaoding, bubbles: ["这个有点难搞。", "我得多试几回，你先忙。"] }
  - { id: ws_stuck_long_02, speaker: xiaoding, bubbles: ["还在弄，没扔下！"] }
  - { id: ws_stuck_long_03, speaker: xiaoding, bubbles: ["再给我一会儿，快了。"] }

waiting:
  - { id: ws_wait_01, speaker: xiaoding, bubbles: ["它在转，等等。"] }
  - { id: ws_wait_02, speaker: xiaoding, bubbles: ["哼哼哼……还没好。"] }
  - { id: ws_wait_03, speaker: xiaoding, bubbles: ["旧电脑呼呼响，在算呢。"] }

ask:
  - { id: ws_ask_color, speaker: xiaoding, when: demo_color, bubbles: ["奶油白和浅薄荷，我都喷了一块。", "你要哪个？"] }
  - { id: ws_ask_01, speaker: xiaoding, bubbles: ["问你个事儿。", "{question}"] }
  - { id: ws_ask_02, speaker: xiaoding, bubbles: ["这儿有两种装法。", "你挑一个？"] }

react_adopted:
  - { id: ws_react_ad_01, speaker: xiaoding, bubbles: ["好嘞，就这么装！"] }
  - { id: ws_react_ad_02, speaker: xiaoding, bubbles: ["记下了，我贴张条子。"] }
  - { id: ws_react_ad_03, speaker: xiaoding, bubbles: ["我也觉得这个好使。"] }

react_rejected:
  - { id: ws_react_rj_01, speaker: xiaoding, bubbles: ["行，听你的。"] }
  - { id: ws_react_rj_02, speaker: xiaoding, bubbles: ["那这个零件放回柜里。"] }
  - { id: ws_react_rj_03, speaker: xiaoding, bubbles: ["好，拆了换一个。"] }

react_delegated:
  - { id: ws_react_dl_00, speaker: xiaoding, bubbles: ["好嘞，我来定。", "定了跟你说。"] }
  - { id: ws_react_dl_01, speaker: xiaoding, bubbles: ["那就{choice}，因为{reason}。", "不顺手随时说。"] }
  - { id: ws_react_dl_02, speaker: xiaoding, bubbles: ["先装{choice}试试。", "不行再拆。"] }
  - { id: ws_react_dl_03, speaker: xiaoding, bubbles: ["就{choice}！", "理由写在工具墙上了。"] }

serious:
  - { id: ws_serious_01, speaker: xiaoding, bubbles: ["这一步要{action}。", "做了就{consequence}。", "你看一眼再定。"] }
  - { id: ws_serious_02, speaker: xiaoding, bubbles: ["这儿我不敢乱试。", "{action}，{consequence}。"] }
  - { id: ws_serious_03, speaker: xiaoding, bubbles: ["这个拆了装不回去。", "你看清楚再点。"] }

refused:
  - { id: ws_refused_01, speaker: xiaoding, bubbles: ["这个不能拆。", "换条路。"] }
  - { id: ws_refused_02, speaker: xiaoding, bubbles: ["这不归我们动手。"] }
  - { id: ws_refused_03, speaker: xiaoding, bubbles: ["那是你的私事，我不翻。"] }

serious_yes:
  - { id: ws_serious_yes_01, speaker: xiaoding, bubbles: ["好嘞，我来。"] }
  - { id: ws_serious_yes_02, speaker: xiaoding, bubbles: ["知道了，这就动手。"] }
  - { id: ws_serious_yes_03, speaker: xiaoding, bubbles: ["收到！"] }

serious_no:
  - { id: ws_serious_no_01, speaker: xiaoding, bubbles: ["好，不碰它。", "我换个不用这样的法子。"] }
  - { id: ws_serious_no_02, speaker: xiaoding, bubbles: ["好，先放着。"] }
  - { id: ws_serious_no_03, speaker: xiaoding, bubbles: ["不弄了，我绕过去。"] }

done:
  - { id: ws_done_day, speaker: xiaoding, when: daytime, bubbles: ["装好了，在工作台上！", "你试试顺不顺手。"] }
  - { id: ws_done_dusk, speaker: xiaoding, when: dusk, bubbles: ["装好了！", "天快黑了，正好收工。"] }
  - { id: ws_done_night, speaker: xiaoding, when: night, bubbles: ["装好了。", "这么晚了，试完早点睡。"] }
  - { id: ws_done_01, speaker: xiaoding, bubbles: ["搞定！一颗螺丝都没剩。"] }
  - { id: ws_done_02, speaker: xiaoding, bubbles: ["好了，按一下就能用。", "我试了十遍。"] }

failed:
  - { id: ws_failed_01, speaker: xiaoding, bubbles: ["这回没弄成，对不起。", "卡在{stuckAt}。", "我写在工具墙上了。", "下回换个法子。"] }
  - { id: ws_failed_02, speaker: xiaoding, bubbles: ["没装成。", "卡在{stuckAt}，记下了。"] }
  - { id: ws_failed_03, speaker: xiaoding, bubbles: ["今天先到这儿。", "毛病我贴在工具墙上了。"] }

net_retry:
  - { id: ws_net_retry_01, speaker: xiaoding, bubbles: ["好像跳闸了，我等等再试。"] }
  - { id: ws_net_retry_02, speaker: xiaoding, bubbles: ["线没接上，我再插一次。"] }
  - { id: ws_net_retry_03, speaker: xiaoding, bubbles: ["外面没人应，过会儿再敲。"] }

cancelled:
  - { id: ws_cancelled_01, speaker: xiaoding, bubbles: ["好，那先放着。"] }
  - { id: ws_cancelled_02, speaker: xiaoding, bubbles: ["行，装好的都留着。"] }
  - { id: ws_cancelled_03, speaker: xiaoding, bubbles: ["好，不弄了。", "工具我挂回墙上。"] }

# 走进工坊时小钉说的一句（plan-1.7.md G2，app/renderer/stage/shoptalk.ts）。有节日先说节日的，再看天气，
# 都没有就在时辰、季节和平常的里面挑。when：period_dawn/day/dusk/night、sky_rain 等、holiday_*、season_*。
shop_in:
  - { id: ws_in_01, speaker: xiaoding, bubbles: ["来啦！小心地上的螺丝。"] }
  - { id: ws_in_02, speaker: xiaoding, bubbles: ["进来进来，凳子上的零件挪开就能坐。"] }
  - { id: ws_in_03, speaker: xiaoding, bubbles: ["稍等，这根线焊完。"] }
  - { id: ws_in_04, speaker: xiaoding, bubbles: ["来得巧，我正缺个人扶着。"] }
  - { id: ws_in_05, speaker: xiaoding, bubbles: ["随便看，别碰那个冒烟的。"] }
  - { id: ws_in_06, speaker: xiaoding, bubbles: ["门口那箱是坏的，这箱是修好的。"] }
  - { id: ws_in_dawn_01, speaker: xiaoding, when: period_dawn, bubbles: ["这么早？", "我一宿没睡，收音机修好了。"] }
  - { id: ws_in_dawn_02, speaker: xiaoding, when: period_dawn, bubbles: ["早！烙铁刚热上。"] }
  - { id: ws_in_day_01, speaker: xiaoding, when: period_day, bubbles: ["中午啦，我在拆一个闹钟。"] }
  - { id: ws_in_dusk_01, speaker: xiaoding, when: period_dusk, bubbles: ["傍晚了，修好的该送回去了。"] }
  - { id: ws_in_dusk_02, speaker: xiaoding, when: period_dusk, bubbles: ["天暗了，我把台灯拧亮点。"] }
  - { id: ws_in_night_01, speaker: xiaoding, when: period_night, bubbles: ["这么晚？", "旧电脑还开着，我在跑个程序。"] }
  - { id: ws_in_night_02, speaker: xiaoding, when: period_night, bubbles: ["晚上清静，正好焊小件。"] }
  - { id: ws_in_rain_01, speaker: xiaoding, when: sky_rain, bubbles: ["下雨天，零件柜我都关严了。"] }
  - { id: ws_in_snow_01, speaker: xiaoding, when: sky_snow, bubbles: ["快进来！我刚修好暖风机。"] }
  - { id: ws_in_spring_01, speaker: xiaoding, when: season_spring, bubbles: ["开春了，坏风筝都往我这送。"] }
  - { id: ws_in_summer_01, speaker: xiaoding, when: season_summer, bubbles: ["热吧？电扇我刚修好，吹着。"] }
  - { id: ws_in_autumn_01, speaker: xiaoding, when: season_autumn, bubbles: ["秋天干燥，碰铁皮会电人。"] }
  - { id: ws_in_winter_01, speaker: xiaoding, when: season_winter, bubbles: ["冬天了，送来修的全是暖手宝。"] }
  - { id: ws_in_new_year, speaker: xiaoding, when: holiday_new_year, bubbles: ["过年好！", "鞭炮我不放，我做了个电子的。"] }
  - { id: ws_in_lantern, speaker: xiaoding, when: holiday_lantern, bubbles: ["元宵好！", "走马灯转不动，我给它加了个轴承。"] }
  - { id: ws_in_dragon_boat, speaker: xiaoding, when: holiday_dragon_boat, bubbles: ["端午好！", "龙舟的鼓槌断了，我接上了。"] }
  - { id: ws_in_mid_autumn, speaker: xiaoding, when: holiday_mid_autumn, bubbles: ["中秋好！", "兔子灯的轮子掉了，我在修。"] }
  - { id: ws_in_halloween, speaker: xiaoding, when: holiday_halloween, bubbles: ["南瓜灯里，我装了个会闪的灯泡。"] }
  - { id: ws_in_christmas, speaker: xiaoding, when: holiday_christmas, bubbles: ["圣诞好！", "彩灯串坏了一颗，整串都不亮。"] }

# 店里没活时小钉隔一会儿说一句：工具、零件、旧电脑、帮街坊修的东西、收工。when 同上，不写就是什么时候都行。
shop_idle:
  - { id: ws_idle_01, speaker: xiaoding, bubbles: ["这颗螺丝，滑丝了。"] }
  - { id: ws_idle_02, speaker: xiaoding, bubbles: ["焊锡快用完了，得去进。"] }
  - { id: ws_idle_03, speaker: xiaoding, bubbles: ["工具墙上少了把钳子……", "在我兜里。"] }
  - { id: ws_idle_04, speaker: xiaoding, bubbles: ["旧电脑又卡住了，拍一下就好。"] }
  - { id: ws_idle_05, speaker: xiaoding, bubbles: ["拆之前拍张照，装回去才不乱。"] }
  - { id: ws_idle_06, speaker: xiaoding, bubbles: ["这个收音机，比我岁数还大。"] }
  - { id: ws_idle_07, speaker: xiaoding, bubbles: ["零件柜第三格，全是不知道干嘛的。"] }
  - { id: ws_idle_08, speaker: xiaoding, bubbles: ["剩了两颗螺丝，可它能转。"] }
  - { id: ws_idle_09, speaker: xiaoding, bubbles: ["烙铁头氧化了，得磨一磨。"] }
  - { id: ws_idle_10, speaker: xiaoding, bubbles: ["万用表的电池，又没电了。"] }
  - { id: ws_idle_11, speaker: xiaoding, bubbles: ["老周那儿换了几个齿轮回来。"] }
  - { id: ws_idle_12, speaker: xiaoding, bubbles: ["陈婆婆的收音机修好了，等她来拿。"] }
  - { id: ws_idle_13, speaker: xiaoding, bubbles: ["阿信的车铃不响了，我给拧好了。"] }
  - { id: ws_idle_14, speaker: xiaoding, bubbles: ["桂姨的和面机响，我得去看看。"] }
  - { id: ws_idle_15, speaker: xiaoding, bubbles: ["小林的台灯，我修了三回了。"] }
  - { id: ws_idle_16, speaker: xiaoding, bubbles: ["阿灯拿来一单，说不急。", "我已经开工了。"] }
  - { id: ws_idle_17, speaker: xiaoding, bubbles: ["老石说我的工作台太乱。"] }
  - { id: ws_idle_18, speaker: xiaoding, bubbles: ["有人送来一只不走的表，没留名字。"] }
  - { id: ws_idle_19, speaker: xiaoding, bubbles: ["墙上的挂钟，我每周对一次。"] }
  - { id: ws_idle_20, speaker: xiaoding, bubbles: ["抽屉里的弹簧，一拉全蹦出来。"] }
  - { id: ws_idle_dawn_01, speaker: xiaoding, when: period_dawn, bubbles: ["一早脑子清，先画图纸。"] }
  - { id: ws_idle_dawn_02, speaker: xiaoding, when: period_dawn, bubbles: ["送奶车的刹车响，我听得出哪儿松了。"] }
  - { id: ws_idle_day_01, speaker: xiaoding, when: period_day, bubbles: ["午饭的饭盒，就放在电路板旁边。"] }
  - { id: ws_idle_dusk_01, speaker: xiaoding, when: period_dusk, bubbles: ["傍晚了，修好的一件件贴上名字。"] }
  - { id: ws_idle_dusk_02, speaker: xiaoding, when: period_dusk, bubbles: ["街灯一亮，我就知道该收工了。"] }
  - { id: ws_idle_night_01, speaker: xiaoding, when: period_night, bubbles: ["烙铁拔了，插头我检查了两遍。"] }
  - { id: ws_idle_night_02, speaker: xiaoding, when: period_night, bubbles: ["夜里旧电脑风扇响，像在打呼。"] }
  - { id: ws_idle_rain_01, speaker: xiaoding, when: sky_rain, bubbles: ["雨天潮，螺丝一夜就生锈。"] }
  - { id: ws_idle_rain_02, speaker: xiaoding, when: sky_rain, bubbles: ["屋檐漏水，我拿个罐头接着。"] }
  - { id: ws_idle_snow_01, speaker: xiaoding, when: sky_snow, bubbles: ["下雪，工具摸着冰手。"] }
  - { id: ws_idle_snow_02, speaker: xiaoding, when: sky_snow, bubbles: ["雪天出不了门，正好整理零件柜。"] }
  - { id: ws_idle_petals_01, speaker: xiaoding, when: sky_petals, bubbles: ["花瓣飘进风扇里，转成一团。"] }
  - { id: ws_idle_leaves_01, speaker: xiaoding, when: sky_leaves, bubbles: ["叶子堵了排风口，我去掏。"] }
  - { id: ws_idle_spring_01, speaker: xiaoding, when: season_spring, bubbles: ["春天风大，招牌的螺丝松了。"] }
  - { id: ws_idle_spring_02, speaker: xiaoding, when: season_spring, bubbles: ["燕子在门口电线上排成一排。"] }
  - { id: ws_idle_summer_01, speaker: xiaoding, when: season_summer, bubbles: ["夏天电扇修不完。"] }
  - { id: ws_idle_summer_02, speaker: xiaoding, when: season_summer, bubbles: ["天太热，旧电脑得歇一会儿。"] }
  - { id: ws_idle_autumn_01, speaker: xiaoding, when: season_autumn, bubbles: ["秋天了，翻出去年没修完的东西。"] }
  - { id: ws_idle_autumn_02, speaker: xiaoding, when: season_autumn, bubbles: ["开学了，修了一书包的计算器。"] }
  - { id: ws_idle_winter_01, speaker: xiaoding, when: season_winter, bubbles: ["冬天手冷，螺丝老掉。"] }
  - { id: ws_idle_winter_02, speaker: xiaoding, when: season_winter, bubbles: ["暖手宝的开关，十个坏九个。"] }
  - { id: ws_idle_halloween_01, speaker: xiaoding, when: holiday_halloween, bubbles: ["会笑的骷髅，我修好了声音。"] }
  - { id: ws_idle_christmas_01, speaker: xiaoding, when: holiday_christmas, bubbles: ["彩灯一颗颗试，试到第四十颗。"] }
  - { id: ws_idle_new_year_01, speaker: xiaoding, when: holiday_new_year, bubbles: ["电子鞭炮太响，我调小了。"] }
  - { id: ws_idle_lantern_01, speaker: xiaoding, when: holiday_lantern, bubbles: ["走马灯又转起来了。"] }
  - { id: ws_idle_dragon_boat_01, speaker: xiaoding, when: holiday_dragon_boat, bubbles: ["鼓槌接上了，敲起来没毛病。"] }
  - { id: ws_idle_mid_autumn_01, speaker: xiaoding, when: holiday_mid_autumn, bubbles: ["兔子灯的轮子，换了个轴承。"] }
