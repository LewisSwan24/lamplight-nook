# Neighbours coming into the flower shop for flowers (plan-2.0.md J12), in English: lines/flower-buyers.yaml is the
# Chinese set. Same shape and writing rules as chats.yaml. Fern names the flowers ({flower}, lower case, never at the
# start of a sentence) as she hands them over.

