  - { id: open_new_year_2, speaker: adeng, when: holiday_new_year, bubbles: ["{name}, a good new year to you.", "Seeds and peanuts on the table. Dig in."] }
  - { id: open_new_year_3, speaker: adeng, when: holiday_new_year, bubbles: ["{name}, a good new year to you.", "First commission of the year. Any ideas?"] }
