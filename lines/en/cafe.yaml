  - { id: grow_easel, speaker: qingdai, when: grow_easel, bubbles: ["I've brought my easel over.", "I'll paint a bit when it's quiet."] }
  - { id: grow_trophy, speaker: xiaoju, when: grow_trophy, bubbles: ["I made this little trophy!", "For the twenty jobs we've done."], reply: { speaker: laoshi, bubbles: ["It's crooked."] } }
  # In the study (shared/scenes.ts): the same moments, said to fit the room.
  - { id: grow_plant, scene: study, speaker: xiaoju, when: grow_plant, bubbles: ["A plant on the desk!", "I'll remember to water it."], reply: { speaker: laoshi, bubbles: ["You said that about the last one."] } }
