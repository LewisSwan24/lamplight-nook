  - { id: open_wind, speaker: adeng, when: sky_wind, bubbles: ["{name}, there you are.", "I've got the door. Quick, in."] }
  - { id: open_storm, speaker: adeng, when: sky_storm, bubbles: ["{name}, there you are.", "Thunder about. Keep off the windows."] }
  - { id: open_halloween, speaker: adeng, when: holiday_halloween, bubbles: ["{name}, there you are.", "There's pumpkin soup today."] }
  - { id: open_christmas, speaker: adeng, when: holiday_christmas, bubbles: ["{name}, there you are.", "Chestnut's pulled the lights down twice."] }
  - { id: open_new_year, speaker: adeng, when: holiday_new_year, bubbles: ["{name}, a good new year to you.", "Clem put the luck sign on the door."] }
  - { id: open_lantern, speaker: adeng, when: holiday_lantern, bubbles: ["{name}, there you are.", "Lantern riddles today. Clem wrote them."] }
  - { id: open_dragon_boat, speaker: adeng, when: holiday_dragon_boat, bubbles: ["{name}, there you are.", "Zongzi on the table. Sweet and savoury."] }
