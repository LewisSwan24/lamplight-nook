# Said as the shop opens on someone's birthday (plan-1.7.md G3). One of the staff answers for themself; a keeper along the street is mentioned by Wick and says their own in their shop.
birthday:
  - { id: bday_adeng, speaker: xiaoju, when: birthday_adeng, bubbles: ["Wick, it's your birthday!", "The cake's in the cupboard. Don't look."], reply: { speaker: adeng, bubbles: ["...I've already seen it."] } }
  - { id: bday_xiaoju, speaker: adeng, when: birthday_xiaoju, bubbles: ["Clem, it's your birthday.", "I'll run today's errands."], reply: { speaker: xiaoju, bubbles: ["Then I'll do the eating!"] } }
  - { id: bday_laoshi, speaker: xiaoju, when: birthday_laoshi, bubbles: ["Flint, birthday!", "We clubbed together for a new plane."], reply: { speaker: laoshi, bubbles: ["Good plane."] } }
  - { id: bday_qingdai, speaker: adeng, when: birthday_qingdai, bubbles: ["Iris, it's your birthday.", "No painting today. Take the day."], reply: { speaker: qingdai, bubbles: ["Then I'll paint for fun."] } }
  - { id: bday_xiaodou, speaker: laoshi, when: birthday_xiaodou, bubbles: ["Bean, it's your birthday today."], reply: { speaker: xiaodou, bubbles: ["I've written it down."] } }
  - { id: bday_guiyi, speaker: adeng, when: birthday_guiyi, bubbles: ["It's Auntie Olive's birthday.", "Stop by the bakery and say so."] }
  - { id: bday_axin, speaker: adeng, when: birthday_axin, bubbles: ["It's Pip's birthday.", "Clem left those flowers at the post office."] }
  - { id: bday_aqian, speaker: adeng, when: birthday_aqian, bubbles: ["It's Pica's birthday.", "Drop in at the print shop."] }
  - { id: bday_xiaozhe, speaker: adeng, when: birthday_xiaozhe, bubbles: ["It's Umber's birthday.", "There's a new painting by the studio door."] }
  - { id: bday_xiaoding, speaker: adeng, when: birthday_xiaoding, bubbles: ["It's Tack's birthday.", "Music on in the workshop, for once."] }

# The shop's anniversary: a cake on the big table, and a word from each who is in (plan-1.7.md G3).
anniversary:
  - { id: anniv_adeng, speaker: adeng, bubbles: ["Cake's on the big table. Come and cut it."] }
  - { id: anniv_xiaoju, speaker: xiaoju, bubbles: ["I want the piece with the candle!"] }
  - { id: anniv_laoshi, speaker: laoshi, bubbles: ["Cut it even."] }
  - { id: anniv_qingdai, speaker: qingdai, bubbles: ["I piped the flowers on the cream."] }
  - { id: anniv_xiaodou, speaker: xiaodou, bubbles: ["I've written down which year it is."] }
