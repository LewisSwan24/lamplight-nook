- id: story_lamp
  when: idle
  after: 25
  once: true
  turns:
    - adeng: I bought this lamp the day we opened.
    - laoshi: Fixed it four times.
    - adeng: It still lights up.

- id: regular_thirty
  when: idle
  after: 30
  turns:
    - qingdai: The blackboard is wearing thin.
    - xiaoju: I'll buy another!
    - qingdai: Keep it. It has marks on it.

- id: regular_forty
  when: idle
  after: 40
  turns:
