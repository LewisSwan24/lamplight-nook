# Small talk between the staff, in English (lines/chats.yaml is the Chinese set; the chats need not match).
# Each turn is one bubble, same writing rules as lines/en/cafe.yaml.
# when: idle = no commission running; waiting = a long command is running and everyone is waiting.
# period (optional): only at this time of day (dawn, day, dusk, night).

- id: sugar
  when: idle
  turns:
    - xiaoju: Wick, I put another sugar in your tea.
    - adeng: ...So that's why it's so good today.

- id: mallet
  when: idle
  turns:
    - laoshi: My mallet.
    - xiaoju: Haven't seen it.
    - laoshi: ...

- id: sunset
  when: idle
  period: dusk
  turns:
    - xiaoju: The sunset looks like orange soda.
    - laoshi: Looks like rust.
    - xiaoju: You're no fun at all.

- id: chair
  when: idle
  turns:
    - laoshi: This chair wobbles again.
    - adeng: Didn't you fix it last week?
    - laoshi: Mm. So I fix it again.

- id: scarf
  when: idle
  turns:
    - laoshi: Scarf.
    - xiaoju: Oh, did I drop it again?
    - laoshi: It's on the back of the door.

- id: notebook
  when: idle
  turns:
    - xiaoju: Wick, what's in that notebook about me?
    - adeng: That you owe me three biscuits.
    - xiaoju: ...I borrowed them.

- id: windowsill
  when: idle
  turns:
    - xiaoju: Chestnut took the windowsill again.
    - adeng: That's her spot.
    - laoshi: So is my chair, apparently.

- id: cold_tea
  when: idle
  turns:
    - adeng: My tea's gone cold again.
    - laoshi: Then make another pot.
    - adeng: Watch the kettle for me?
    - laoshi: Mm.

- id: bakery
  when: idle
  period: day
  turns:
    - xiaoju: The bakery across the road has a new sign.
    - adeng: What does it say now?
    - xiaoju: Still "Bread". Just bigger.

- id: table_leg
  when: idle
  turns:
    - laoshi: This table leg is a millimeter short.
    - xiaoju: How can you tell?
    - laoshi: I tapped it.

- id: biscuit
  when: waiting
  turns:
    - adeng: A little while yet.
    - xiaoju: Can I have a biscuit meanwhile?
    - adeng: Go on. Save one for Flint.
    - laoshi: No need.

- id: kettle
  when: waiting
  turns:
    - xiaoju: Is it still running?
    - adeng: It is. Let's make tea.
    - laoshi: I'll boil the water.

- id: sketch
  when: waiting
  turns:
    - adeng: This step takes a while.
    - xiaoju: Then I'll draw Chestnut.
    - laoshi: Make it look like her.

# Weather and holidays (sky: rain, snow, petals, leaves; holiday: halloween, christmas, new_year).
# They come up before the everyday chats while they fit.
- id: rain_umbrella
  when: idle
  sky: rain
  turns:
    - xiaoju: It's raining. My umbrella's by the door.
    - adeng: Don't forget it when you go out.

- id: rain_fix
  when: idle
  sky: rain
  turns:
    - laoshi: Rain. Good day for mending.
    - xiaoju: Which day isn't?

- id: snow_sill
  when: idle
  sky: snow
  turns:
    - xiaoju: Snow! The sills are all white.
    - laoshi: Shut the window.
    - adeng: I'll put the kettle on.

- id: fog_window
  when: idle
  sky: fog
  turns:
    - xiaoju: Can't see a thing out the window.
    - qingdai: Like a wash that never dried.

- id: fog_lamp
  when: idle
  sky: fog
  turns:
    - adeng: Fog. Put the door lamp on early.
    - xiaoju: I'll do it.

- id: wind_sign
  when: idle
  sky: wind
  turns:
    - xiaoju: The sign's swinging. Will it fall?
    - laoshi: I screwed it on.

- id: wind_door
  when: idle
  sky: wind
  turns:
    - qingdai: The wind blew the door open twice.
    - adeng: Prop a brick against it.

- id: storm_count
  when: idle
  sky: storm
  turns:
    - xiaoju: Lightning! One, two, three...
    - laoshi: Three miles off.

- id: storm_cat
  when: idle
  sky: storm
  turns:
    - qingdai: Chestnut's under the cupboard.
    - adeng: Out again once the thunder stops.

- id: leaves_door
  when: idle
  sky: leaves
  turns:
    - xiaoju: More leaves blew in the door.
    - laoshi: Leave them. They look nice.

- id: petals_tea
  when: idle
  sky: petals
  turns:
    - xiaoju: Petals are blowing in.
    - adeng: One in the tea wouldn't hurt.

- id: halloween_pumpkin
  when: idle
  holiday: halloween
  turns:
    - xiaoju: I picked the pumpkins. Cute, right?
    - laoshi: That one's grinning at me.

- id: christmas_star
  when: idle
  holiday: christmas
  turns:
    - xiaoju: The star on the tree is crooked.
    - laoshi: I'll do it.
    - adeng: Mind the ladder.

- id: new_year_fu
  when: idle
  holiday: new_year
  turns:
    - adeng: The fu sign goes upside down. Luck arrives.
    - xiaoju: And the lanterns are up!
    - laoshi: Nice and red.

- id: lantern_riddle
  when: idle
  holiday: lantern
  turns:
    - xiaoju: "Riddles are up. Guess one, then dumplings!"
    - laoshi: The answers are on the back.
    - xiaoju: Who said you could look?

- id: dragon_boat_zongzi
  when: idle
  holiday: dragon_boat
  turns:
    - adeng: Auntie Olive taught us to wrap zongzi.
    - xiaoju: Mine came apart in the pot.
    - laoshi: Still edible. As porridge.

- id: mid_autumn_moon
  when: idle
  holiday: mid_autumn
  turns:
    - qingdai: "The moon's fullest tonight."
    - adeng: "Let's close early and watch from the garden."
    - xiaoju: "I'll bring the mooncakes!"

# Neighbours dropping in (game/guests.ts): guest: baker (Auntie Olive from the bakery) or postman (Pip).
# The guest speaks first; turns from staff who are out or in the garden are left out.
- id: baker_fresh
  when: idle
  guest: baker
  period: dawn
  turns:
    - baker: Morning. Saved you two, fresh out.
    - adeng: You shouldn't have.
    - baker: Eat them warm.

- id: baker_osmanthus
  when: idle
  guest: baker
  turns:
    - baker: Osmanthus cakes today.
    - xiaoju: I knew it!
    - baker: Kept the biggest for you.

- id: baker_butter
  when: idle
  guest: baker
  turns:
    - baker: Your Chestnut came by my shop again.
    - adeng: ...What did she take?
    - baker: A whole block of butter.

- id: baker_prices
  when: idle
  guest: baker
  turns:
    - baker: Wick, look over my price list?
    - adeng: These two are the wrong way round.
    - baker: That explains yesterday.

- id: baker_rain
  when: idle
  guest: baker
  sky: rain
  turns:
    - baker: Mind if I wait out the rain?
    - adeng: Sit. The tea's just made.

- id: baker_halloween
  when: idle
  guest: baker
  holiday: halloween
  turns:
    - baker: Pumpkin buns, one each.
    - xiaoju: Flint doesn't eat sweet things.
    - laoshi: ...I do.

- id: baker_christmas
  when: idle
  guest: baker
  holiday: christmas
  turns:
    - baker: Gingerbread men. One got burnt.
    - xiaoju: I'll take the burnt one!

- id: baker_new_year
  when: idle
  guest: baker
  holiday: new_year
  turns:
    - baker: Rice cakes. Steam them at home.
    - adeng: A good new year to you, Olive.
    - baker: And to you. Busy days ahead.

- id: postman_letter
  when: idle
  guest: postman
  turns:
    - postman: Letter for the Nook.
    - adeng: Thanks, Pip.
    - postman: Third this week.

- id: postman_parcel
  when: idle
  guest: postman
  turns:
    - postman: Parcel for Flint. Heavy.
    - laoshi: Timber.
    - postman: Thought so.

- id: postman_postcard
  when: idle
  guest: postman
  turns:
    - postman: A postcard. No sender.
    - xiaoju: It's the sea!
    - adeng: Keep it.

- id: postman_water
  when: idle
  guest: postman
  turns:
    - postman: Just passing. Glass of water?
    - adeng: Sit a minute.
    - postman: Can't. One more street.

- id: postman_rain
  when: idle
  guest: postman
  sky: rain
  turns:
    - postman: Rain got a corner of this one.
    - adeng: Dry it by the stove.

- id: postman_snow
  when: idle
  guest: postman
  sky: snow
  turns:
    - postman: Slipped on the ice today.
    - xiaoju: Are the letters all right?
    - postman: ...Ask about me first.

- id: postman_christmas
  when: idle
  guest: postman
  holiday: christmas
  turns:
    - postman: A whole sack of post today.
    - xiaoju: Any for us?
    - postman: One card.

- id: postman_new_year
  when: idle
  guest: postman
  holiday: new_year
  turns:
    - postman: Red envelopes from the post office.
    - xiaoju: Thanks, Pip!

- id: swatch
  when: idle
  turns:
    - qingdai: Clem, your scarf is the perfect orange.
    - xiaoju: Tangerine!
    - qingdai: I'm borrowing it for a palette.

- id: pinned
  when: idle
  turns:
    - laoshi: The sheet on the board is crooked.
    - qingdai: On purpose.
    - laoshi: ...

- id: blue_cup
  when: idle
  turns:
    - qingdai: Wick, a blue cup, maybe?
    - adeng: I've had this one ten years.
    - qingdai: Then ten more it is.

- id: best_light
  when: idle
  period: dusk
  turns:
    - qingdai: This is the best light to paint in.
    - xiaoju: Paint me, then!

# Coming as regulars (plan.md R2.3): `after: N` only once N commissions are finished with the user.
# `once: true` is a little story told only once, ever; it comes up before everyday chats once unlocked.
- id: regular_cup
  when: idle
  after: 3
  turns:
    - xiaoju: Your cup has its own spot on the shelf now.
    - adeng: Regulars get their own cups.

- id: regular_button
  when: idle
  after: 5
  turns:
    - laoshi: That last page. Buttons still too small.
    - adeng: Mention it if they ask for changes.
    - laoshi: Mm.

- id: regular_notebook
  when: idle
  after: 8
  turns:
    - adeng: The notebook's nearly half full.
    - xiaoju: Get the next one with a cat on it.

- id: regular_shelf
  when: waiting
  after: 5
  turns:
    - qingdai: I dusted the works shelf while we wait.
    - laoshi: Second frame's crooked.

- id: story_chestnut
  when: idle
  after: 4
  once: true
  turns:
    - xiaoju: Today's the day Chestnut turned up here.
    - adeng: A year already?
    - xiaoju: I saved her a bit of dried fish.
    - laoshi: She's slept on my chair for a year.

- id: story_snacks
  when: idle
  after: 7
  once: true
  turns:
    - xiaoju: My snack list is on page four now.
    - qingdai: Can I see?
    - xiaoju: Look, but no crossing things out.

- id: story_guitar
  when: idle
  after: 9
  once: true
  turns:
    - laoshi: This guitar was my dad's.
    - xiaoju: You can play?
    - laoshi: One song.
    - laoshi: Next time it's quiet.

- id: story_first_drawing
  when: idle
  after: 10
  once: true
  turns:
    - qingdai: The first thing I drew here? That board.
    - adeng: I remember. Chalk all over your face.
    - qingdai: That was on purpose.

# The apprentice (road-to-1.1.md A5) comes with the tenth work, so nothing with Bean in it comes before.
- id: apprentice_notes
  when: idle
  after: 10
  turns:
    - xiaodou: Wick, how do I write this one down?
    - adeng: Date first, then who asked.
    - xiaodou: Got it.

- id: apprentice_mallet
  when: idle
  after: 10
  turns:
    - xiaodou: Flint, can I borrow the mallet?
    - laoshi: Watch me use it ten times first.

- id: apprentice_snacks
  when: waiting
  after: 10
  turns:
    - xiaoju: Bean, half my errand snacks are yours.
    - xiaodou: I'll bring some next time.

- id: story_apprentice
  when: idle
  after: 10
  once: true
  turns:
    - adeng: First day here, Bean just stood at the door.
    - xiaodou: I was counting the steps.
    - qingdai: How many?
    - xiaodou: Three.

- id: baker_apprentice
  when: idle
  guest: baker
  after: 10
  turns:
    - baker: Your new one runs about like anything.
    - xiaodou: Hello, Auntie Olive!
    - baker: Come by for the bread ends.

- id: postman_apprentice
  when: idle
  guest: postman
  after: 10
  turns:
    - postman: Ran into Bean at the corner today.
    - xiaodou: I was looking for the library.
    - postman: Follow me next time.

# Further on as regulars: there is still more to say after the tenth.
