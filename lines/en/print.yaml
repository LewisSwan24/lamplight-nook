# Dialogue for the print shop (road-to-1.4.md D2), in English. Laid over lines/en/cafe.yaml; same groups as lines/print.yaml.
# Pica the typesetter does all the work; Wick only minds the counter and answers now and then.
# Spots: the composing desk (counter), the press (board), the paper rack (shelf), the cutting table (table),
# the binding table (corner). Each bubble is at most 44 characters; at most one "!" per bubble.

opening:
  - { id: pr_revise_again_01, speaker: aqian, when: revise_again, bubbles: ["Last proof, it was \"{lastAsk}\".", "This one, \"{brief}\". Noted in the margin."] }
  - { id: pr_revise_01, speaker: aqian, when: revise, bubbles: ["\"{brief}\". Very well.", "We keep the old forme and reset the words."] }
  - { id: pr_revise_02, speaker: aqian, when: revise, bubbles: ["Seen again, a few lines want moving.", "\"{brief}\". I'll reset it."] }
  - { id: pr_revise_03, speaker: aqian, when: revise, bubbles: ["I'll clip the old proof aside.", "\"{brief}\". You'll get a fresh pull."] }
  - { id: pr_mem_02, speaker: aqian, when: has_stuck_note, bubbles: ["\"{brief}\". Very well.", "Last time we stuck on {stuckNote}.", "I'll proof that part first."] }
  - { id: pr_mem_01, speaker: aqian, when: has_memory, bubbles: ["\"{brief}\". Very well.", "Last time you chose {lastChoice}.", "The old way, then. Say if it's wrong."] }
  - { id: pr_tpl_sheet_01, speaker: aqian, when: tpl_sheet, bubbles: ["A table. Rules first, then figures.", "Straight lines, columns lined up."] }
  - { id: pr_tpl_resume_01, speaker: aqian, when: tpl_resume, bubbles: ["A résumé. Not one word made up.", "What's missing stays blank for you."] }
  - { id: pr_handed_01, speaker: aqian, when: handed, bubbles: ["I'll read your pages through first.", "\"{brief}\". Very well."] }
  - { id: pr_opening_01, speaker: aqian, bubbles: ["\"{brief}\"...", "Right. I'll start picking type."] }
  - { id: pr_opening_02, speaker: aqian, bubbles: ["So, \"{brief}\"?", "Sit down. Good work takes its time."] }
  - { id: pr_opening_03, speaker: aqian, bubbles: ["\"{brief}\".", "Let me wipe my glasses, then we begin."] }

planning:
  - { id: pr_plan_01, speaker: aqian, bubbles: ["Let me lay it out on the press first."] }
  - { id: pr_plan_02, speaker: aqian, bubbles: ["Heading in what size, body in what..."] }
  - { id: pr_plan_03, speaker: aqian, bubbles: ["Three formes. One at a time."] }

draft_ready:
  - { id: pr_draft_ready_01, speaker: aqian, bubbles: ["The letter's set. It's on my desk.", "Read it over, then send it yourself."] }
  - { id: pr_draft_ready_02, speaker: aqian, bubbles: ["The draft is printed.", "Whether it goes out is your call."] }
  - { id: pr_draft_ready_03, speaker: aqian, bubbles: ["I've left the envelope open.", "Read it aloud once before it goes."] }

writing:
  - { id: pr_write_01, speaker: aqian, bubbles: ["Setting the body text now."] }
  - { id: pr_write_02, speaker: aqian, bubbles: ["That paragraph's set. Next."] }
  - { id: pr_write_03, speaker: aqian, bubbles: ["One line, two lines...", "Even out the spacing."] }
  - { id: pr_write_04, speaker: aqian, bubbles: ["Short a letter. Same size, from the case."] }

sub_go_research:
  - { id: pr_go_rs_rain, speaker: aqian, when: sky_rain, bubbles: ["Damp day. The paper drinks it in.", "I'll check {topic} at the paper rack."] }
  - { id: pr_go_rs_01, speaker: aqian, bubbles: ["{topic}. I'll look along the paper rack."] }
  - { id: pr_go_rs_02, speaker: aqian, bubbles: ["It'll be in the old specimens somewhere."] }
  - { id: pr_go_rs_03, speaker: aqian, bubbles: ["One moment. The paper rack."] }

sub_back_research:
  - { id: pr_back_rs_01, speaker: aqian, bubbles: ["Found it.", "{count} of them will serve."] }
  - { id: pr_back_rs_02, speaker: aqian, bubbles: ["One was tucked in an old specimen book.", "Just what we need."] }
  - { id: pr_back_rs_03, speaker: aqian, bubbles: ["All copied out. Have a look."] }

sub_go_review:
  - { id: pr_go_rv_01, speaker: aqian, bubbles: ["I'll pull a proof and read it aloud."] }
  - { id: pr_go_rv_02, speaker: aqian, bubbles: ["Over to the binding table to proof it."] }
  - { id: pr_go_rv_03, speaker: aqian, bubbles: ["Word by word. Nothing slips past."] }

sub_back_review:
  - { id: pr_back_rv_issue, speaker: aqian, when: has_issues, bubbles: ["{issueCount} slips in the proof.", "Circled in red, every one."] }
  - { id: pr_back_rv_ok, speaker: aqian, when: no_issues, bubbles: ["Read it all aloud. Not one literal."] }
  - { id: pr_back_rv_ok2, speaker: aqian, when: no_issues, bubbles: ["Proofed twice. Clean."] }

sub_go_design:
  - { id: pr_go_ds_rain, speaker: aqian, when: sky_rain, bubbles: ["Rainy day. A stiffer ink, I think.", "I'll make up a sample on the press."] }
  - { id: pr_go_ds_01, speaker: aqian, bubbles: ["I'll try the layout on the press first."] }
  - { id: pr_go_ds_02, speaker: aqian, bubbles: ["Which typeface? I'll set a few."] }
  - { id: pr_go_ds_03, speaker: aqian, bubbles: ["Good margins first. Top and bottom."] }

sub_back_design:
  - { id: pr_back_ds_01, speaker: aqian, bubbles: ["Here's the layout.", "Heading a size up, body in a serif."] }
  - { id: pr_back_ds_02, speaker: aqian, bubbles: ["I pulled a sample. Take a look."] }
  - { id: pr_back_ds_03, speaker: aqian, bubbles: ["A touch more leading.", "Easier on the eyes for long reading."] }

stuck:
  - { id: pr_stuck_01, speaker: aqian, bubbles: ["Hm? This line won't justify.", "I'll set it another way."] }
  - { id: pr_stuck_02, speaker: aqian, bubbles: ["Wrong. {whatsWrong}."] }
  - { id: pr_stuck_03, speaker: aqian, bubbles: ["This line again."] }
  - { id: pr_stuck_04, speaker: aqian, bubbles: ["...That letter's upside down.", "Again."] }

stuck_long:
  - { id: pr_stuck_long_01, speaker: aqian, bubbles: ["This forme is a stubborn one.", "It'll take a few more tries. Don't wait."] }
  - { id: pr_stuck_long_02, speaker: aqian, bubbles: ["Still setting. I haven't put it down."] }
  - { id: pr_stuck_long_03, speaker: aqian, bubbles: ["No rushing it. A little longer."] }

waiting:
  - { id: pr_wait_01, speaker: aqian, bubbles: ["The ink's not dry yet. We wait."] }
  - { id: pr_wait_02, speaker: aqian, bubbles: ["It's printing. Time for some tea."] }
  - { id: pr_wait_03, speaker: aqian, bubbles: ["An old machine. Slow, but steady."] }

ask:
  - { id: pr_ask_color, speaker: aqian, when: demo_color, bubbles: ["Cream or mint. I can't settle it.", "Which would print better, to your eye?"] }
  - { id: pr_ask_01, speaker: aqian, bubbles: ["One thing I should ask you.", "{question}"] }
  - { id: pr_ask_02, speaker: aqian, bubbles: ["This can be set two ways.", "Which would you have?"] }

react_adopted:
  - { id: pr_react_ad_01, speaker: aqian, bubbles: ["Very well. Set as you say."] }
  - { id: pr_react_ad_02, speaker: aqian, bubbles: ["Noted. I'll mark it on the proof."] }
  - { id: pr_react_ad_03, speaker: aqian, bubbles: ["Mm. That reads better."] }

react_rejected:
  - { id: pr_react_rj_01, speaker: aqian, bubbles: ["Very well. Your call."] }
  - { id: pr_react_rj_02, speaker: aqian, bubbles: ["Then that type goes back in the case."] }
  - { id: pr_react_rj_03, speaker: aqian, bubbles: ["Fine. A different setting."] }

react_delegated:
  - { id: pr_react_dl_00, speaker: aqian, bubbles: ["Then I'll decide.", "I'll tell you what I chose."] }
  - { id: pr_react_dl_01, speaker: aqian, bubbles: ["{choice}, then, because {reason}.", "Say if it doesn't sit right."] }
  - { id: pr_react_dl_02, speaker: aqian, bubbles: ["{choice} for now.", "Easy enough to reset."] }
  - { id: pr_react_dl_03, speaker: aqian, bubbles: ["{choice} it is.", "The reason's on the back of the proof."] }

serious:
  - { id: pr_serious_01, speaker: aqian, bubbles: ["Next step: {action}.", "Once done, {consequence}.", "Read it carefully, then decide."] }
  - { id: pr_serious_02, speaker: aqian, bubbles: ["I need your nod here.", "{action}: {consequence}."] }
  - { id: pr_serious_03, speaker: aqian, bubbles: ["Once it's printed, it can't come back.", "Read it before you click."] }

refused:
  - { id: pr_refused_01, speaker: aqian, bubbles: ["I won't touch that.", "We'll go another way."] }
  - { id: pr_refused_02, speaker: aqian, bubbles: ["That's not ours to print."] }
  - { id: pr_refused_03, speaker: aqian, bubbles: ["That's your private letter. I won't open it."] }

serious_yes:
  - { id: pr_serious_yes_01, speaker: aqian, bubbles: ["Very well. I'll do it."] }
  - { id: pr_serious_yes_02, speaker: aqian, bubbles: ["Understood. On the press it goes."] }
  - { id: pr_serious_yes_03, speaker: aqian, bubbles: ["Right."] }

serious_no:
  - { id: pr_serious_no_01, speaker: aqian, bubbles: ["Very well, I'll leave it.", "I'll find a setting that doesn't need it."] }
  - { id: pr_serious_no_02, speaker: aqian, bubbles: ["Fine. It can wait."] }
  - { id: pr_serious_no_03, speaker: aqian, bubbles: ["Not printing it. I'll work around."] }

done:
  - { id: pr_done_day, speaker: aqian, when: daytime, bubbles: ["Printed. It's on the composing desk.", "See if it serves."] }
  - { id: pr_done_dusk, speaker: aqian, when: dusk, bubbles: ["Printed.", "Read it while there's still light."] }
  - { id: pr_done_night, speaker: aqian, when: night, bubbles: ["Printed.", "It's late. Read it, then get some rest."] }
  - { id: pr_done_01, speaker: aqian, bubbles: ["Trimmed square and bound."] }
  - { id: pr_done_02, speaker: aqian, bubbles: ["One last read aloud. No literals.", "It's yours."] }

failed:
  - { id: pr_failed_01, speaker: aqian, bubbles: ["It didn't print this time. My apologies.", "We stuck on {stuckAt}.", "I've noted it on the back of the proof.", "Next time, another setting."] }
  - { id: pr_failed_02, speaker: aqian, bubbles: ["It wouldn't set.", "Stuck on {stuckAt}. I've noted it."] }
  - { id: pr_failed_03, speaker: aqian, bubbles: ["That's enough for today.", "The trouble's written down."] }

net_retry:
  - { id: pr_net_retry_01, speaker: aqian, bubbles: ["The power's gone. I'll try again shortly."] }
  - { id: pr_net_retry_02, speaker: aqian, bubbles: ["The call didn't go through. Once more."] }
  - { id: pr_net_retry_03, speaker: aqian, bubbles: ["No answer outside. I'll ask again soon."] }

cancelled:
  - { id: pr_cancelled_01, speaker: aqian, bubbles: ["Very well. We'll set it aside."] }
  - { id: pr_cancelled_02, speaker: aqian, bubbles: ["Fine. The set formes stay as they are."] }
  - { id: pr_cancelled_03, speaker: aqian, bubbles: ["Right. No more printing."] }

# What Pica says as you walk into the print shop (plan-1.7.md G2, app/renderer/stage/shoptalk.ts): the holiday's
# line first, then the weather's, else one for the hour, the season or any time. Same ids as lines/print.yaml.
shop_in:
  - { id: pr_in_birthday, speaker: aqian, when: birthday_aqian, bubbles: ["It's my birthday.", "Printed myself a card."] }
  - { id: pr_in_01, speaker: aqian, bubbles: ["Come in. Watch for loose type underfoot."] }
  - { id: pr_in_02, speaker: aqian, bubbles: ["Sit down. The ink's still on the roller."] }
  - { id: pr_in_03, speaker: aqian, bubbles: ["Ah. Let me finish this line first."] }
  - { id: pr_in_04, speaker: aqian, bubbles: ["Not that sheet. The ink's still wet."] }
  - { id: pr_in_05, speaker: aqian, bubbles: ["Come in. The paper smell is strong."] }
  - { id: pr_in_06, speaker: aqian, bubbles: ["Look around. The proofs are on the wall."] }
  - { id: pr_in_dawn_01, speaker: aqian, when: period_dawn, bubbles: ["This early?", "I've only just laid out the cases."] }
  - { id: pr_in_dawn_02, speaker: aqian, when: period_dawn, bubbles: ["First light. Best for setting type."] }
  - { id: pr_in_day_01, speaker: aqian, when: period_day, bubbles: ["Good light at noon. I'm proofing."] }
  - { id: pr_in_dusk_01, speaker: aqian, when: period_dusk, bubbles: ["Evening. Nearly done with today's run."] }
  - { id: pr_in_dusk_02, speaker: aqian, when: period_dusk, bubbles: ["Getting dark. I've just lit the lamp."] }
  - { id: pr_in_night_01, speaker: aqian, when: period_night, bubbles: ["This late?", "Sorting the type back, letter by letter."] }
  - { id: pr_in_night_02, speaker: aqian, when: period_night, bubbles: ["The press is resting. The ink smell isn't."] }
  - { id: pr_in_rain_01, speaker: aqian, when: sky_rain, bubbles: ["Rainy day. The paper goes in the cupboard.", "Leave the umbrella outside."] }
  - { id: pr_in_snow_01, speaker: aqian, when: sky_snow, bubbles: ["Quick, shut the door. The paper flies."] }
  - { id: pr_in_spring_01, speaker: aqian, when: season_spring, bubbles: ["Spring. A new lot of paper just came."] }
  - { id: pr_in_summer_01, speaker: aqian, when: season_summer, bubbles: ["Hot day. Ink dries fast, so I work fast."] }
  - { id: pr_in_autumn_01, speaker: aqian, when: season_autumn, bubbles: ["Autumn's dry. The print comes up crisp."] }
  - { id: pr_in_winter_01, speaker: aqian, when: season_winter, bubbles: ["Cold ink goes thick. I'm warming it."] }
  - { id: pr_in_new_year, speaker: aqian, when: holiday_new_year, bubbles: ["New Year's here.", "A hundred couplets printed. Paper's low."] }
  - { id: pr_in_lantern, speaker: aqian, when: holiday_lantern, bubbles: ["Lantern Festival.", "I printed the riddle slips. One each."] }
  - { id: pr_in_dragon_boat, speaker: aqian, when: holiday_dragon_boat, bubbles: ["Dragon Boat Day.", "Printing numbers for the boat crews."] }
  - { id: pr_in_mid_autumn, speaker: aqian, when: holiday_mid_autumn, bubbles: ["Mid-Autumn.", "I printed Auntie Olive's mooncake tags."] }
  - { id: pr_in_halloween, speaker: aqian, when: holiday_halloween, bubbles: ["Pumpkin face stencils. I printed a stack."] }
  - { id: pr_in_christmas, speaker: aqian, when: holiday_christmas, bubbles: ["Two-colour Christmas cards. Red's on now."] }

# Pica now and then, while it's quiet: type, ink, paper, the neighbours, closing up, closing up.
shop_idle:
  - { id: pr_idle_01, speaker: aqian, bubbles: ["This 'g' is worn smooth. Needs replacing."] }
  - { id: pr_idle_02, speaker: aqian, bubbles: ["Short an 'e' again. Always the 'e'."] }
  - { id: pr_idle_03, speaker: aqian, bubbles: ["Clean the roller or the print smudges."] }
  - { id: pr_idle_04, speaker: aqian, bubbles: ["Type reads backwards. So do I, by now."] }
  - { id: pr_idle_05, speaker: aqian, bubbles: ["Cut along the grain or it frays."] }
  - { id: pr_idle_06, speaker: aqian, bubbles: ["The press handle's worked loose again."] }
  - { id: pr_idle_07, speaker: aqian, bubbles: ["This ream's uneven. I'll sort through it."] }
  - { id: pr_idle_08, speaker: aqian, bubbles: ["Spacing off by a hair, and the page leans."] }
  - { id: pr_idle_09, speaker: aqian, bubbles: ["This old type is older than the shop."] }
  - { id: pr_idle_10, speaker: aqian, bubbles: ["I read a proof three times. Then aloud."] }
  - { id: pr_idle_11, speaker: aqian, bubbles: ["Typos love to hide in headlines."] }
  - { id: pr_idle_12, speaker: aqian, bubbles: ["One letter to a box. Mix them, you're lost."] }
  - { id: pr_idle_13, speaker: aqian, bubbles: ["Wick dropped off an order this morning."] }
  - { id: pr_idle_14, speaker: aqian, bubbles: ["Auntie Olive wanted price cards. Done."] }
  - { id: pr_idle_15, speaker: aqian, bubbles: ["Printed fifty postcards for Pip."] }
  - { id: pr_idle_16, speaker: aqian, bubbles: ["Xiaohe brought a poem. Wants a booklet."] }
  - { id: pr_idle_17, speaker: aqian, bubbles: ["Mrs Wu's newsletter comes in on the 15th."] }
  - { id: pr_idle_18, speaker: aqian, bubbles: ["Old Ma's menu again. New prices."] }
  - { id: pr_idle_19, speaker: aqian, bubbles: ["Someone's reading the proofs on the wall."] }
  - { id: pr_idle_20, speaker: aqian, bubbles: ["Chestnut visited. Inky paw prints."] }
  - { id: pr_idle_dawn_01, speaker: aqian, when: period_dawn, bubbles: ["Hands are steadiest now. Small type time."] }
  - { id: pr_idle_dawn_02, speaker: aqian, when: period_dawn, bubbles: ["I can smell the bakery from here."] }
  - { id: pr_idle_day_01, speaker: aqian, when: period_day, bubbles: ["Noisy street at noon. Drowns out the press."] }
  - { id: pr_idle_dusk_01, speaker: aqian, when: period_dusk, bubbles: ["Dusk. Red ink starts to look black."] }
  - { id: pr_idle_dusk_02, speaker: aqian, when: period_dusk, bubbles: ["Today's sheets hang up to dry overnight."] }
  - { id: pr_idle_night_01, speaker: aqian, when: period_night, bubbles: ["Type's put away. Tomorrow's forme can wait."] }
  - { id: pr_idle_night_02, speaker: aqian, when: period_night, bubbles: ["Quiet night. I'm washing the rollers."] }
  - { id: pr_idle_rain_01, speaker: aqian, when: sky_rain, bubbles: ["Damp paper's limp. Feed it in slowly."] }
  - { id: pr_idle_rain_02, speaker: aqian, when: sky_rain, bubbles: ["Window leaks. I pulled the paper rack in."] }
  - { id: pr_idle_snow_01, speaker: aqian, when: sky_snow, bubbles: ["Snow. The stove stays lit, for the ink."] }
  - { id: pr_idle_snow_02, speaker: aqian, when: sky_snow, bubbles: ["Snow light. The paper's almost too white."] }
  - { id: pr_idle_petals_01, speaker: aqian, when: sky_petals, bubbles: ["A petal landed on a wet proof. It stayed."] }
  - { id: pr_idle_leaves_01, speaker: aqian, when: sky_leaves, bubbles: ["Found a leaf in the ream. Keeping it."] }
  - { id: pr_idle_spring_01, speaker: aqian, when: season_spring, bubbles: ["Spring damp. Each sheet gets aired."] }
  - { id: pr_idle_spring_02, speaker: aqian, when: season_spring, bubbles: ["Spring's for wedding invitations."] }
  - { id: pr_idle_summer_01, speaker: aqian, when: season_summer, bubbles: ["Summer. Dry your hands before the paper."] }
  - { id: pr_idle_summer_02, speaker: aqian, when: season_summer, bubbles: ["Cicadas all afternoon. Two typos so far."] }
  - { id: pr_idle_autumn_01, speaker: aqian, when: season_autumn, bubbles: ["Autumn paper behaves. No curl, no damp."] }
  - { id: pr_idle_autumn_02, speaker: aqian, when: season_autumn, bubbles: ["School's back. Timetables, a whole stack."] }
  - { id: pr_idle_winter_01, speaker: aqian, when: season_winter, bubbles: ["Cold fingers. I pick type half as fast."] }
  - { id: pr_idle_winter_02, speaker: aqian, when: season_winter, bubbles: ["Calendar orders are queued into next month."] }
  - { id: pr_idle_halloween_01, speaker: aqian, when: holiday_halloween, bubbles: ["Kids took half the pumpkin stencils."] }
  - { id: pr_idle_christmas_01, speaker: aqian, when: holiday_christmas, bubbles: ["The green's a hair off the red. Again."] }
  - { id: pr_idle_new_year_01, speaker: aqian, when: holiday_new_year, bubbles: ["Printed the fu upside down. On purpose."] }
  - { id: pr_idle_lantern_01, speaker: aqian, when: holiday_lantern, bubbles: ["I tried one riddle myself. Got it wrong."] }
  - { id: pr_idle_dragon_boat_01, speaker: aqian, when: holiday_dragon_boat, bubbles: ["Big numbers. They're read from the bank."] }
  - { id: pr_idle_mid_autumn_01, speaker: aqian, when: holiday_mid_autumn, bubbles: ["Gold ink for the moon. Not cheap."] }
