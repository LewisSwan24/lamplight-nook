# Dialogue for the flower shop (plan-2.0.md J2), laid over lines/cafe.yaml: same format, same rules.
# Fern does all the work; Adeng only brings the order over.
# Spots: 花店柜台 (counter), 小盆栽架 (board), 花台 (shelf), 包花桌 (table), 花桶 (corner).

opening:
  - { id: fl_revise_again_01, speaker: fangjie, when: revise_again, bubbles: ["上回改的是{lastAsk}。", "这回{brief}，记下了。"] }
  - { id: fl_revise_01, speaker: fangjie, when: revise, bubbles: ["{brief}？好。", "丝带还没系紧，好改。"] }
  - { id: fl_revise_02, speaker: fangjie, when: revise, bubbles: ["拆了重扎，常有的事。", "{brief}，我来。"] }
  - { id: fl_revise_03, speaker: fangjie, when: revise, bubbles: ["旧的那束我先插瓶里。", "{brief}，扎好了喊你。"] }
  - { id: fl_mem_02, speaker: fangjie, when: has_stuck_note, bubbles: ["{brief}，记下了。", "上回在{stuckNote}卡过。", "这回我先绕开那段。"] }
  - { id: fl_mem_01, speaker: fangjie, when: has_memory, bubbles: ["{brief}，记下了。", "上回你挑的{lastChoice}。", "还照那个配。"] }
  - { id: fl_tpl_card_01, speaker: fangjie, when: tpl_card, bubbles: ["做贺卡？我天天往花里插卡片。", "名字照你给的写。"] }
  - { id: fl_tpl_card_02, speaker: fangjie, when: tpl_card, bubbles: ["卡片得配得上那束花。", "字少点，意思写足。"] }
  - { id: fl_tpl_newsletter_01, speaker: fangjie, when: tpl_newsletter, bubbles: ["出简报？跟写花签一个理。", "要紧的放头一条。"] }
  - { id: fl_tpl_newsletter_02, speaker: fangjie, when: tpl_newsletter, bubbles: ["日子和地点我单列一行。", "像价签，一眼就看见。"] }
  - { id: fl_handed_01, speaker: fangjie, when: handed, bubbles: ["东西收到了，我先拆开看看。", "{brief}，记下了。"] }
  - { id: fl_opening_01, speaker: fangjie, bubbles: ["{brief}？", "好，我先把剪子放下。"] }
  - { id: fl_opening_02, speaker: fangjie, bubbles: ["{brief}……", "早上的花刚插好，来得巧。"] }
  - { id: fl_opening_03, speaker: fangjie, bubbles: ["来活了。", "{brief}，我写在花签背面。"] }

planning:
  - { id: fl_plan_01, speaker: fangjie, bubbles: ["先想想怎么配，跟扎花一个理。"] }
  - { id: fl_plan_02, speaker: fangjie, bubbles: ["先放哪一枝呢……"] }
  - { id: fl_plan_03, speaker: fangjie, bubbles: ["三步，一枝一枝来。"] }

draft_ready:
  - { id: fl_draft_ready_01, speaker: fangjie, bubbles: ["稿子好了，在柜台上。", "你看过再定。"] }
  - { id: fl_draft_ready_02, speaker: fangjie, bubbles: ["草稿好了。", "用不用你说了算。"] }
  - { id: fl_draft_ready_03, speaker: fangjie, bubbles: ["稿子压在花剪底下了。"] }

writing:
  - { id: fl_write_01, speaker: fangjie, bubbles: ["开工。"] }
  - { id: fl_write_02, speaker: fangjie, bubbles: ["这枝好了，下一枝。"] }
  - { id: fl_write_03, speaker: fangjie, bubbles: ["嗯……", "这句颜色对。"] }
  - { id: fl_write_04, speaker: fangjie, bubbles: ["先扎上，丝带后面再挑。"] }

sub_go_research:
  - { id: fl_go_rs_rain, speaker: fangjie, when: sky_rain, bubbles: ["下雨了，花桶得挪进来。", "我去花台那儿找{topic}。"] }
  - { id: fl_go_rs_01, speaker: fangjie, bubbles: ["{topic}？我去花台那儿翻翻。"] }
  - { id: fl_go_rs_02, speaker: fangjie, bubbles: ["我记得记在哪本花账上……"] }
  - { id: fl_go_rs_03, speaker: fangjie, bubbles: ["老花样都夹在账本里。"] }

sub_back_research:
  - { id: fl_back_rs_01, speaker: fangjie, bubbles: ["找着了。", "用得上的有{count}样。"] }
  - { id: fl_back_rs_02, speaker: fangjie, bubbles: ["这个对得上。", "跟街坊们说的一样。"] }
  - { id: fl_back_rs_03, speaker: fangjie, bubbles: ["都在这儿，按颜色排好了。"] }

sub_go_review:
  - { id: fl_go_rv_01, speaker: fangjie, bubbles: ["我在包花桌上过一遍。"] }
  - { id: fl_go_rv_02, speaker: fangjie, bubbles: ["哪枝歪了，得一枝枝看。"] }
  - { id: fl_go_rv_03, speaker: fangjie, bubbles: ["一枝一枝看过去。"] }

sub_back_review:
  - { id: fl_back_rv_issue, speaker: fangjie, when: has_issues, bubbles: ["有{issueCount}处不对。", "我都插了张小签。"] }
  - { id: fl_back_rv_ok, speaker: fangjie, when: no_issues, bubbles: ["从头到尾看过了，没歪的。"] }
  - { id: fl_back_rv_ok2, speaker: fangjie, when: no_issues, bubbles: ["看过了，枝枝都齐。"] }

sub_go_design:
  - { id: fl_go_ds_rain, speaker: fangjie, when: sky_rain, bubbles: ["下雨天，没人来买花。", "我在盆栽架边上画样子。"] }
  - { id: fl_go_ds_01, speaker: fangjie, bubbles: ["我在盆栽架边上比划比划。"] }
  - { id: fl_go_ds_02, speaker: fangjie, bubbles: ["摆成什么样好看呢……"] }
  - { id: fl_go_ds_03, speaker: fangjie, bubbles: ["先拿包花纸折个样子。"] }

sub_back_design:
  - { id: fl_back_ds_01, speaker: fangjie, bubbles: ["样子定了。", "像一束配好的花。"] }
  - { id: fl_back_ds_02, speaker: fangjie, bubbles: ["折好了，你瞧瞧。"] }
  - { id: fl_back_ds_03, speaker: fangjie, bubbles: ["摆了三种，我看中间那个好。"] }

stuck:
  - { id: fl_stuck_01, speaker: fangjie, bubbles: ["哎？这枝折了。", "换个法子试试。"] }
  - { id: fl_stuck_02, speaker: fangjie, bubbles: ["不对。{whatsWrong}。"] }
  - { id: fl_stuck_03, speaker: fangjie, bubbles: ["丝带系反了……"] }
  - { id: fl_stuck_04, speaker: fangjie, bubbles: ["颜色配错了。", "重新挑。"] }

stuck_long:
  - { id: fl_stuck_long_01, speaker: fangjie, bubbles: ["这个费工夫。", "我慢慢扎，你先忙。"] }
  - { id: fl_stuck_long_02, speaker: fangjie, bubbles: ["还在弄，没撂下。"] }
  - { id: fl_stuck_long_03, speaker: fangjie, bubbles: ["再等等，这枝难弄。"] }

waiting:
  - { id: fl_wait_01, speaker: fangjie, bubbles: ["在路上了，等等。"] }
  - { id: fl_wait_02, speaker: fangjie, bubbles: ["还没回音，再等等。"] }
  - { id: fl_wait_03, speaker: fangjie, bubbles: ["急不得，花也是慢慢开的。"] }

ask:
  - { id: fl_ask_color, speaker: fangjie, when: demo_color, bubbles: ["奶油白和浅薄荷，我各配了一束。", "你要哪个？"] }
  - { id: fl_ask_01, speaker: fangjie, bubbles: ["问你个事。", "{question}"] }
  - { id: fl_ask_02, speaker: fangjie, bubbles: ["这儿有两种配法。", "你挑一种？"] }

react_adopted:
  - { id: fl_react_ad_01, speaker: fangjie, bubbles: ["好，就这么配。"] }
  - { id: fl_react_ad_02, speaker: fangjie, bubbles: ["记下了，写在黑板上。"] }
  - { id: fl_react_ad_03, speaker: fangjie, bubbles: ["我也挑这个。"] }

react_rejected:
  - { id: fl_react_rj_01, speaker: fangjie, bubbles: ["行，听你的。"] }
  - { id: fl_react_rj_02, speaker: fangjie, bubbles: ["那这束我留着下回用。"] }
  - { id: fl_react_rj_03, speaker: fangjie, bubbles: ["好，换一束。"] }

react_delegated:
  - { id: fl_react_dl_00, speaker: fangjie, bubbles: ["好，我来定。", "定了跟你说。"] }
  - { id: fl_react_dl_01, speaker: fangjie, bubbles: ["那就{choice}，因为{reason}。", "不合适随时说。"] }
  - { id: fl_react_dl_02, speaker: fangjie, bubbles: ["先用{choice}试试。", "不好再换。"] }
  - { id: fl_react_dl_03, speaker: fangjie, bubbles: ["就{choice}。", "为什么，我写在黑板上了。"] }

serious:
  - { id: fl_serious_01, speaker: fangjie, bubbles: ["这一步要{action}。", "做了就{consequence}。", "你看一眼再定。"] }
  - { id: fl_serious_02, speaker: fangjie, bubbles: ["这儿我不敢乱动。", "{action}，{consequence}。"] }
  - { id: fl_serious_03, speaker: fangjie, bubbles: ["剪下去就接不回去了。", "你看清楚再点。"] }

refused:
  - { id: fl_refused_01, speaker: fangjie, bubbles: ["这个不能碰。", "换条路。"] }
  - { id: fl_refused_02, speaker: fangjie, bubbles: ["这不归我们动手。"] }
  - { id: fl_refused_03, speaker: fangjie, bubbles: ["别人订的花，我不拆。"] }

serious_yes:
  - { id: fl_serious_yes_01, speaker: fangjie, bubbles: ["好，我来。"] }
  - { id: fl_serious_yes_02, speaker: fangjie, bubbles: ["知道了，这就动手。"] }
  - { id: fl_serious_yes_03, speaker: fangjie, bubbles: ["就这么办。"] }

serious_no:
  - { id: fl_serious_no_01, speaker: fangjie, bubbles: ["好，不碰它。", "我换个不用这样的法子。"] }
  - { id: fl_serious_no_02, speaker: fangjie, bubbles: ["好，先放着。"] }
  - { id: fl_serious_no_03, speaker: fangjie, bubbles: ["不弄了，我绕过去。"] }

done:
  - { id: fl_done_day, speaker: fangjie, when: daytime, bubbles: ["好了，在柜台上。", "趁亮看。"] }
  - { id: fl_done_dusk, speaker: fangjie, when: dusk, bubbles: ["好了。", "天快黑了，正好收摊。"] }
  - { id: fl_done_night, speaker: fangjie, when: night, bubbles: ["好了。", "这么晚了，看完早点睡。"] }
  - { id: fl_done_01, speaker: fangjie, bubbles: ["扎好了，一枝没掉。"] }
  - { id: fl_done_02, speaker: fangjie, bubbles: ["好了，拿去就能用。", "我从头看了两遍。"] }

failed:
  - { id: fl_failed_01, speaker: fangjie, bubbles: ["这回没弄成，对不住。", "卡在{stuckAt}。", "我记在黑板上了。", "下回换个法子。"] }
  - { id: fl_failed_02, speaker: fangjie, bubbles: ["没弄成。", "卡在{stuckAt}，记下了。"] }
  - { id: fl_failed_03, speaker: fangjie, bubbles: ["今天先到这儿。", "毛病我写在黑板上了。"] }

net_retry:
  - { id: fl_net_retry_01, speaker: fangjie, bubbles: ["线路好像断了，我等等再试。"] }
  - { id: fl_net_retry_02, speaker: fangjie, bubbles: ["那头没人应，我再问问。"] }
  - { id: fl_net_retry_03, speaker: fangjie, bubbles: ["信号不好，过会儿再试。"] }

cancelled:
  - { id: fl_cancelled_01, speaker: fangjie, bubbles: ["好，那先放着。"] }
  - { id: fl_cancelled_02, speaker: fangjie, bubbles: ["行，做好的都留着。"] }
  - { id: fl_cancelled_03, speaker: fangjie, bubbles: ["好，不做了。", "花我插瓶里，明天还能看。"] }

# 走进店里时店主说的一句（app/renderer/stage/shoptalk.ts）。有节日先说节日的，再看天气，都没有就在时辰、季节和平常的里面挑。
shop_in:
  - { id: fl_in_birthday, speaker: fangjie, when: birthday_fangjie, bubbles: ["今天我生日。", "自己给自己扎了一束。"] }
  - { id: fl_in_01, speaker: fangjie, bubbles: ["来啦，买花还是看花？"] }
  - { id: fl_in_02, speaker: fangjie, bubbles: ["进来吧，脚下有水，慢点。"] }
  - { id: fl_in_03, speaker: fangjie, bubbles: ["稍等，这把我先扎完。"] }
  - { id: fl_in_04, speaker: fangjie, bubbles: ["门口那桶是今天的，最新鲜。"] }
  - { id: fl_in_05, speaker: fangjie, bubbles: ["以前在街上摆摊，现在有门了。"] }
  - { id: fl_in_dawn_01, speaker: fangjie, when: period_dawn, bubbles: ["这么早？", "花市的车刚走。"] }
  - { id: fl_in_dawn_02, speaker: fangjie, when: period_dawn, bubbles: ["我刚把花桶灌满水。"] }
  - { id: fl_in_day_01, speaker: fangjie, when: period_day, bubbles: ["中午花容易蔫，我在喷水。"] }
  - { id: fl_in_dusk_01, speaker: fangjie, when: period_dusk, bubbles: ["剩下的花，晚上便宜卖。"] }
  - { id: fl_in_dusk_02, speaker: fangjie, when: period_dusk, bubbles: ["快收摊了，进来挑挑。"] }
  - { id: fl_in_night_01, speaker: fangjie, when: period_night, bubbles: ["关门了，不过你进来吧。"] }
  - { id: fl_in_night_02, speaker: fangjie, when: period_night, bubbles: ["这么晚，花都合上了。"] }
  - { id: fl_in_rain_01, speaker: fangjie, when: sky_rain, bubbles: ["下雨了，花桶我都挪进来了。"] }
  - { id: fl_in_snow_01, speaker: fangjie, when: sky_snow, bubbles: ["雪这么大，你还出门？", "门快关上，花怕冻。"] }
  - { id: fl_in_fog_01, speaker: fangjie, when: sky_fog, bubbles: ["雾这么大，你找得着门？"] }
  - { id: fl_in_wind_01, speaker: fangjie, when: sky_wind, bubbles: ["风大，包花纸别拿手上。", "先放柜台。"] }
  - { id: fl_in_storm_01, speaker: fangjie, when: sky_storm, bubbles: ["打雷了，先在这儿躲躲。"] }
  - { id: fl_in_spring_01, speaker: fangjie, when: season_spring, bubbles: ["开春了，盆栽一天一个样。"] }
  - { id: fl_in_summer_01, speaker: fangjie, when: season_summer, bubbles: ["热吧，花桶边上凉快。"] }
  - { id: fl_in_autumn_01, speaker: fangjie, when: season_autumn, bubbles: ["秋天了，桂花刚到。"] }
  - { id: fl_in_winter_01, speaker: fangjie, when: season_winter, bubbles: ["冬天了，花少，梅花有。"] }
  - { id: fl_in_new_year, speaker: fangjie, when: holiday_new_year, bubbles: ["过年好。", "年宵花摆满了门口。"] }
  - { id: fl_in_lantern, speaker: fangjie, when: holiday_lantern, bubbles: ["元宵好，今天早点关门。"] }
  - { id: fl_in_dragon_boat, speaker: fangjie, when: holiday_dragon_boat, bubbles: ["端午好，艾草一把一把卖。"] }
  - { id: fl_in_mid_autumn, speaker: fangjie, when: holiday_mid_autumn, bubbles: ["中秋好，桂花卖得最快。"] }
  - { id: fl_in_halloween, speaker: fangjie, when: holiday_halloween, bubbles: ["万圣节好，南瓜也摆出来了。"] }
  - { id: fl_in_christmas, speaker: fangjie, when: holiday_christmas, bubbles: ["圣诞好，一品红摆了一排。"] }

# 店里没活时店主隔一会儿说一句。when 同上，不写就是什么时候都行。
shop_idle:
  - { id: fl_idle_01, speaker: fangjie, bubbles: ["这桶水该换了。"] }
  - { id: fl_idle_02, speaker: fangjie, bubbles: ["花茎斜着剪，喝水多。"] }
  - { id: fl_idle_03, speaker: fangjie, bubbles: ["这枝玫瑰，刺我得先摘了。"] }
  - { id: fl_idle_04, speaker: fangjie, bubbles: ["包花纸又快用完了。"] }
  - { id: fl_idle_05, speaker: fangjie, bubbles: ["丝带红的多，白的少。"] }
  - { id: fl_idle_06, speaker: fangjie, bubbles: ["小盆栽一天转一回，长得直。"] }
  - { id: fl_idle_07, speaker: fangjie, bubbles: ["以前在街上，风一吹全倒。"] }
  - { id: fl_idle_08, speaker: fangjie, bubbles: ["满天星不起眼，配什么都行。"] }
  - { id: fl_idle_09, speaker: fangjie, bubbles: ["这盆绿萝是从老家带来的。"] }
  - { id: fl_idle_10, speaker: fangjie, bubbles: ["百合的花粉沾衣服上难洗。"] }
  - { id: fl_idle_11, speaker: fangjie, bubbles: ["花台最上面那层，放不怕晒的。"] }
  - { id: fl_idle_12, speaker: fangjie, bubbles: ["向日葵总朝着窗户转。"] }
  - { id: fl_idle_13, speaker: fangjie, bubbles: ["剪子钝了，明天磨。"] }
  - { id: fl_idle_14, speaker: fangjie, bubbles: ["书店的简伯，天天来买一枝。"] }
  - { id: fl_idle_15, speaker: fangjie, bubbles: ["花蔫了别扔，晒干还能用。"] }
  - { id: fl_idle_16, speaker: fangjie, bubbles: ["今天的康乃馨，颜色正。"] }
  - { id: fl_idle_17, speaker: fangjie, bubbles: ["这束是订的，下午有人来拿。"] }
  - { id: fl_idle_18, speaker: fangjie, bubbles: ["河边湿气重，花开得慢些。"] }
  - { id: fl_idle_19, speaker: fangjie, bubbles: ["桶底那层泥，得刷刷了。"] }
  - { id: fl_idle_20, speaker: fangjie, bubbles: ["价签写小一点，别挡着花。"] }
  - { id: fl_idle_21, speaker: fangjie, bubbles: ["有人买花不说送谁，我也不问。"] }
  - { id: fl_idle_22, speaker: fangjie, bubbles: ["叶子多了抢水，摘几片。"] }
  - { id: fl_idle_23, speaker: fangjie, bubbles: ["这把剪子跟了我十几年。"] }
  - { id: fl_idle_24, speaker: fangjie, bubbles: ["花瓶口窄的，插三枝就够。"] }
  - { id: fl_idle_dawn_01, speaker: fangjie, when: period_dawn, bubbles: ["早上的花还带着露水。"] }
  - { id: fl_idle_night_01, speaker: fangjie, when: period_night, bubbles: ["灯一关，花香就重了。"] }
  - { id: fl_idle_rain_01, speaker: fangjie, when: sky_rain, bubbles: ["下雨天，买花的少，订花的多。"] }
  - { id: fl_idle_wind_01, speaker: fangjie, when: sky_wind, bubbles: ["风大，门口那桶得压块砖。"] }
  - { id: fl_idle_spring_01, speaker: fangjie, when: season_spring, bubbles: ["春天的花，进多少卖多少。"] }
  - { id: fl_idle_summer_01, speaker: fangjie, when: season_summer, bubbles: ["夏天的花，换水得勤。"] }
  - { id: fl_idle_autumn_01, speaker: fangjie, when: season_autumn, bubbles: ["秋天菊花多，样子一年比一年怪。"] }
  - { id: fl_idle_winter_01, speaker: fangjie, when: season_winter, bubbles: ["冬天手冻，扎花慢一点。"] }
