# Dialogue for the studio (road-to-1.4.md D2), laid over lines/cafe.yaml: same format, same rules.
# Xiaozhe the painter does all the work and says little; Adeng only minds the counter and answers now and then.
# Spots: 长桌 (counter), 画架 (board), 画框架 (shelf), 矮桌 (table), 窗边的高凳 (corner).

opening:
  - { id: st_revise_again_01, speaker: xiaozhe, when: revise_again, bubbles: ["上回是{lastAsk}。", "这回，{brief}。"] }
  - { id: st_revise_01, speaker: xiaozhe, when: revise, bubbles: ["{brief}。", "在原来那层上再罩一遍。"] }
  - { id: st_revise_02, speaker: xiaozhe, when: revise, bubbles: ["干了再看，是有点闷。", "{brief}，我来改。"] }
  - { id: st_revise_03, speaker: xiaozhe, when: revise, bubbles: ["旧的那张先靠墙放着。", "{brief}。"] }
  - { id: st_mem_02, speaker: xiaozhe, when: has_stuck_note, bubbles: ["{brief}。", "上回在{stuckNote}卡住了。", "这次先看那儿。"] }
  - { id: st_mem_01, speaker: xiaozhe, when: has_memory, bubbles: ["{brief}。", "上回你挑了{lastChoice}。", "先从那个颜色起。"] }
  - { id: st_tpl_album_01, speaker: xiaozhe, when: tpl_album, bubbles: ["照片收下了。", "先看看每张偏冷还是偏暖。"] }
  - { id: st_handed_01, speaker: xiaozhe, when: handed, bubbles: ["东西收下了。", "{brief}。"] }
  - { id: st_opening_01, speaker: xiaozhe, bubbles: ["{brief}……", "嗯，是灰蓝色的。"] }
  - { id: st_opening_02, speaker: xiaozhe, bubbles: ["{brief}。", "我去洗笔。"] }
  - { id: st_opening_03, speaker: xiaozhe, bubbles: ["好。", "{brief}，先打底。"] }

planning:
  - { id: st_plan_01, speaker: xiaozhe, bubbles: ["先在画架上起个稿。"] }
  - { id: st_plan_02, speaker: xiaozhe, bubbles: ["大块先铺，细的后画。"] }
  - { id: st_plan_03, speaker: xiaozhe, bubbles: ["分三层。"] }

draft_ready:
  - { id: st_draft_ready_01, speaker: xiaozhe, bubbles: ["信写好了，在长桌上。", "你看过再寄。"] }
  - { id: st_draft_ready_02, speaker: xiaozhe, bubbles: ["草稿好了。", "寄不寄，你定。"] }
  - { id: st_draft_ready_03, speaker: xiaozhe, bubbles: ["信没寄。", "压在调色板旁边。"] }

writing:
  - { id: st_write_01, speaker: xiaozhe, bubbles: ["上色了。"] }
  - { id: st_write_02, speaker: xiaozhe, bubbles: ["这块干了，画下一块。"] }
  - { id: st_write_03, speaker: xiaozhe, bubbles: ["先铺一层赭石。"] }
  - { id: st_write_04, speaker: xiaozhe, bubbles: ["……", "这里再暗一点。"] }

sub_go_research:
  - { id: st_go_rs_rain, speaker: xiaozhe, when: sky_rain, bubbles: ["雨天，光是青灰的。", "我去画框架那边找{topic}。"] }
  - { id: st_go_rs_01, speaker: xiaozhe, bubbles: ["{topic}。我去翻翻画框架。"] }
  - { id: st_go_rs_02, speaker: xiaozhe, bubbles: ["旧画里该有。"] }
  - { id: st_go_rs_03, speaker: xiaozhe, bubbles: ["等一下。"] }

sub_back_research:
  - { id: st_back_rs_01, speaker: xiaozhe, bubbles: ["找到{count}张能用的。"] }
  - { id: st_back_rs_02, speaker: xiaozhe, bubbles: ["这张的颜色对。"] }
  - { id: st_back_rs_03, speaker: xiaozhe, bubbles: ["都在这儿了。", "灰的放左边，暖的放右边。"] }

sub_go_review:
  - { id: st_go_rv_01, speaker: xiaozhe, bubbles: ["我坐远一点看。"] }
  - { id: st_go_rv_02, speaker: xiaozhe, bubbles: ["窗边光好，我去那儿看看。"] }
  - { id: st_go_rv_03, speaker: xiaozhe, bubbles: ["眯着眼看，才看得出毛病。"] }

sub_back_review:
  - { id: st_back_rv_issue, speaker: xiaozhe, when: has_issues, bubbles: ["{issueCount}处发脏。", "用炭笔圈出来了。"] }
  - { id: st_back_rv_ok, speaker: xiaozhe, when: no_issues, bubbles: ["远看近看，都干净。"] }
  - { id: st_back_rv_ok2, speaker: xiaozhe, when: no_issues, bubbles: ["嗯。不用动了。"] }

sub_go_design:
  - { id: st_go_ds_rain, speaker: xiaozhe, when: sky_rain, bubbles: ["下雨天，颜色收一收。", "我去画架那边。"] }
  - { id: st_go_ds_01, speaker: xiaozhe, bubbles: ["我在画架上试几笔。"] }
  - { id: st_go_ds_02, speaker: xiaozhe, bubbles: ["先调五个颜色。"] }
  - { id: st_go_ds_03, speaker: xiaozhe, bubbles: ["底色，暖一点的米白。"] }

sub_back_design:
  - { id: st_back_ds_01, speaker: xiaozhe, bubbles: ["样子定了。", "五个颜色，从浅到深。"] }
  - { id: st_back_ds_02, speaker: xiaozhe, bubbles: ["色卡贴在画架上了。", "偏暖，久看不累。"] }
  - { id: st_back_ds_03, speaker: xiaozhe, bubbles: ["画好了。你看看。"] }

stuck:
  - { id: st_stuck_01, speaker: xiaozhe, bubbles: ["嗯？颜色发灰了。", "换个调法。"] }
  - { id: st_stuck_02, speaker: xiaozhe, bubbles: ["不对。{whatsWrong}。"] }
  - { id: st_stuck_03, speaker: xiaozhe, bubbles: ["又糊了。"] }
  - { id: st_stuck_04, speaker: xiaozhe, bubbles: ["……", "刮掉，重画。"] }

stuck_long:
  - { id: st_stuck_long_01, speaker: xiaozhe, bubbles: ["这块难画。", "要多试几层，你去忙。"] }
  - { id: st_stuck_long_02, speaker: xiaozhe, bubbles: ["还在画。"] }
  - { id: st_stuck_long_03, speaker: xiaozhe, bubbles: ["等它干一干，再来。"] }

waiting:
  - { id: st_wait_01, speaker: xiaozhe, bubbles: ["颜料还没干。"] }
  - { id: st_wait_02, speaker: xiaozhe, bubbles: ["等这层干透。"] }
  - { id: st_wait_03, speaker: xiaozhe, bubbles: ["窗外的天，是淡紫的。"] }

ask:
  - { id: st_ask_color, speaker: xiaozhe, when: demo_color, bubbles: ["奶油白，还是浅薄荷？", "你挑。"] }
  - { id: st_ask_01, speaker: xiaozhe, bubbles: ["问你一件事。", "{question}"] }
  - { id: st_ask_02, speaker: xiaozhe, bubbles: ["两种画法。", "你要哪种？"] }

react_adopted:
  - { id: st_react_ad_01, speaker: xiaozhe, bubbles: ["好，就这个。"] }
  - { id: st_react_ad_02, speaker: xiaozhe, bubbles: ["嗯。这个颜色对。"] }
  - { id: st_react_ad_03, speaker: xiaozhe, bubbles: ["记下了。"] }

react_rejected:
  - { id: st_react_rj_01, speaker: xiaozhe, bubbles: ["好，听你的。"] }
  - { id: st_react_rj_02, speaker: xiaozhe, bubbles: ["那这块颜色刮掉。"] }
  - { id: st_react_rj_03, speaker: xiaozhe, bubbles: ["嗯，换一个。"] }

react_delegated:
  - { id: st_react_dl_00, speaker: xiaozhe, bubbles: ["好，我来定。"] }
  - { id: st_react_dl_01, speaker: xiaozhe, bubbles: ["{choice}，因为{reason}。", "不喜欢就说。"] }
  - { id: st_react_dl_02, speaker: xiaozhe, bubbles: ["先用{choice}。", "不对再换。"] }
  - { id: st_react_dl_03, speaker: xiaozhe, bubbles: ["{choice}。", "为什么，我写在画背面了。"] }

serious:
  - { id: st_serious_01, speaker: xiaozhe, bubbles: ["这一步要{action}。", "做了，{consequence}。", "你看一下再定。"] }
  - { id: st_serious_02, speaker: xiaozhe, bubbles: ["这里要你点头。", "{action}，{consequence}。"] }
  - { id: st_serious_03, speaker: xiaozhe, bubbles: ["这一笔下去就盖不掉了。", "你看清楚。"] }

refused:
  - { id: st_refused_01, speaker: xiaozhe, bubbles: ["这个不碰。", "换条路。"] }
  - { id: st_refused_02, speaker: xiaozhe, bubbles: ["这不归我们画。"] }
  - { id: st_refused_03, speaker: xiaozhe, bubbles: ["那是你自己的东西。我不看。"] }

serious_yes:
  - { id: st_serious_yes_01, speaker: xiaozhe, bubbles: ["好。"] }
  - { id: st_serious_yes_02, speaker: xiaozhe, bubbles: ["知道了，画。"] }
  - { id: st_serious_yes_03, speaker: xiaozhe, bubbles: ["嗯，我来。"] }

serious_no:
  - { id: st_serious_no_01, speaker: xiaozhe, bubbles: ["好，不动它。", "换个不用这样的画法。"] }
  - { id: st_serious_no_02, speaker: xiaozhe, bubbles: ["好，先放着。"] }
  - { id: st_serious_no_03, speaker: xiaozhe, bubbles: ["不画了。绕开它。"] }

done:
  - { id: st_done_day, speaker: xiaozhe, when: daytime, bubbles: ["画好了，在画架上。", "趁亮，你看看。"] }
  - { id: st_done_dusk, speaker: xiaozhe, when: dusk, bubbles: ["好了。", "这会儿的光是橘色的，正好看。"] }
  - { id: st_done_night, speaker: xiaozhe, when: night, bubbles: ["好了。", "灯下颜色偏黄，明早再看一眼。"] }
  - { id: st_done_01, speaker: xiaozhe, bubbles: ["干透了，可以拿走。"] }
  - { id: st_done_02, speaker: xiaozhe, bubbles: ["好了。", "最后一笔，是一点白。"] }

failed:
  - { id: st_failed_01, speaker: xiaozhe, bubbles: ["这次没画成，对不起。", "卡在{stuckAt}。", "我记在速写本上了。", "下次换个画法。"] }
  - { id: st_failed_02, speaker: xiaozhe, bubbles: ["没画出来。", "卡在{stuckAt}。记下了。"] }
  - { id: st_failed_03, speaker: xiaozhe, bubbles: ["今天先到这儿。", "问题记在速写本上了。"] }

net_retry:
  - { id: st_net_retry_01, speaker: xiaozhe, bubbles: ["好像断电了。等等再试。"] }
  - { id: st_net_retry_02, speaker: xiaozhe, bubbles: ["电话没通。再拨一次。"] }
  - { id: st_net_retry_03, speaker: xiaozhe, bubbles: ["外面没人应。过会儿再问。"] }

cancelled:
  - { id: st_cancelled_01, speaker: xiaozhe, bubbles: ["好，先放着。"] }
  - { id: st_cancelled_02, speaker: xiaozhe, bubbles: ["行。画了的都留着。"] }
  - { id: st_cancelled_03, speaker: xiaozhe, bubbles: ["好，不画了。", "笔我先洗了。"] }

# 走进画室时小赭说的一句（plan-1.7.md G2，app/renderer/stage/shoptalk.ts）。有节日先说节日的，再看天气，
# 都没有就在时辰、季节和平常的里面挑。when：period_dawn/day/dusk/night、sky_rain 等、holiday_*、season_*。
shop_in:
  - { id: st_in_birthday, speaker: xiaozhe, when: birthday_xiaozhe, bubbles: ["今天我生日。", "画了张自己，不太像。"] }
  - { id: st_in_01, speaker: xiaozhe, bubbles: ["进来。", "颜料没干，别靠墙。"] }
  - { id: st_in_02, speaker: xiaozhe, bubbles: ["嗯，坐那张高凳。"] }
  - { id: st_in_03, speaker: xiaozhe, bubbles: ["门别关，松节油味重。"] }
  - { id: st_in_04, speaker: xiaozhe, bubbles: ["……", "来得正好，光刚转过来。"] }
  - { id: st_in_05, speaker: xiaozhe, bubbles: ["地上有颜料，踩着就带走了。"] }
  - { id: st_in_06, speaker: xiaozhe, bubbles: ["随便看。都没画完。"] }
  - { id: st_in_dawn_01, speaker: xiaozhe, when: period_dawn, bubbles: ["早。", "这会儿的光，是冷的。"] }
  - { id: st_in_dawn_02, speaker: xiaozhe, when: period_dawn, bubbles: ["我在等太阳爬到窗台。"] }
  - { id: st_in_day_01, speaker: xiaozhe, when: period_day, bubbles: ["中午光太平，我在洗笔。"] }
  - { id: st_in_dusk_01, speaker: xiaozhe, when: period_dusk, bubbles: ["傍晚的光最短，我得快点。"] }
  - { id: st_in_dusk_02, speaker: xiaozhe, when: period_dusk, bubbles: ["墙上的影子，变成紫的了。"] }
  - { id: st_in_night_01, speaker: xiaozhe, when: period_night, bubbles: ["晚了。", "灯下看颜色不准，我只收拾。"] }
  - { id: st_in_night_02, speaker: xiaozhe, when: period_night, bubbles: ["夜里我只画素描。"] }
  - { id: st_in_rain_01, speaker: xiaozhe, when: sky_rain, bubbles: ["下雨，光是灰的。", "伞放门口那个桶里。"] }
  - { id: st_in_snow_01, speaker: xiaozhe, when: sky_snow, bubbles: ["进来。雪把屋里照亮了。"] }
  - { id: st_in_spring_01, speaker: xiaozhe, when: season_spring, bubbles: ["开春了，窗外的绿太多，调不出来。"] }
  - { id: st_in_summer_01, speaker: xiaozhe, when: season_summer, bubbles: ["热，颜料干得比我快。"] }
  - { id: st_in_autumn_01, speaker: xiaozhe, when: season_autumn, bubbles: ["秋天了，赭石用得最快。"] }
  - { id: st_in_winter_01, speaker: xiaozhe, when: season_winter, bubbles: ["屋里冷，先把手暖一暖。"] }
  - { id: st_in_new_year, speaker: xiaozhe, when: holiday_new_year, bubbles: ["过年好。", "门神是我画的，左右不太一样。"] }
  - { id: st_in_lantern, speaker: xiaozhe, when: holiday_lantern, bubbles: ["元宵。", "我在给一盏灯描荷花。"] }
  - { id: st_in_dragon_boat, speaker: xiaozhe, when: holiday_dragon_boat, bubbles: ["端午。", "龙舟的龙眼，是我点的。"] }
  - { id: st_in_mid_autumn, speaker: xiaozhe, when: holiday_mid_autumn, bubbles: ["中秋。", "月亮我画了三回，都太圆。"] }
  - { id: st_in_halloween, speaker: xiaozhe, when: holiday_halloween, bubbles: ["南瓜我画了，没刻。"] }
  - { id: st_in_christmas, speaker: xiaozhe, when: holiday_christmas, bubbles: ["圣诞。", "窗玻璃上画了点雪，洗得掉。"] }

# 店里没活时小赭隔一会儿说一句：笔、颜料、窗外的光、街坊、收工。when 同上，不写就是什么时候都行。
shop_idle:
  - { id: st_idle_01, speaker: xiaozhe, bubbles: ["……", "这块蓝，再灰一点。"] }
  - { id: st_idle_02, speaker: xiaozhe, bubbles: ["笔洗该换水了。"] }
  - { id: st_idle_03, speaker: xiaozhe, bubbles: ["这支笔掉毛了。"] }
  - { id: st_idle_04, speaker: xiaozhe, bubbles: ["白颜料用得最快。"] }
  - { id: st_idle_05, speaker: xiaozhe, bubbles: ["画布绷紧了，敲着像鼓。"] }
  - { id: st_idle_06, speaker: xiaozhe, bubbles: ["调色板上那块，已经干成石头了。"] }
  - { id: st_idle_07, speaker: xiaozhe, bubbles: ["画倒过来看，才知道哪儿不对。"] }
  - { id: st_idle_08, speaker: xiaozhe, bubbles: ["退后三步再看。"] }
  - { id: st_idle_09, speaker: xiaozhe, bubbles: ["影子不是黑的。"] }
  - { id: st_idle_10, speaker: xiaozhe, bubbles: ["窗台上的苹果，画完就该吃了。"] }
  - { id: st_idle_11, speaker: xiaozhe, bubbles: ["胶带撕下来，边是齐的。"] }
  - { id: st_idle_12, speaker: xiaozhe, bubbles: ["这层还湿，下一层等明天。"] }
  - { id: st_idle_13, speaker: xiaozhe, bubbles: ["青黛来过，借走一管群青。"] }
  - { id: st_idle_14, speaker: xiaozhe, bubbles: ["阿灯送单子来，站着看了半天画。"] }
  - { id: st_idle_15, speaker: xiaozhe, bubbles: ["芳姐送的花，我画了两天。", "花先谢了。"] }
  - { id: st_idle_16, speaker: xiaozhe, bubbles: ["陈婆婆想要张老街的画，我在打稿。"] }
  - { id: st_idle_17, speaker: xiaozhe, bubbles: ["桂姨拿面包换了一张小画。"] }
  - { id: st_idle_18, speaker: xiaozhe, bubbles: ["门口有个孩子，看我画了好久。"] }
  - { id: st_idle_19, speaker: xiaozhe, bubbles: ["墙上的画，又多了一张。"] }
  - { id: st_idle_20, speaker: xiaozhe, bubbles: ["松节油快见底了。"] }
  - { id: st_idle_dawn_01, speaker: xiaozhe, when: period_dawn, bubbles: ["天刚亮，颜色还没醒。"] }
  - { id: st_idle_dawn_02, speaker: xiaozhe, when: period_dawn, bubbles: ["早上的光，只有半个钟头。"] }
  - { id: st_idle_day_01, speaker: xiaozhe, when: period_day, bubbles: ["中午光直，没有影子，我歇着。"] }
  - { id: st_idle_dusk_01, speaker: xiaozhe, when: period_dusk, bubbles: ["光变橙了，这张先停。"] }
  - { id: st_idle_dusk_02, speaker: xiaozhe, when: period_dusk, bubbles: ["傍晚的窗，比画好看。"] }
  - { id: st_idle_night_01, speaker: xiaozhe, when: period_night, bubbles: ["夜里不调色，只洗笔。"] }
  - { id: st_idle_night_02, speaker: xiaozhe, when: period_night, bubbles: ["灯下画素描，铅笔声沙沙的。"] }
  - { id: st_idle_rain_01, speaker: xiaozhe, when: sky_rain, bubbles: ["雨天，画干得慢。"] }
  - { id: st_idle_rain_02, speaker: xiaozhe, when: sky_rain, bubbles: ["窗上的雨痕，我描了一道。"] }
  - { id: st_idle_snow_01, speaker: xiaozhe, when: sky_snow, bubbles: ["雪地上的影子，是蓝的。"] }
  - { id: st_idle_snow_02, speaker: xiaozhe, when: sky_snow, bubbles: ["雪天，我只用三种颜色。"] }
  - { id: st_idle_petals_01, speaker: xiaozhe, when: sky_petals, bubbles: ["花瓣落在调色板上，粉的。"] }
  - { id: st_idle_leaves_01, speaker: xiaozhe, when: sky_leaves, bubbles: ["一片叶子贴在窗上，像画上去的。"] }
  - { id: st_idle_spring_01, speaker: xiaozhe, when: season_spring, bubbles: ["春天的光是黄绿的。"] }
  - { id: st_idle_spring_02, speaker: xiaozhe, when: season_spring, bubbles: ["柳絮粘在湿画上，挑不干净。"] }
  - { id: st_idle_summer_01, speaker: xiaozhe, when: season_summer, bubbles: ["夏天的影子短，硬。"] }
  - { id: st_idle_summer_02, speaker: xiaozhe, when: season_summer, bubbles: ["电扇不能对着画吹。"] }
  - { id: st_idle_autumn_01, speaker: xiaozhe, when: season_autumn, bubbles: ["秋天光斜，影子拖得老长。"] }
  - { id: st_idle_autumn_02, speaker: xiaozhe, when: season_autumn, bubbles: ["窗外的树，一天换一个颜色。"] }
  - { id: st_idle_winter_01, speaker: xiaozhe, when: season_winter, bubbles: ["冬天的光，四点就走了。"] }
  - { id: st_idle_winter_02, speaker: xiaozhe, when: season_winter, bubbles: ["颜料冻稠了，挤不出来。"] }
  - { id: st_idle_halloween_01, speaker: xiaozhe, when: holiday_halloween, bubbles: ["南瓜的橙，我调了好几回。"] }
  - { id: st_idle_christmas_01, speaker: xiaozhe, when: holiday_christmas, bubbles: ["窗上画的雪，有人以为是真的。"] }
  - { id: st_idle_new_year_01, speaker: xiaozhe, when: holiday_new_year, bubbles: ["门神的胡子，又补了几笔。"] }
  - { id: st_idle_lantern_01, speaker: xiaozhe, when: holiday_lantern, bubbles: ["灯纸透光，颜色得调浅。"] }
  - { id: st_idle_dragon_boat_01, speaker: xiaozhe, when: holiday_dragon_boat, bubbles: ["龙舟的漆，三天没干透。"] }
  - { id: st_idle_mid_autumn_01, speaker: xiaozhe, when: holiday_mid_autumn, bubbles: ["月光下看颜色，全是银的。"] }
  - { id: st_cin_01, speaker: xiaozhe, bubbles: ["朱砂今天游得慢。"] }
  - { id: st_cin_02, speaker: xiaozhe, bubbles: ["朱砂这个红，我调不出来。"] }
  - { id: st_cin_03, speaker: xiaozhe, bubbles: ["换了水，朱砂转了三圈。"] }
  - { id: st_cin_04, speaker: xiaozhe, bubbles: ["朱砂是集市上拿画换的。"] }
  - { id: st_cin_05, speaker: xiaozhe, bubbles: ["窗台的光，正好照着朱砂。"] }
  - { id: st_cin_06, speaker: xiaozhe, when: period_night, bubbles: ["朱砂还醒着，我也是。"] }
  - { id: st_cin_07, speaker: xiaozhe, when: sky_rain, bubbles: ["下雨天，朱砂贴着缸边游。"] }
