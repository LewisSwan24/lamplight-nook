# Dialogue for the post office (plan-1.6.md F2), laid over lines/cafe.yaml: same format, same rules.
# Axin the postman does all the work; Adeng only brings the order over and answers now and then.
# Spots: 邮局柜台 (counter), 分信格 (board), 包裹架 (shelf), 打包桌 (table), 邮筒 (corner).

opening:
  - { id: po_revise_again_01, speaker: axin, when: revise_again, bubbles: ["上回改的是{lastAsk}。", "这回{brief}，收到。"] }
  - { id: po_revise_01, speaker: axin, when: revise, bubbles: ["{brief}？行。", "信封还没封口，好改。"] }
  - { id: po_revise_02, speaker: axin, when: revise, bubbles: ["退回来改改，常有的事。", "{brief}，我来。"] }
  - { id: po_revise_03, speaker: axin, when: revise, bubbles: ["旧的那份我存着底。", "{brief}，改好了喊你。"] }
  - { id: po_mem_02, speaker: axin, when: has_stuck_note, bubbles: ["{brief}，收到。", "上回在{stuckNote}卡过。", "这回我先绕开那段路。"] }
  - { id: po_mem_01, speaker: axin, when: has_memory, bubbles: ["{brief}，收到。", "上回你挑的{lastChoice}。", "还照那个样子来。"] }
  - { id: po_tpl_card_01, speaker: axin, when: tpl_card, bubbles: ["做贺卡啊，我这儿天天经手。", "名字照你给的写，一笔不差。"] }
  - { id: po_tpl_card_02, speaker: axin, when: tpl_card, bubbles: ["贺卡要一拿到手就笑。", "字少点，心意写足。"] }
  - { id: po_tpl_newsletter_01, speaker: axin, when: tpl_newsletter, bubbles: ["出简报？我送过的简报可多了。", "要紧的放头一条。"] }
  - { id: po_tpl_newsletter_02, speaker: axin, when: tpl_newsletter, bubbles: ["日子和地点我单列一栏。", "贴墙上一眼就看见。"] }
  - { id: po_handed_01, speaker: axin, when: handed, bubbles: ["东西收到了，我先拆开看看。", "{brief}，收到。"] }
  - { id: po_opening_01, speaker: axin, bubbles: ["{brief}？", "好，我把邮包放下。"] }
  - { id: po_opening_02, speaker: axin, bubbles: ["{brief}……", "早班信刚分完，来得巧。"] }
  - { id: po_opening_03, speaker: axin, bubbles: ["来活了。", "{brief}，我先登个记。"] }

planning:
  - { id: po_plan_01, speaker: axin, bubbles: ["先排排路线，跟送信一个理。"] }
  - { id: po_plan_02, speaker: axin, bubbles: ["哪家先送呢……"] }
  - { id: po_plan_03, speaker: axin, bubbles: ["三站，一站一站跑。"] }

draft_ready:
  - { id: po_draft_ready_01, speaker: axin, bubbles: ["信写好了，在柜台上。", "邮票没贴，你看完自己寄。"] }
  - { id: po_draft_ready_02, speaker: axin, bubbles: ["草稿好了。", "寄不寄你说了算。"] }
  - { id: po_draft_ready_03, speaker: axin, bubbles: ["信没投，我压在邮戳底下了。"] }

writing:
  - { id: po_write_01, speaker: axin, bubbles: ["开工。"] }
  - { id: po_write_02, speaker: axin, bubbles: ["这封分好了，下一封。"] }
  - { id: po_write_03, speaker: axin, bubbles: ["嗯……", "这个地址写得清楚。"] }
  - { id: po_write_04, speaker: axin, bubbles: ["先装进信封，邮票后面再挑。"] }

sub_go_research:
  - { id: po_go_rs_rain, speaker: axin, when: sky_rain, bubbles: ["下雨了，包裹别淋着。", "我去架子上找{topic}。"] }
  - { id: po_go_rs_01, speaker: axin, bubbles: ["{topic}？我去包裹架那儿翻翻。"] }
  - { id: po_go_rs_02, speaker: axin, bubbles: ["我记得登在哪本簿子上……"] }
  - { id: po_go_rs_03, speaker: axin, bubbles: ["老底子都捆在架子后头。"] }

sub_back_research:
  - { id: po_back_rs_01, speaker: axin, bubbles: ["找着了。", "用得上的有{count}样。"] }
  - { id: po_back_rs_02, speaker: axin, bubbles: ["这个对得上。", "跟街坊们说的一样。"] }
  - { id: po_back_rs_03, speaker: axin, bubbles: ["都在这儿，按门牌号排好了。"] }

sub_go_review:
  - { id: po_go_rv_01, speaker: axin, bubbles: ["我在打包桌上过一遍。"] }
  - { id: po_go_rv_02, speaker: axin, bubbles: ["地址对没对，得一个个看。"] }
  - { id: po_go_rv_03, speaker: axin, bubbles: ["一封一封对过去。"] }

sub_back_review:
  - { id: po_back_rv_issue, speaker: axin, when: has_issues, bubbles: ["有{issueCount}处对不上。", "我都夹了张小纸条。"] }
  - { id: po_back_rv_ok, speaker: axin, when: no_issues, bubbles: ["从头到尾对过了，没错投的。"] }
  - { id: po_back_rv_ok2, speaker: axin, when: no_issues, bubbles: ["核过了，地址门牌都对。"] }

sub_go_design:
  - { id: po_go_ds_rain, speaker: axin, when: sky_rain, bubbles: ["下雨天，没人来寄信。", "我在分信格边上画画样子。"] }
  - { id: po_go_ds_01, speaker: axin, bubbles: ["我在分信格边上比划比划。"] }
  - { id: po_go_ds_02, speaker: axin, bubbles: ["摆成什么样好看呢……"] }
  - { id: po_go_ds_03, speaker: axin, bubbles: ["先拿旧信封剪个样子。"] }

sub_back_design:
  - { id: po_back_ds_01, speaker: axin, bubbles: ["样子定了。", "像张好看的明信片。"] }
  - { id: po_back_ds_02, speaker: axin, bubbles: ["剪好了，你瞧瞧。"] }
  - { id: po_back_ds_03, speaker: axin, bubbles: ["摆了三种，我看中间那个好。"] }

stuck:
  - { id: po_stuck_01, speaker: axin, bubbles: ["哎？查无此人。", "换个法子试试。"] }
  - { id: po_stuck_02, speaker: axin, bubbles: ["不对。{whatsWrong}。"] }
  - { id: po_stuck_03, speaker: axin, bubbles: ["邮戳盖歪了……"] }
  - { id: po_stuck_04, speaker: axin, bubbles: ["投错格子了。", "重新分。"] }

stuck_long:
  - { id: po_stuck_long_01, speaker: axin, bubbles: ["这个费工夫。", "我多跑几趟，你先忙。"] }
  - { id: po_stuck_long_02, speaker: axin, bubbles: ["还在弄，没撂下。"] }
  - { id: po_stuck_long_03, speaker: axin, bubbles: ["再等等，这条路绕。"] }

waiting:
  - { id: po_wait_01, speaker: axin, bubbles: ["在路上了，等等。"] }
  - { id: po_wait_02, speaker: axin, bubbles: ["还没回信，再等等。"] }
  - { id: po_wait_03, speaker: axin, bubbles: ["急不得，邮车到了自然有。"] }

ask:
  - { id: po_ask_color, speaker: axin, when: demo_color, bubbles: ["奶油白和浅薄荷，我各刷了一张卡。", "你要哪个？"] }
  - { id: po_ask_01, speaker: axin, bubbles: ["问你个事儿。", "{question}"] }
  - { id: po_ask_02, speaker: axin, bubbles: ["这儿有两条路能走。", "你挑一条？"] }

react_adopted:
  - { id: po_react_ad_01, speaker: axin, bubbles: ["好，就这么寄。"] }
  - { id: po_react_ad_02, speaker: axin, bubbles: ["记下了，写在黑板上。"] }
  - { id: po_react_ad_03, speaker: axin, bubbles: ["我也挑这个。"] }

react_rejected:
  - { id: po_react_rj_01, speaker: axin, bubbles: ["行，听你的。"] }
  - { id: po_react_rj_02, speaker: axin, bubbles: ["那这张我留着下回用。"] }
  - { id: po_react_rj_03, speaker: axin, bubbles: ["好，换一张。"] }

react_delegated:
  - { id: po_react_dl_00, speaker: axin, bubbles: ["好，我来定。", "定了跟你说。"] }
  - { id: po_react_dl_01, speaker: axin, bubbles: ["那就{choice}，因为{reason}。", "不合适随时说。"] }
  - { id: po_react_dl_02, speaker: axin, bubbles: ["先寄{choice}试试。", "不好再换。"] }
  - { id: po_react_dl_03, speaker: axin, bubbles: ["就{choice}。", "为什么，我写在黑板上了。"] }

serious:
  - { id: po_serious_01, speaker: axin, bubbles: ["这一步要{action}。", "做了就{consequence}。", "你看一眼再定。"] }
  - { id: po_serious_02, speaker: axin, bubbles: ["这儿我不敢乱动。", "{action}，{consequence}。"] }
  - { id: po_serious_03, speaker: axin, bubbles: ["这个投进邮筒就拿不回来了。", "你看清楚再点。"] }

refused:
  - { id: po_refused_01, speaker: axin, bubbles: ["这个不能碰。", "换条路。"] }
  - { id: po_refused_02, speaker: axin, bubbles: ["这不归我们动手。"] }
  - { id: po_refused_03, speaker: axin, bubbles: ["别人的信，我不拆。"] }

serious_yes:
  - { id: po_serious_yes_01, speaker: axin, bubbles: ["好，我来。"] }
  - { id: po_serious_yes_02, speaker: axin, bubbles: ["知道了，这就动手。"] }
  - { id: po_serious_yes_03, speaker: axin, bubbles: ["妥。"] }

serious_no:
  - { id: po_serious_no_01, speaker: axin, bubbles: ["好，不碰它。", "我换个不用这样的法子。"] }
  - { id: po_serious_no_02, speaker: axin, bubbles: ["好，先压着。"] }
  - { id: po_serious_no_03, speaker: axin, bubbles: ["不弄了，我绕过去。"] }

done:
  - { id: po_done_day, speaker: axin, when: daytime, bubbles: ["好了，在柜台上。", "趁亮看。"] }
  - { id: po_done_dusk, speaker: axin, when: dusk, bubbles: ["好了。", "天快黑了，正好收班。"] }
  - { id: po_done_night, speaker: axin, when: night, bubbles: ["好了。", "这么晚了，看完早点睡。"] }
  - { id: po_done_01, speaker: axin, bubbles: ["送到了，一封没丢。"] }
  - { id: po_done_02, speaker: axin, bubbles: ["好了，拿去就能用。", "我从头对了两遍。"] }

failed:
  - { id: po_failed_01, speaker: axin, bubbles: ["这回没送到，对不住。", "卡在{stuckAt}。", "我记在黑板上了。", "下回换条路。"] }
  - { id: po_failed_02, speaker: axin, bubbles: ["没送到。", "卡在{stuckAt}，记下了。"] }
  - { id: po_failed_03, speaker: axin, bubbles: ["今天先到这儿。", "毛病我写在黑板上了。"] }

net_retry:
  - { id: po_net_retry_01, speaker: axin, bubbles: ["线路好像断了，我等等再试。"] }
  - { id: po_net_retry_02, speaker: axin, bubbles: ["那头没人应，我再敲敲门。"] }
  - { id: po_net_retry_03, speaker: axin, bubbles: ["邮车还没来，过会儿再问。"] }

cancelled:
  - { id: po_cancelled_01, speaker: axin, bubbles: ["好，那先放着。"] }
  - { id: po_cancelled_02, speaker: axin, bubbles: ["行，做好的都留着。"] }
  - { id: po_cancelled_03, speaker: axin, bubbles: ["好，不寄了。", "信我收进抽屉，明天还能用。"] }

# 走进邮局时阿信说的一句（plan-1.6.md F5，app/renderer/stage/shoptalk.ts）。有节日先说节日的，再看天气，
# 都没有就在时辰、季节和平常的里面挑。when：period_dawn/day/dusk/night、sky_rain 等、holiday_*、season_*。
shop_in:
  - { id: po_in_birthday, speaker: axin, when: birthday_axin, bubbles: ["今天我生日。", "有人寄了张卡给我，头一回。"] }
  - { id: po_in_01, speaker: axin, bubbles: ["来啦，寄东西还是取东西？"] }
  - { id: po_in_02, speaker: axin, bubbles: ["进来吧，柜台上那杆秤别碰。"] }
  - { id: po_in_03, speaker: axin, bubbles: ["稍等，这格信我分完。"] }
  - { id: po_in_04, speaker: axin, bubbles: ["门上的铃该换了，你一推它就叫。"] }
  - { id: po_in_05, speaker: axin, bubbles: ["来得正好，邮戳刚上了新印泥。"] }
  - { id: po_in_dawn_01, speaker: axin, when: period_dawn, bubbles: ["这么早？", "早班车的信还没到。"] }
  - { id: po_in_dawn_02, speaker: axin, when: period_dawn, bubbles: ["我刚把邮包背上，还没出门。"] }
  - { id: po_in_day_01, speaker: axin, when: period_day, bubbles: ["我刚送完一圈回来，腿还热着。"] }
  - { id: po_in_dusk_01, speaker: axin, when: period_dusk, bubbles: ["晚班的车还有一个钟头。"] }
  - { id: po_in_dusk_02, speaker: axin, when: period_dusk, bubbles: ["今天的信送完了，进来歇歇。"] }
  - { id: po_in_night_01, speaker: axin, when: period_night, bubbles: ["关门了，不过你进来吧。"] }
  - { id: po_in_night_02, speaker: axin, when: period_night, bubbles: ["这么晚，信也睡了。"] }
  - { id: po_in_rain_01, speaker: axin, when: sky_rain, bubbles: ["下雨了，信封都得套袋子。"] }
  - { id: po_in_snow_01, speaker: axin, when: sky_snow, bubbles: ["雪这么大，你还出门？", "进来跺跺脚。"] }
  - { id: po_in_spring_01, speaker: axin, when: season_spring, bubbles: ["开春了，寄种子的人多。"] }
  - { id: po_in_summer_01, speaker: axin, when: season_summer, bubbles: ["热吧，电扇对着你吹。"] }
  - { id: po_in_autumn_01, speaker: axin, when: season_autumn, bubbles: ["秋天了，开学的包裹一大堆。"] }
  - { id: po_in_winter_01, speaker: axin, when: season_winter, bubbles: ["冬天了，年货包裹快来了。"] }
  - { id: po_in_new_year, speaker: axin, when: holiday_new_year, bubbles: ["过年好。", "贺年卡我这儿一摞一摞的。"] }
  - { id: po_in_lantern, speaker: axin, when: holiday_lantern, bubbles: ["元宵好，灯谜贴在柜台边。"] }
  - { id: po_in_dragon_boat, speaker: axin, when: holiday_dragon_boat, bubbles: ["端午好，寄粽子的都排着呢。"] }
  - { id: po_in_mid_autumn, speaker: axin, when: holiday_mid_autumn, bubbles: ["中秋好，月饼盒子压了一架子。"] }
  - { id: po_in_halloween, speaker: axin, when: holiday_halloween, bubbles: ["有人寄了个南瓜，我不敢摔。"] }
  - { id: po_in_christmas, speaker: axin, when: holiday_christmas, bubbles: ["圣诞卡比平时多三倍。"] }
  - { id: po_in_halloween_2, speaker: axin, when: holiday_halloween, bubbles: ["万圣节好，柜台上有糖。"] }
  - { id: po_in_halloween_3, speaker: axin, when: holiday_halloween, bubbles: ["南瓜明信片卖光了。"] }
  - { id: po_in_christmas_2, speaker: axin, when: holiday_christmas, bubbles: ["圣诞好，最后一班车下午三点。"] }
  - { id: po_in_christmas_3, speaker: axin, when: holiday_christmas, bubbles: ["寄国外的卡，今天是最后一天。"] }
  - { id: po_in_new_year_2, speaker: axin, when: holiday_new_year, bubbles: ["过年好，寄回老家的往这边。"] }
  - { id: po_in_new_year_3, speaker: axin, when: holiday_new_year, bubbles: ["红包袋免费拿，一人两个。"] }
  - { id: po_in_lantern_2, speaker: axin, when: holiday_lantern, bubbles: ["元宵好，今天我早点关门。"] }
  - { id: po_in_lantern_3, speaker: axin, when: holiday_lantern, bubbles: ["猜中灯谜的，送一张邮票。"] }
  - { id: po_in_dragon_boat_2, speaker: axin, when: holiday_dragon_boat, bubbles: ["粽子寄不了太远，会坏。"] }
  - { id: po_in_dragon_boat_3, speaker: axin, when: holiday_dragon_boat, bubbles: ["端午好，门上挂了艾草。"] }
  - { id: po_in_mid_autumn_2, speaker: axin, when: holiday_mid_autumn, bubbles: ["中秋好，月饼寄出去要包两层。"] }
  - { id: po_in_mid_autumn_3, speaker: axin, when: holiday_mid_autumn, bubbles: ["今天的信，好几封写着团圆。"] }

# 店里没活时阿信隔一会儿说一句：天气、季节、送信时的事、街坊、收工。when 同上，不写就是什么时候都行。
shop_idle:
  - { id: po_idle_01, speaker: axin, bubbles: ["这格是三号楼的，又满了。"] }
  - { id: po_idle_02, speaker: axin, bubbles: ["邮戳得按直，歪了不好看。"] }
  - { id: po_idle_03, speaker: axin, bubbles: ["秤又差了二两，该校了。"] }
  - { id: po_idle_04, speaker: axin, bubbles: ["这封的字，像是小孩写的。"] }
  - { id: po_idle_05, speaker: axin, bubbles: ["邮票贴倒了，照样能寄。"] }
  - { id: po_idle_06, speaker: axin, bubbles: ["包裹架最上面那层，放轻的。"] }
  - { id: po_idle_07, speaker: axin, bubbles: ["车胎有点软，老周那儿打个气。"] }
  - { id: po_idle_08, speaker: axin, bubbles: ["这条街我闭着眼都能送。"] }
  - { id: po_idle_09, speaker: axin, bubbles: ["退回来的信，得一封封登记。"] }
  - { id: po_idle_10, speaker: axin, bubbles: ["胶带用完一卷了。"] }
  - { id: po_idle_11, speaker: axin, bubbles: ["软木板上的卡，越钉越多。"] }
  - { id: po_idle_12, speaker: axin, bubbles: ["有封信寄了三年才到。", "地址早就换了。"] }
  - { id: po_idle_13, speaker: axin, bubbles: ["陈婆婆的信今天没有。", "明天准有。"] }
  - { id: po_idle_14, speaker: axin, bubbles: ["桂姨给我留了个面包，还热着。"] }
  - { id: po_idle_15, speaker: axin, bubbles: ["小禾的稿费单到了，薄薄一张。"] }
  - { id: po_idle_16, speaker: axin, bubbles: ["老周的零件又从外地寄来了。"] }
  - { id: po_idle_17, speaker: axin, bubbles: ["芳姐来寄花种，包了三层。"] }
  - { id: po_idle_18, speaker: axin, bubbles: ["吴阿姨的简报，我帮她贴楼下了。"] }
  - { id: po_idle_19, speaker: axin, bubbles: ["小灯屋的信，我都放最上面。"] }
  - { id: po_idle_20, speaker: axin, bubbles: ["门口有人张望半天，问的是路。"] }
  - { id: po_idle_21, speaker: axin, bubbles: ["有人寄了只空信封，写着回信。"] }
  - { id: po_idle_22, speaker: axin, bubbles: ["邮包的扣子又松了。"] }
  - { id: po_idle_23, speaker: axin, bubbles: ["老马寄了一箱辣酱回老家。"] }
  - { id: po_idle_24, speaker: axin, bubbles: ["小林天天问有没有他的信。"] }
  - { id: po_idle_dawn_01, speaker: axin, when: period_dawn, bubbles: ["早班车的信，先分后送。"] }
  - { id: po_idle_dawn_02, speaker: axin, when: period_dawn, bubbles: ["面包房的灯亮了，我也该走了。"] }
  - { id: po_idle_day_01, speaker: axin, when: period_day, bubbles: ["下午还有一趟，送街尾那几家。"] }
  - { id: po_idle_dusk_01, speaker: axin, when: period_dusk, bubbles: ["晚班车来了，我去接一下。"] }
  - { id: po_idle_dusk_02, speaker: axin, when: period_dusk, bubbles: ["今天的账对一对就下班。"] }
  - { id: po_idle_night_01, speaker: axin, when: period_night, bubbles: ["邮筒我锁好了，明天一早开。"] }
  - { id: po_idle_night_02, speaker: axin, when: period_night, bubbles: ["收工了，邮包挂回钩子上。"] }
  - { id: po_idle_night_03, speaker: axin, when: period_night, bubbles: ["明天的信，今晚先排好路线。"] }
  - { id: po_idle_rain_01, speaker: axin, when: sky_rain, bubbles: ["下雨天的信，最怕糊了字。"] }
  - { id: po_idle_rain_02, speaker: axin, when: sky_rain, bubbles: ["雨衣挂门后，还在滴水。"] }
  - { id: po_idle_snow_01, speaker: axin, when: sky_snow, bubbles: ["雪天车骑不动，得走着送。"] }
  - { id: po_idle_snow_02, speaker: axin, when: sky_snow, bubbles: ["那条旧围巾，今天又戴上了。"] }
  - { id: po_idle_petals_01, speaker: axin, when: sky_petals, bubbles: ["信封里夹进一片花瓣，算送的。"] }
  - { id: po_idle_leaves_01, speaker: axin, when: sky_leaves, bubbles: ["叶子落进邮筒里了，我去掏。"] }
  - { id: po_idle_spring_01, speaker: axin, when: season_spring, bubbles: ["春天信少，包裹多。"] }
  - { id: po_idle_spring_02, speaker: axin, when: season_spring, bubbles: ["燕子又在门檐上做窝了。"] }
  - { id: po_idle_summer_01, speaker: axin, when: season_summer, bubbles: ["夏天的明信片，都是海。"] }
  - { id: po_idle_summer_02, speaker: axin, when: season_summer, bubbles: ["中午太晒，我晚点再出门。"] }
  - { id: po_idle_autumn_01, speaker: axin, when: season_autumn, bubbles: ["秋天寄来的信，都带点桂花味。"] }
  - { id: po_idle_autumn_02, speaker: axin, when: season_autumn, bubbles: ["开学了，录取通知书我亲手送。"] }
  - { id: po_idle_winter_01, speaker: axin, when: season_winter, bubbles: ["年底包裹多，架子快放不下。"] }
  - { id: po_idle_winter_02, speaker: axin, when: season_winter, bubbles: ["手冻僵了，邮戳都按不稳。"] }
  - { id: po_idle_halloween_01, speaker: axin, when: holiday_halloween, bubbles: ["这个南瓜包裹，我一路抱着。"] }
  - { id: po_idle_halloween_02, speaker: axin, when: holiday_halloween, bubbles: ["有封信画满了蝙蝠。"] }
  - { id: po_idle_christmas_01, speaker: axin, when: holiday_christmas, bubbles: ["一张卡写了三种语言。"] }
  - { id: po_idle_christmas_02, speaker: axin, when: holiday_christmas, bubbles: ["邮袋装不下，又拿了一个。"] }
  - { id: po_idle_new_year_01, speaker: axin, when: holiday_new_year, bubbles: ["这摞贺年卡，一半是寄给奶奶的。"] }
  - { id: po_idle_new_year_02, speaker: axin, when: holiday_new_year, bubbles: ["红包袋又补了一箱。"] }
  - { id: po_idle_lantern_01, speaker: axin, when: holiday_lantern, bubbles: ["灯谜贴歪了，我再贴一遍。"] }
  - { id: po_idle_lantern_02, speaker: axin, when: holiday_lantern, bubbles: ["这封信里夹着一张灯谜。"] }
  - { id: po_idle_dragon_boat_01, speaker: axin, when: holiday_dragon_boat, bubbles: ["寄粽子的盒子都不够用了。"] }
  - { id: po_idle_dragon_boat_02, speaker: axin, when: holiday_dragon_boat, bubbles: ["艾草的味儿把邮票都熏香了。"] }
  - { id: po_idle_mid_autumn_01, speaker: axin, when: holiday_mid_autumn, bubbles: ["月饼盒子压得架子直响。"] }
  - { id: po_idle_mid_autumn_02, speaker: axin, when: holiday_mid_autumn, bubbles: ["这封信写着：今年回不去了。"] }
