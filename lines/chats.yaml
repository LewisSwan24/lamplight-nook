# Small talk between the staff, so the shop feels lived in (story.md section 4).
# Each chat is a few turns; every turn is one bubble (max 20 characters, same writing rules as cafe.yaml).
# when: idle = no commission running; waiting = a long command is running and everyone is waiting.
# period (optional): only at this time of day (dawn, day, dusk, night).

- id: sugar
  when: idle
  turns:
    - xiaoju: 阿灯，你茶里我又放了一勺糖。
    - adeng: ……我说今天怎么这么好喝。

- id: mallet
  when: idle
  turns:
    - laoshi: 我的木槌。
    - xiaoju: 不知道呀。
    - laoshi: ……

- id: sunset
  when: idle
  period: dusk
  turns:
    - xiaoju: 今天的晚霞像橘子汽水。
    - laoshi: 像铁锈。
    - xiaoju: 你这人真没意思。

- id: chair
  when: idle
  turns:
    - laoshi: 这把椅子又晃了。
    - adeng: 上周不是修过吗？
    - laoshi: 嗯。所以再修一次。

- id: scarf
  when: idle
  turns:
    - laoshi: 围巾。
    - xiaoju: 啊，又掉了？
    - laoshi: 挂门后了。

- id: notebook
  when: idle
  turns:
    - xiaoju: 阿灯，你那个小本子里写我什么了？
    - adeng: 写你上周欠我三块饼干。
    - xiaoju: ……那是借的。

- id: windowsill
  when: idle
  turns:
    - xiaoju: 栗子今天又占了窗台。
    - adeng: 那是她的位置。
    - laoshi: 我的椅子也是她的。

- id: cold_tea
  when: idle
  turns:
    - adeng: 茶又凉了。
    - laoshi: 那就再泡一壶。
    - adeng: 你帮我看着水。
    - laoshi: 嗯。

- id: bakery
  when: idle
  period: day
  turns:
    - xiaoju: 对面面包店换招牌了。
    - adeng: 换成什么了？
    - xiaoju: 还是面包。然后字大了一点。

- id: table_leg
  when: idle
  turns:
    - laoshi: 这桌子腿短了一毫米。
    - xiaoju: 你怎么看出来的？
    - laoshi: 敲出来的。

- id: biscuit
  when: waiting
  turns:
    - adeng: 还得一会儿。
    - xiaoju: 那我能先吃一块饼干吗？
    - adeng: 吃吧，给老石留一块。
    - laoshi: 不用。

- id: kettle
  when: waiting
  turns:
    - xiaoju: 它还在跑吗？
    - adeng: 在跑。我们泡壶茶。
    - laoshi: 我来烧水。

- id: sketch
  when: waiting
  turns:
    - adeng: 这一步要等一会儿。
    - xiaoju: 那我画一下栗子。
    - laoshi: 画得像一点。

# Weather and holidays (sky: rain, snow, petals, leaves; holiday: halloween, christmas, new_year).
# They come up before the everyday chats while they fit.
- id: rain_umbrella
  when: idle
  sky: rain
  turns:
    - xiaoju: 下雨了，伞我放门口了。
    - adeng: 待会儿出门记得拿上。

- id: rain_fix
  when: idle
  sky: rain
  turns:
    - laoshi: 雨天，适合修东西。
    - xiaoju: 你哪天不修东西？

- id: snow_sill
  when: idle
  sky: snow
  turns:
    - xiaoju: 下雪了！窗台都白了。
    - laoshi: 关好窗。
    - adeng: 我去烧壶热水。

- id: leaves_door
  when: idle
  sky: leaves
  turns:
    - xiaoju: 门口又吹进来几片叶子。
    - laoshi: 留着。挺好看。

- id: petals_tea
  when: idle
  sky: petals
  turns:
    - xiaoju: 花瓣飘进来了。
    - adeng: 落进茶里也不错。

- id: halloween_pumpkin
  when: idle
  holiday: halloween
  turns:
    - xiaoju: 南瓜是我挑的，好看吧？
    - laoshi: 那个在笑我。

- id: christmas_star
  when: idle
  holiday: christmas
  turns:
    - xiaoju: 树顶的星星歪了。
    - laoshi: 我来。
    - adeng: 小心梯子。

- id: new_year_fu
  when: idle
  holiday: new_year
  turns:
    - adeng: 福字倒着贴，福到了。
    - xiaoju: 灯笼也挂好啦！
    - laoshi: 红红火火。

# Neighbours dropping in (game/guests.ts): guest: baker (Auntie Gui from the bakery) or postman (Axin).
# The guest speaks first; turns from staff who are out or in the garden are left out.
- id: baker_fresh
  when: idle
  guest: baker
  period: dawn
  turns:
    - baker: 早，刚出炉的，给你们留了两个。
    - adeng: 桂姨又破费了。
    - baker: 趁热吃。

- id: baker_osmanthus
  when: idle
  guest: baker
  turns:
    - baker: 今天做了桂花糕。
    - xiaoju: 我就知道！
    - baker: 给你留了最大的。

- id: baker_butter
  when: idle
  guest: baker
  turns:
    - baker: 你们家栗子又去我店里了。
    - adeng: ……它拿了什么？
    - baker: 一整块黄油。

- id: baker_prices
  when: idle
  guest: baker
  turns:
    - baker: 阿灯，帮我看看这张价目表。
    - adeng: 这两个价写反了。
    - baker: 难怪昨天亏了。

- id: baker_rain
  when: idle
  guest: baker
  sky: rain
  turns:
    - baker: 雨太大，进来躲一躲。
    - adeng: 坐，茶刚泡好。

- id: baker_halloween
  when: idle
  guest: baker
  holiday: halloween
  turns:
    - baker: 南瓜饼，一人一个。
    - xiaoju: 老石不吃甜的。
    - laoshi: ……吃。

- id: baker_christmas
  when: idle
  guest: baker
  holiday: christmas
  turns:
    - baker: 姜饼人，烤糊了一个。
    - xiaoju: 糊的给我！

- id: baker_new_year
  when: idle
  guest: baker
  holiday: new_year
  turns:
    - baker: 年糕，回去蒸着吃。
    - adeng: 桂姨新年好。
    - baker: 你们也好，生意兴隆。

- id: postman_letter
  when: idle
  guest: postman
  turns:
    - postman: 小灯屋，有信。
    - adeng: 谢谢阿信。
    - postman: 这周第三封了。

- id: postman_parcel
  when: idle
  guest: postman
  turns:
    - postman: 老石的包裹，挺沉。
    - laoshi: 木料。
    - postman: 我就知道。

- id: postman_postcard
  when: idle
  guest: postman
  turns:
    - postman: 一张明信片，没写寄件人。
    - xiaoju: 画的是海！
    - adeng: 收着吧。

- id: postman_water
  when: idle
  guest: postman
  turns:
    - postman: 路过，讨杯水喝。
    - adeng: 坐会儿再走。
    - postman: 不了，还有一条街。

- id: postman_rain
  when: idle
  guest: postman
  sky: rain
  turns:
    - postman: 雨大，信湿了一个角。
    - adeng: 放炉子边烘一烘。

- id: postman_snow
  when: idle
  guest: postman
  sky: snow
  turns:
    - postman: 路滑，今天摔了一跤。
    - xiaoju: 信没事吧？
    - postman: ……先问我啊。

- id: postman_christmas
  when: idle
  guest: postman
  holiday: christmas
  turns:
    - postman: 今天的信，装了一麻袋。
    - xiaoju: 有我们的吗？
    - postman: 有一张贺卡。

- id: postman_new_year
  when: idle
  guest: postman
  holiday: new_year
  turns:
    - postman: 邮局发的红包袋，一人一个。
    - xiaoju: 谢谢阿信！
