# Small talk between the staff, so the shop feels lived in (story.md section 4).
# Each chat is a few turns; every turn is one bubble (max 20 characters, same writing rules as cafe.yaml).
# when: idle = no commission running; waiting = a long command is running and everyone is waiting.
# period (optional): only at this time of day (dawn, day, dusk, night).

- id: sugar
  when: idle
  turns:
    - xiaoju: 阿灯，你茶里我又放了一勺糖。
    - adeng: ……我说今天怎么这么好喝。

- id: mallet
  when: idle
  turns:
    - laoshi: 我的木槌。
    - xiaoju: 不知道呀。
    - laoshi: ……

- id: sunset
  when: idle
  period: dusk
  turns:
    - xiaoju: 今天的晚霞像橘子汽水。
    - laoshi: 像铁锈。
    - xiaoju: 你这人真没意思。

- id: chair
  when: idle
  turns:
    - laoshi: 这把椅子又晃了。
    - adeng: 上周不是修过吗？
    - laoshi: 嗯。所以再修一次。

- id: scarf
  when: idle
  turns:
    - laoshi: 围巾。
    - xiaoju: 啊，又掉了？
    - laoshi: 挂门后了。

- id: notebook
  when: idle
  turns:
    - xiaoju: 阿灯，你那个小本子里写我什么了？
    - adeng: 写你上周欠我三块饼干。
    - xiaoju: ……那是借的。

- id: windowsill
  when: idle
  turns:
    - xiaoju: 栗子今天又占了窗台。
    - adeng: 那是她的位置。
    - laoshi: 我的椅子也是她的。

- id: cold_tea
  when: idle
  turns:
    - adeng: 茶又凉了。
    - laoshi: 那就再泡一壶。
    - adeng: 你帮我看着水。
    - laoshi: 嗯。

- id: bakery
  when: idle
  period: day
  turns:
    - xiaoju: 对面面包店换招牌了。
    - adeng: 换成什么了？
    - xiaoju: 还是面包。然后字大了一点。

- id: table_leg
  when: idle
  turns:
    - laoshi: 这桌子腿短了一毫米。
    - xiaoju: 你怎么看出来的？
    - laoshi: 敲出来的。

- id: biscuit
  when: waiting
  turns:
    - adeng: 还得一会儿。
    - xiaoju: 那我能先吃一块饼干吗？
    - adeng: 吃吧，给老石留一块。
    - laoshi: 不用。

- id: kettle
  when: waiting
  turns:
    - xiaoju: 它还在跑吗？
    - adeng: 在跑。我们泡壶茶。
    - laoshi: 我来烧水。

- id: sketch
  when: waiting
  turns:
    - adeng: 这一步要等一会儿。
    - xiaoju: 那我画一下栗子。
    - laoshi: 画得像一点。

# Weather and holidays (sky: rain, snow, petals, leaves; holiday: halloween, christmas, new_year).
# They come up before the everyday chats while they fit.
- id: rain_umbrella
  when: idle
  sky: rain
  turns:
    - xiaoju: 下雨了，伞我放门口了。
    - adeng: 待会儿出门记得拿上。

- id: rain_fix
  when: idle
  sky: rain
  turns:
    - laoshi: 雨天，适合修东西。
    - xiaoju: 你哪天不修东西？

- id: snow_sill
  when: idle
  sky: snow
  turns:
    - xiaoju: 下雪了！窗台都白了。
    - laoshi: 关好窗。
    - adeng: 我去烧壶热水。

- id: leaves_door
  when: idle
  sky: leaves
  turns:
    - xiaoju: 门口又吹进来几片叶子。
    - laoshi: 留着。挺好看。

- id: petals_tea
  when: idle
  sky: petals
  turns:
    - xiaoju: 花瓣飘进来了。
    - adeng: 落进茶里也不错。

- id: halloween_pumpkin
  when: idle
  holiday: halloween
  turns:
    - xiaoju: 南瓜是我挑的，好看吧？
    - laoshi: 那个在笑我。

- id: christmas_star
  when: idle
  holiday: christmas
  turns:
    - xiaoju: 树顶的星星歪了。
    - laoshi: 我来。
    - adeng: 小心梯子。

- id: new_year_fu
  when: idle
  holiday: new_year
  turns:
    - adeng: 福字倒着贴，福到了。
    - xiaoju: 灯笼也挂好啦！
    - laoshi: 红红火火。

# Neighbours dropping in (game/guests.ts): guest: baker (Auntie Gui from the bakery) or postman (Axin).
# The guest speaks first; turns from staff who are out or in the garden are left out.
- id: baker_fresh
  when: idle
  guest: baker
  period: dawn
  turns:
    - baker: 早，刚出炉的面包，留了两个。
    - adeng: 桂姨又给我们带吃的。
    - baker: 趁热吃。

- id: baker_osmanthus
  when: idle
  guest: baker
  turns:
    - baker: 今天蒸了桂花糕。
    - xiaoju: 我就知道！
    - baker: 最大那块留给你了。

- id: baker_butter
  when: idle
  guest: baker
  turns:
    - baker: 你们家栗子又跑我店里去了。
    - adeng: ……它叼走什么了？
    - baker: 一整块黄油。

- id: baker_prices
  when: idle
  guest: baker
  turns:
    - baker: 阿灯，帮我瞅瞅这张价目表。
    - adeng: 这两个价写反了。
    - baker: 怪不得昨天算不平。

- id: baker_rain
  when: idle
  guest: baker
  sky: rain
  turns:
    - baker: 雨太大，进来歇会儿脚。
    - adeng: 快坐，茶刚泡上。

- id: baker_halloween
  when: idle
  guest: baker
  holiday: halloween
  turns:
    - baker: 烤了南瓜饼，一人一个。
    - xiaoju: 老石不吃甜的。
    - laoshi: ……吃。

- id: baker_christmas
  when: idle
  guest: baker
  holiday: christmas
  turns:
    - baker: 姜饼人，烤焦了一个。
    - xiaoju: 焦的归我！

- id: baker_new_year
  when: idle
  guest: baker
  holiday: new_year
  turns:
    - baker: 刚打的年糕，切片蒸着吃。
    - adeng: 桂姨过年好。
    - baker: 你们也好，开年顺顺当当。

- id: postman_letter
  when: idle
  guest: postman
  turns:
    - postman: 小灯屋，有信。
    - adeng: 辛苦了阿信。
    - postman: 这周第三封了。

- id: postman_parcel
  when: idle
  guest: postman
  turns:
    - postman: 老石的包裹，够沉的。
    - laoshi: 木料。
    - postman: 我就猜是。

- id: postman_postcard
  when: idle
  guest: postman
  turns:
    - postman: 一张明信片，没落款。
    - xiaoju: 上面画的是海！
    - adeng: 贴黑板上吧。

- id: postman_water
  when: idle
  guest: postman
  turns:
    - postman: 路过，讨杯水喝。
    - adeng: 坐下喘口气。
    - postman: 不了，还有一条街。

- id: postman_rain
  when: idle
  guest: postman
  sky: rain
  turns:
    - postman: 雨太急，信湿了一个角。
    - adeng: 放炉子边烤干就行。

- id: postman_snow
  when: idle
  guest: postman
  sky: snow
  turns:
    - postman: 路太滑，刚摔了一跤。
    - xiaoju: 信没事吧？
    - postman: ……先关心下我啊。

- id: postman_christmas
  when: idle
  guest: postman
  holiday: christmas
  turns:
    - postman: 今天的信，装了满满一麻袋。
    - xiaoju: 有我们的吗？
    - postman: 夹着一张贺卡。

- id: postman_new_year
  when: idle
  guest: postman
  holiday: new_year
  turns:
    - postman: 邮局发的红包袋，一人分一个。
    - xiaoju: 谢谢阿信！

- id: swatch
  when: idle
  turns:
    - qingdai: 小橘，你围巾的橘色很正。
    - xiaoju: 是橘子色！
    - qingdai: 借我比一下色卡。

- id: pinned
  when: idle
  turns:
    - laoshi: 黑板上那张，贴歪了。
    - qingdai: 故意的。
    - laoshi: ……

- id: blue_cup
  when: idle
  turns:
    - qingdai: 阿灯，杯子换个钴蓝的？
    - adeng: 这个用了十年了。
    - qingdai: 那就再用十年。

- id: best_light
  when: idle
  period: dusk
  turns:
    - qingdai: 这会儿的夕阳最好画。
    - xiaoju: 那你先画我！

# Coming as regulars (plan.md R2.3): `after: N` only once N commissions are finished with the user.
# `once: true` is a little story told only once, ever; it comes up before everyday chats once unlocked.
- id: regular_cup
  when: idle
  after: 3
  turns:
    - xiaoju: 你的杯子，我单独放了一格。
    - adeng: 常来的人，都有自己的杯子。

- id: regular_button
  when: idle
  after: 5
  turns:
    - laoshi: 上回那页面，按钮还是偏小。
    - adeng: 下回要改，你提一句。
    - laoshi: 嗯。

- id: regular_notebook
  when: idle
  after: 8
  turns:
    - adeng: 小本子快写满一半了。
    - xiaoju: 再买一本，要猫的封面。

- id: regular_shelf
  when: waiting
  after: 5
  turns:
    - qingdai: 等的时候，我把作品架擦了擦。
    - laoshi: 第二格的框歪了。

- id: story_chestnut
  when: idle
  after: 4
  once: true
  turns:
    - xiaoju: 今天是栗子来店里的日子。
    - adeng: 一年了？
    - xiaoju: 我给它留了块鱼干。
    - laoshi: 它在我椅子上睡了一年。

- id: story_snacks
  when: idle
  after: 7
  once: true
  turns:
    - xiaoju: 我的零食清单写到第四页了。
    - qingdai: 能给我看看吗？
    - xiaoju: 看可以，不许划掉。

- id: story_guitar
  when: idle
  after: 9
  once: true
  turns:
    - laoshi: 这吉他是我爸的。
    - xiaoju: 你会弹？
    - laoshi: 会一首。
    - laoshi: 下回没活的时候。

- id: story_first_drawing
  when: idle
  after: 10
  once: true
  turns:
    - qingdai: 我在店里画的第一张，是这块黑板。
    - adeng: 我记得，粉笔灰抹了一脸。
    - qingdai: 那是故意的。

# In the study at home (shared/scenes.ts): `scene: study` chats come up only there, before everyday ones.
- id: move_in
  when: idle
  scene: study
  once: true
  turns:
    - xiaoju: 搬家的箱子还剩两个没拆。
    - laoshi: 书架钉牢了。
    - adeng: 以后就在这儿干活。

- id: study_sofa
  when: idle
  scene: study
  turns:
    - xiaoju: 这沙发谁挑的？太软了。
    - laoshi: 我。
    - xiaoju: ……难怪你总坐着不起来。

- id: study_window
  when: idle
  scene: study
  turns:
    - qingdai: 楼下花店换了橱窗。
    - adeng: 下回出门带一束回来。

- id: study_lamp
  when: idle
  scene: study
  period: night
  turns:
    - adeng: 这盏台灯比店里的暖。
    - qingdai: 黄一点，画画正合适。

- id: study_books
  when: waiting
  scene: study
  turns:
    - xiaoju: 等的时候，我把书架理了一遍。
    - laoshi: 按高矮排的？
    - xiaoju: 按我喜欢的排。
