# Dialogue for the bookshop (plan-2.0.md J2), laid over lines/cafe.yaml: same format, same rules.
# Uncle Page does all the work; Adeng only brings the order over.
# Spots: 书店柜台 (counter), 矮书架 (board), 大书架 (shelf), 看书的长桌 (table), 地球仪 (corner).

opening:
  - { id: bs_revise_again_01, speaker: jianbo, when: revise_again, bubbles: ["上回改的是{lastAsk}。", "这回{brief}，记下了。"] }
  - { id: bs_revise_01, speaker: jianbo, when: revise, bubbles: ["{brief}？行。", "还没装订，好改。"] }
  - { id: bs_revise_02, speaker: jianbo, when: revise, bubbles: ["书也是一版一版出的。", "{brief}，我来。"] }
  - { id: bs_revise_03, speaker: jianbo, when: revise, bubbles: ["旧的那份我夹在书里留着。", "{brief}，改好了叫你。"] }
  - { id: bs_mem_02, speaker: jianbo, when: has_stuck_note, bubbles: ["{brief}，记下了。", "上回在{stuckNote}卡过。", "这回我先绕开那页。"] }
  - { id: bs_mem_01, speaker: jianbo, when: has_memory, bubbles: ["{brief}，记下了。", "上回你挑的{lastChoice}。", "还照那个样子来。"] }
  - { id: bs_tpl_card_01, speaker: jianbo, when: tpl_card, bubbles: ["做贺卡？旧书里我见过不少。", "名字照你给的写。"] }
  - { id: bs_tpl_card_02, speaker: jianbo, when: tpl_card, bubbles: ["卡片是要留着翻看的。", "字少，意思写足。"] }
  - { id: bs_tpl_newsletter_01, speaker: jianbo, when: tpl_newsletter, bubbles: ["出简报？跟排目录一个理。", "要紧的放头一条。"] }
  - { id: bs_tpl_newsletter_02, speaker: jianbo, when: tpl_newsletter, bubbles: ["日子和地点我单列一行。", "像书脊上的字，一眼就看见。"] }
  - { id: bs_handed_01, speaker: jianbo, when: handed, bubbles: ["东西收到了，我先戴上眼镜。", "{brief}，记下了。"] }
  - { id: bs_opening_01, speaker: jianbo, bubbles: ["{brief}？", "好，我先把铅笔放下。"] }
  - { id: bs_opening_02, speaker: jianbo, bubbles: ["{brief}……", "这摞书刚标完价，来得巧。"] }
  - { id: bs_opening_03, speaker: jianbo, bubbles: ["来活了。", "{brief}，我记在本子上。"] }

planning:
  - { id: bs_plan_01, speaker: jianbo, bubbles: ["先列个目录，一章一章来。"] }
  - { id: bs_plan_02, speaker: jianbo, bubbles: ["从哪一章开头呢……"] }
  - { id: bs_plan_03, speaker: jianbo, bubbles: ["三章，一章一章写。"] }

draft_ready:
  - { id: bs_draft_ready_01, speaker: jianbo, bubbles: ["稿子好了，在柜台上。", "你看过再定。"] }
  - { id: bs_draft_ready_02, speaker: jianbo, bubbles: ["草稿好了。", "用不用你说了算。"] }
  - { id: bs_draft_ready_03, speaker: jianbo, bubbles: ["稿子夹在柜台那本书里了。"] }

writing:
  - { id: bs_write_01, speaker: jianbo, bubbles: ["开工。"] }
  - { id: bs_write_02, speaker: jianbo, bubbles: ["这页好了，翻下一页。"] }
  - { id: bs_write_03, speaker: jianbo, bubbles: ["嗯……", "这句读着顺。"] }
  - { id: bs_write_04, speaker: jianbo, bubbles: ["先写上，标点后面再改。"] }

sub_go_research:
  - { id: bs_go_rs_rain, speaker: jianbo, when: sky_rain, bubbles: ["下雨了，书得离窗户远点。", "我去大书架找{topic}。"] }
  - { id: bs_go_rs_01, speaker: jianbo, bubbles: ["{topic}？我去大书架上翻翻。"] }
  - { id: bs_go_rs_02, speaker: jianbo, bubbles: ["我记得在哪本书里见过……"] }
  - { id: bs_go_rs_03, speaker: jianbo, bubbles: ["老书都在最上面一层。"] }

sub_back_research:
  - { id: bs_back_rs_01, speaker: jianbo, bubbles: ["找着了。", "用得上的有{count}处。"] }
  - { id: bs_back_rs_02, speaker: jianbo, bubbles: ["这个对得上。", "两本书说法一样。"] }
  - { id: bs_back_rs_03, speaker: jianbo, bubbles: ["都在这儿，夹了书签。"] }

sub_go_review:
  - { id: bs_go_rv_01, speaker: jianbo, bubbles: ["我在长桌上过一遍。"] }
  - { id: bs_go_rv_02, speaker: jianbo, bubbles: ["错字得一行行找。"] }
  - { id: bs_go_rv_03, speaker: jianbo, bubbles: ["一页一页看过去。"] }

sub_back_review:
  - { id: bs_back_rv_issue, speaker: jianbo, when: has_issues, bubbles: ["有{issueCount}处不对。", "我都夹了张纸条。"] }
  - { id: bs_back_rv_ok, speaker: jianbo, when: no_issues, bubbles: ["从头到尾看过了，没错字。"] }
  - { id: bs_back_rv_ok2, speaker: jianbo, when: no_issues, bubbles: ["看过了，前后都对得上。"] }

sub_go_design:
  - { id: bs_go_ds_rain, speaker: jianbo, when: sky_rain, bubbles: ["下雨天，没人来淘书。", "我在矮书架边上画样子。"] }
  - { id: bs_go_ds_01, speaker: jianbo, bubbles: ["我在矮书架边上比划比划。"] }
  - { id: bs_go_ds_02, speaker: jianbo, bubbles: ["排成什么样好看呢……"] }
  - { id: bs_go_ds_03, speaker: jianbo, bubbles: ["先拿旧书皮剪个样子。"] }

sub_back_design:
  - { id: bs_back_ds_01, speaker: jianbo, bubbles: ["样子定了。", "像一本好书的头一页。"] }
  - { id: bs_back_ds_02, speaker: jianbo, bubbles: ["剪好了，你瞧瞧。"] }
  - { id: bs_back_ds_03, speaker: jianbo, bubbles: ["排了三种，我看中间那个好。"] }

stuck:
  - { id: bs_stuck_01, speaker: jianbo, bubbles: ["哎？这页缺了。", "换个法子试试。"] }
  - { id: bs_stuck_02, speaker: jianbo, bubbles: ["不对。{whatsWrong}。"] }
  - { id: bs_stuck_03, speaker: jianbo, bubbles: ["眼镜又找不着了……"] }
  - { id: bs_stuck_04, speaker: jianbo, bubbles: ["页码排错了。", "重新排。"] }

stuck_long:
  - { id: bs_stuck_long_01, speaker: jianbo, bubbles: ["这个费工夫。", "我慢慢来，你先忙。"] }
  - { id: bs_stuck_long_02, speaker: jianbo, bubbles: ["还在弄，没撂下。"] }
  - { id: bs_stuck_long_03, speaker: jianbo, bubbles: ["再等等，这段绕。"] }

waiting:
  - { id: bs_wait_01, speaker: jianbo, bubbles: ["在路上了，等等。"] }
  - { id: bs_wait_02, speaker: jianbo, bubbles: ["还没回音，再等等。"] }
  - { id: bs_wait_03, speaker: jianbo, bubbles: ["急不得，好书都是等来的。"] }

ask:
  - { id: bs_ask_color, speaker: jianbo, when: demo_color, bubbles: ["奶油白和浅薄荷，我各印了一张。", "你要哪个？"] }
  - { id: bs_ask_01, speaker: jianbo, bubbles: ["问你个事。", "{question}"] }
  - { id: bs_ask_02, speaker: jianbo, bubbles: ["这儿有两种写法。", "你挑一种？"] }

react_adopted:
  - { id: bs_react_ad_01, speaker: jianbo, bubbles: ["好，就这么写。"] }
  - { id: bs_react_ad_02, speaker: jianbo, bubbles: ["记下了，写在黑板上。"] }
  - { id: bs_react_ad_03, speaker: jianbo, bubbles: ["我也挑这个。"] }

react_rejected:
  - { id: bs_react_rj_01, speaker: jianbo, bubbles: ["行，听你的。"] }
  - { id: bs_react_rj_02, speaker: jianbo, bubbles: ["那这张我夹书里，下回用。"] }
  - { id: bs_react_rj_03, speaker: jianbo, bubbles: ["好，换一张。"] }

react_delegated:
  - { id: bs_react_dl_00, speaker: jianbo, bubbles: ["好，我来定。", "定了跟你说。"] }
  - { id: bs_react_dl_01, speaker: jianbo, bubbles: ["那就{choice}，因为{reason}。", "不合适随时说。"] }
  - { id: bs_react_dl_02, speaker: jianbo, bubbles: ["先用{choice}试试。", "不好再换。"] }
  - { id: bs_react_dl_03, speaker: jianbo, bubbles: ["就{choice}。", "为什么，我写在黑板上了。"] }

serious:
  - { id: bs_serious_01, speaker: jianbo, bubbles: ["这一步要{action}。", "做了就{consequence}。", "你看一眼再定。"] }
  - { id: bs_serious_02, speaker: jianbo, bubbles: ["这儿我不敢乱动。", "{action}，{consequence}。"] }
  - { id: bs_serious_03, speaker: jianbo, bubbles: ["这页撕了就粘不回去了。", "你看清楚再点。"] }

refused:
  - { id: bs_refused_01, speaker: jianbo, bubbles: ["这个不能碰。", "换条路。"] }
  - { id: bs_refused_02, speaker: jianbo, bubbles: ["这不归我们动手。"] }
  - { id: bs_refused_03, speaker: jianbo, bubbles: ["别人的书信，我不翻。"] }

serious_yes:
  - { id: bs_serious_yes_01, speaker: jianbo, bubbles: ["好，我来。"] }
  - { id: bs_serious_yes_02, speaker: jianbo, bubbles: ["知道了，这就动手。"] }
  - { id: bs_serious_yes_03, speaker: jianbo, bubbles: ["就这么办。"] }

serious_no:
  - { id: bs_serious_no_01, speaker: jianbo, bubbles: ["好，不碰它。", "我换个不用这样的法子。"] }
  - { id: bs_serious_no_02, speaker: jianbo, bubbles: ["好，先放着。"] }
  - { id: bs_serious_no_03, speaker: jianbo, bubbles: ["不弄了，我绕过去。"] }

done:
  - { id: bs_done_day, speaker: jianbo, when: daytime, bubbles: ["好了，在柜台上。", "趁亮看，费眼的事白天做。"] }
  - { id: bs_done_dusk, speaker: jianbo, when: dusk, bubbles: ["好了。", "天快黑了，该开灯了。"] }
  - { id: bs_done_night, speaker: jianbo, when: night, bubbles: ["好了。", "这么晚了，看完早点睡。"] }
  - { id: bs_done_01, speaker: jianbo, bubbles: ["好了，一页没缺。"] }
  - { id: bs_done_02, speaker: jianbo, bubbles: ["好了，拿去就能用。", "我从头读了两遍。"] }

failed:
  - { id: bs_failed_01, speaker: jianbo, bubbles: ["这回没弄成，对不住。", "卡在{stuckAt}。", "我记在黑板上了。", "下回换个法子。"] }
  - { id: bs_failed_02, speaker: jianbo, bubbles: ["没弄成。", "卡在{stuckAt}，记下了。"] }
  - { id: bs_failed_03, speaker: jianbo, bubbles: ["今天先到这儿。", "毛病我写在黑板上了。"] }

net_retry:
  - { id: bs_net_retry_01, speaker: jianbo, bubbles: ["线路好像断了，我等等再试。"] }
  - { id: bs_net_retry_02, speaker: jianbo, bubbles: ["那头没人应，我再问问。"] }
  - { id: bs_net_retry_03, speaker: jianbo, bubbles: ["信号不好，过会儿再试。"] }

cancelled:
  - { id: bs_cancelled_01, speaker: jianbo, bubbles: ["好，那先放着。"] }
  - { id: bs_cancelled_02, speaker: jianbo, bubbles: ["行，做好的都留着。"] }
  - { id: bs_cancelled_03, speaker: jianbo, bubbles: ["好，不做了。", "稿子我夹进书里，明天还能用。"] }

# 走进店里时店主说的一句（app/renderer/stage/shoptalk.ts）。有节日先说节日的，再看天气，都没有就在时辰、季节和平常的里面挑。
shop_in:
  - { id: bs_in_birthday, speaker: jianbo, when: birthday_jianbo, bubbles: ["今天我生日。", "给自己留了一本好书。"] }
  - { id: bs_in_01, speaker: jianbo, bubbles: ["进来看吧，不买也行。"] }
  - { id: bs_in_02, speaker: jianbo, bubbles: ["慢慢挑，书不会跑。"] }
  - { id: bs_in_03, speaker: jianbo, bubbles: ["稍等，这本我先标个价。"] }
  - { id: bs_in_04, speaker: jianbo, bubbles: ["新到一箱旧书，还没拆。"] }
  - { id: bs_in_05, speaker: jianbo, bubbles: ["门口那筐，一块钱一本。"] }
  - { id: bs_in_dawn_01, speaker: jianbo, when: period_dawn, bubbles: ["这么早？", "我刚开门，灯还没全亮。"] }
  - { id: bs_in_dawn_02, speaker: jianbo, when: period_dawn, bubbles: ["早上看书，字最清楚。"] }
  - { id: bs_in_day_01, speaker: jianbo, when: period_day, bubbles: ["中午人少，随便坐。"] }
  - { id: bs_in_dusk_01, speaker: jianbo, when: period_dusk, bubbles: ["天暗了，我把灯打开。"] }
  - { id: bs_in_dusk_02, speaker: jianbo, when: period_dusk, bubbles: ["快关门了，挑好的先拿着。"] }
  - { id: bs_in_night_01, speaker: jianbo, when: period_night, bubbles: ["关门了，不过你进来吧。"] }
  - { id: bs_in_night_02, speaker: jianbo, when: period_night, bubbles: ["这么晚还来淘书？"] }
  - { id: bs_in_rain_01, speaker: jianbo, when: sky_rain, bubbles: ["下雨了，伞放门口，别滴着书。"] }
  - { id: bs_in_snow_01, speaker: jianbo, when: sky_snow, bubbles: ["雪这么大，你还出门？", "暖暖手再翻书。"] }
  - { id: bs_in_fog_01, speaker: jianbo, when: sky_fog, bubbles: ["雾这么大，你找得着门？"] }
  - { id: bs_in_wind_01, speaker: jianbo, when: sky_wind, bubbles: ["风大，门关紧，书页会飞。"] }
  - { id: bs_in_storm_01, speaker: jianbo, when: sky_storm, bubbles: ["打雷了，先在这儿躲躲。"] }
  - { id: bs_in_spring_01, speaker: jianbo, when: season_spring, bubbles: ["开春了，学生来换课本。"] }
  - { id: bs_in_summer_01, speaker: jianbo, when: season_summer, bubbles: ["热吧，长桌那边有风。"] }
  - { id: bs_in_autumn_01, speaker: jianbo, when: season_autumn, bubbles: ["秋天了，开学的来淘旧书。"] }
  - { id: bs_in_winter_01, speaker: jianbo, when: season_winter, bubbles: ["冬天了，看书的人多。"] }
  - { id: bs_in_new_year, speaker: jianbo, when: holiday_new_year, bubbles: ["过年好。", "旧历书卖光了。"] }
  - { id: bs_in_lantern, speaker: jianbo, when: holiday_lantern, bubbles: ["元宵好，灯谜书摆在门口。"] }
  - { id: bs_in_dragon_boat, speaker: jianbo, when: holiday_dragon_boat, bubbles: ["端午好，屈原的诗摆前头了。"] }
  - { id: bs_in_mid_autumn, speaker: jianbo, when: holiday_mid_autumn, bubbles: ["中秋好，写月亮的诗集摆前头。"] }
  - { id: bs_in_halloween, speaker: jianbo, when: holiday_halloween, bubbles: ["万圣节好，鬼故事最好卖。"] }
  - { id: bs_in_christmas, speaker: jianbo, when: holiday_christmas, bubbles: ["圣诞好，旧画册包起来送人正好。"] }

# 店里没活时店主隔一会儿说一句。when 同上，不写就是什么时候都行。
shop_idle:
  - { id: bs_idle_01, speaker: jianbo, bubbles: ["这本书页黄了，字还清楚。"] }
  - { id: bs_idle_02, speaker: jianbo, bubbles: ["价钱我用铅笔写，好擦。"] }
  - { id: bs_idle_03, speaker: jianbo, bubbles: ["这本缺了封面，便宜卖。"] }
  - { id: bs_idle_04, speaker: jianbo, bubbles: ["书里夹着一张车票，四十年前的。"] }
  - { id: bs_idle_05, speaker: jianbo, bubbles: ["书是一本本收来的，急不得。"] }
  - { id: bs_idle_06, speaker: jianbo, bubbles: ["大书架最上面那层，我够不着了。"] }
  - { id: bs_idle_07, speaker: jianbo, bubbles: ["地球仪上的国名，有几个没了。"] }
  - { id: bs_idle_08, speaker: jianbo, bubbles: ["眼镜放哪儿了……"] }
  - { id: bs_idle_09, speaker: jianbo, bubbles: ["芳姐送了一枝花，插在书架上。"] }
  - { id: bs_idle_10, speaker: jianbo, bubbles: ["这本书头一页上有人写了字。"] }
  - { id: bs_idle_11, speaker: jianbo, bubbles: ["书脊朝外，一眼就找着。"] }
  - { id: bs_idle_12, speaker: jianbo, bubbles: ["河边潮，书得常翻翻，透透气。"] }
  - { id: bs_idle_13, speaker: jianbo, bubbles: ["旧书有股味，闻惯了就好。"] }
  - { id: bs_idle_14, speaker: jianbo, bubbles: ["这一套缺第三本，找了好些年。"] }
  - { id: bs_idle_15, speaker: jianbo, bubbles: ["长桌上那本，谁看到一半走了。"] }
  - { id: bs_idle_16, speaker: jianbo, bubbles: ["书角折了，压一压就平。"] }
  - { id: bs_idle_17, speaker: jianbo, bubbles: ["收书的时候，我只问它从哪来。"] }
  - { id: bs_idle_18, speaker: jianbo, bubbles: ["这本字典比我年纪还大。"] }
  - { id: bs_idle_19, speaker: jianbo, bubbles: ["矮书架那排是给孩子的。"] }
  - { id: bs_idle_20, speaker: jianbo, bubbles: ["书签用完了，拿车票顶上。"] }
  - { id: bs_idle_21, speaker: jianbo, bubbles: ["算盘比计算器顺手。"] }
  - { id: bs_idle_22, speaker: jianbo, bubbles: ["刚来这条街，认得的人还不多。"] }
  - { id: bs_idle_23, speaker: jianbo, bubbles: ["这本我自己留着，不卖。"] }
  - { id: bs_idle_24, speaker: jianbo, bubbles: ["来卖书的人，总要说说它的来历。"] }
  - { id: bs_idle_dawn_01, speaker: jianbo, when: period_dawn, bubbles: ["早上开门前，先掸一遍灰。"] }
  - { id: bs_idle_night_01, speaker: jianbo, when: period_night, bubbles: ["灯底下看书，看着看着就晚了。"] }
  - { id: bs_idle_rain_01, speaker: jianbo, when: sky_rain, bubbles: ["下雨了，窗边那排书挪一挪。"] }
  - { id: bs_idle_fog_01, speaker: jianbo, when: sky_fog, bubbles: ["雾天潮，书页会卷边。"] }
  - { id: bs_idle_spring_01, speaker: jianbo, when: season_spring, bubbles: ["春天潮，书里容易生虫。"] }
  - { id: bs_idle_summer_01, speaker: jianbo, when: season_summer, bubbles: ["夏天晒书，一页一页翻开。"] }
  - { id: bs_idle_autumn_01, speaker: jianbo, when: season_autumn, bubbles: ["秋天的光，最适合看书。"] }
  - { id: bs_idle_winter_01, speaker: jianbo, when: season_winter, bubbles: ["冬天手冷，翻页慢。"] }
