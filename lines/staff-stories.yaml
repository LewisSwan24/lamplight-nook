# The staff's own stories (plan-1.9.md I1): three chapters each, told in their own shop when one is waiting.
# When a chapter comes and what it leaves: app/shared/staffstories.ts. `left` must match that table.
# Each line is one bubble (max 20 characters, same writing rules as cafe.yaml); four to six a chapter. `note` says what was kept.

adeng:
  - title: "第一盏灯"
    left: lamp
    note: "阿灯把那盏旧台灯摆上了柜台。"
    lines:
      - "这间屋子，原来是个空铺面。"
      - "搬进来那天，电还没通。"
      - "我在旧货摊上买了一盏台灯。"
      - "插上电，屋里一下子亮了。"
      - "后来就叫小灯屋了。"
  - title: "没有客人的冬天"
    left: inkpot
    note: "柜台上多了一个见底的墨水瓶。"
    lines:
      - "开张头一个冬天，没人进门。"
      - "我就坐在窗边，替街坊写信。"
      - "一封不收钱，写了一整瓶墨水。"
      - "开春以后，客人是他们带来的。"
  - title: "门牌"
    left: sign
    note: "阿灯把旧门牌靠在了书架边。"
    lines:
      - "招牌是后来做的，先有的是门牌。"
      - "一块木板，我自己写的字。"
      - "写歪了，小橘笑了一个礼拜。"
      - "现在的招牌挂在外面。"
      - "这块，我舍不得扔。"

xiaoju:
  - title: "楼梯底下"
    left: card
    note: "小橘把旧借书卡夹进了书里。"
    lines:
      - "小时候，我家楼下是图书馆。"
      - "我天天坐在楼梯底下看书。"
      - "管书的阿姨嫌我挡道。"
      - "后来她给我办了一张借书卡。"
      - "卡上的字是她写的，歪歪扭扭。"
  - title: "查不到的事"
    left: magnifier
    note: "小橘的抽屉里多了一个放大镜。"
    lines:
      - "十岁那年，我想知道一件事。"
      - "为什么橘子是一瓣一瓣的？"
      - "我翻了一个暑假，没翻到。"
      - "阿姨借了我一个放大镜。"
      - "她说，书里没有，就自己看呀。"
  - title: "答案"
    left: slip
    note: "那张纸条，小橘贴在了本子第一页。"
    lines:
      - "前几天查资料，我又碰见了。"
      - "橘子为什么是一瓣一瓣的。"
      - "答案就一行，我看了好几遍。"
      - "我抄在纸条上，寄给了阿姨。"
      - "她回信说，早知道你会查到。"

laoshi:
  - title: "刨子"
    left: plane
    note: "老石的工作台上多了一把旧刨子。"
    lines:
      - "十六岁，进木匠铺当学徒。"
      - "头一年只让刨木头。"
      - "刨了一年，手上全是茧。"
      - "这把刨子，是那年的。"
  - title: "曲尺"
    left: square
    note: "老石把曲尺挂在了工作台边。"
    lines:
      - "师父话少。"
      - "我做的东西，他拿曲尺一量。"
      - "差一点，就拆了重做。"
      - "我现在看东西，也是这样。"
      - "差一点，就再看一遍。"
  - title: "最后一把椅子"
    left: chair
    note: "一把巴掌大的小椅子，摆在老石的工作台上。"
    lines:
      - "木匠铺关门那天，师父没说话。"
      - "他让我做最后一把椅子。"
      - "我做了，他坐上去，没晃。"
      - "他说，行。"
      - "这是照那把做的小样。"

qingdai:
  - title: "调不出的蓝"
    left: swatch
    note: "青黛把那张色卡夹在了画板上。"
    lines:
      - "我一直想调出一种蓝。"
      - "比天深，比墨浅。"
      - "试了上百张，色卡都是废的。"
      - "留下这张，是最接近的一次。"
  - title: "染坊"
    left: cloth
    note: "一块旧蓝布，叠在青黛的抽屉里。"
    lines:
      - "我外婆开过一间染坊。"
      - "院子里晾满了蓝布。"
      - "我的名字，就是一种染料。"
      - "染坊拆的时候，我只拿了这一块。"
      - "那种蓝，就是我想调的。"
  - title: "那种蓝"
    left: vial
    note: "一小瓶调好的颜料，立在青黛的桌角。"
    lines:
      - "前天收工，我站在门口。"
      - "天快黑了，路灯还没亮。"
      - "天就是那种蓝。"
      - "我回来调了一瓶，调出来了。"
      - "原来要等那一会儿才看得见。"

xiaodou:
  - title: "招学徒"
    left: flyer
    note: "那张招学徒的纸，小豆一直留着。"
    lines:
      - "有天晚上，我路过门口。"
      - "窗上贴着一张纸，招学徒。"
      - "字写得歪歪扭扭的。"
      - "我看了三遍，推门进来了！"
      - "后来才知道，是阿灯写的。"
  - title: "第一次跑腿"
    left: umbrella
    note: "小豆把那把旧伞挂回了门后。"
    lines:
      - "第一次跑腿，下大雨。"
      - "我忘了带伞，跑到一半全湿了。"
      - "回来的时候，小橘在门口等着。"
      - "她手里拿着这把伞。"
      - "从那以后，伞就挂在门后。"
  - title: "小本子"
    left: pad
    note: "小豆的小本子写满了，收在了柜台底下。"
    lines:
      - "我有个小本子，什么都记。"
      - "谁的茶要几勺糖，我都记着。"
      - "老石的木槌放哪，我也记着。"
      - "写满了，我数了，三百一十二条。"
      - "下一本从今天开始记！"

aqian:
  - title: "一枚铅字"
    left: sort
    note: "一枚“灯”字的铅字，摆在阿铅的字架上。"
    lines:
      - "我学徒是在一家老印刷厂。"
      - "一整面墙的字架，几万个字。"
      - "师傅让我先认一个灯字。"
      - "认得这个，别的就找得到。"
  - title: "关门那年"
    left: apron
    note: "阿铅把那条旧围裙挂在了门后。"
    lines:
      - "后来大家都用电脑排版了。"
      - "印刷厂关门那天，我最后一个走。"
      - "字架拉走了，卖了废铅。"
      - "我只留下了这条围裙。"
      - "上面的油墨，洗了十年没洗掉。"
  - title: "自己的铺子"
    left: seal
    note: "一方小印章，压在阿铅的校样上。"
    lines:
      - "开这间铺子，是阿灯劝的。"
      - "我说现在没人要铅字了。"
      - "他说，有人要好好排的字。"
      - "开张那天，我刻了这方印。"
      - "每张校样，我都盖一下。"

xiaozhe:
  - title: "离家"
    left: brush
    note: "小赭的笔筒里，有一支秃了的画笔。"
    lines:
      - "我老家在山里，土是红的。"
      - "我小时候拿树枝蘸泥画画。"
      - "十八岁，我背着一支笔下山。"
      - "就是这支，毛快秃了。"
  - title: "第一张卖出去的画"
    left: coin
    note: "一枚旧硬币，钉在小赭的画板角上。"
    lines:
      - "刚来镇上，我在桥头摆摊。"
      - "一个礼拜，一张也没卖出去。"
      - "后来一个小孩，拿硬币买了一张。"
      - "画的是他家的狗。"
      - "这枚硬币，我一直没花。"
  - title: "回家"
    left: pebble
    note: "一块红石头，压在小赭的画纸上。"
    lines:
      - "去年我回了一趟山里。"
      - "我画了一张家门口的坡。"
      - "我妈说，土没那么红。"
      - "我捡了这块石头回来。"
      - "是红的，我没画错。"

xiaoding:
  - title: "拆开看看"
    left: screw
    note: "一颗旧螺丝，放在小钉的工具盒里。"
    lines:
      - "我五岁就把家里的闹钟拆了。"
      - "装回去，多出来一颗螺丝。"
      - "闹钟照样走，我爸没发现。"
      - "那颗螺丝，我留到了现在！"
  - title: "收音机"
    left: radio
    note: "一台旧收音机，摆在小钉的窗台上。"
    lines:
      - "隔壁爷爷有台收音机，坏了。"
      - "他说修不好就扔了。"
      - "我修了三个晚上。"
      - "响的时候，正放着他爱听的戏。"
      - "后来他走了，收音机给了我。"
  - title: "会走的表"
    left: watch
    note: "一块怀表，挂在小钉的工具板上。"
    lines:
      - "开工坊第一单，是修一块怀表。"
      - "拿来的是老周。"
      - "我拆开一看，少了一颗螺丝。"
      - "我想起了那颗！"
      - "装上去，表走了。"
