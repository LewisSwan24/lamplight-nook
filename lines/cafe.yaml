# Dialogue library for the café scene.
# Each group is one kind of event. Each line has a unique id, a speaker, and bubbles shown in order (max 20 characters each).
# {name} placeholders are filled at runtime. `when` is an optional condition checked by the translator.
# Saved changes hot-reload in dev mode; `npm test` lints every line against the writing rules.

# Lines that bring up memory come first, so they win whenever their condition holds (at most one per commission).
opening:
  # A round of changes to finished work (`revise`); `revise_again` when there was a round before it.
  - { id: revise_again_01, speaker: adeng, when: revise_again, bubbles: ["上回改的是{lastAsk}。", "这回是{brief}，记下了。"], reply: { speaker: xiaoju, bubbles: ["我去把旧稿收起来！"] } }
  - { id: revise_01, speaker: adeng, when: revise, bubbles: ["{brief}……嗯，记下了。", "就在原来那版上改。"], reply: { speaker: laoshi, bubbles: ["旧的留一份。"] } }
  - { id: revise_02, speaker: adeng, when: revise, bubbles: ["回头再看，是该动一动。", "{brief}，这就改。"] }
  - { id: revise_03, speaker: adeng, when: revise, bubbles: ["旧稿我先收好。", "{brief}，改完拿给你看。"] }
  - { id: opening_mem_02, speaker: adeng, when: has_stuck_note, bubbles: ["{brief}……嗯，好。", "上回在{stuckNote}卡过一次。", "这次我先盯着点。"] }
  - { id: opening_mem_01, speaker: adeng, when: has_memory, bubbles: ["{brief}……嗯，好。", "上次你选了{lastChoice}。", "这次也先照这个来，不合适再说。"] }
  # What kind of commission it is (`tpl_<template>`), and files handed over with it (`handed`).
  - { id: tpl_album_01, speaker: adeng, when: tpl_album, bubbles: ["照片我收下了。", "先一张张看看，再排顺序。"], reply: { speaker: qingdai, bubbles: ["相册的底色我来挑。"] } }
  - { id: tpl_letter_01, speaker: adeng, when: tpl_letter, bubbles: ["写信啊，我去拿支好写的笔。", "{brief}，先想想开头。"] }
  - { id: tpl_sheet_01, speaker: adeng, when: tpl_sheet, bubbles: ["做表格，先把格子画齐。"], reply: { speaker: laoshi, bubbles: ["合计那栏我来对。"] } }
  - { id: tpl_plan_01, speaker: adeng, when: tpl_plan, bubbles: ["排计划要留点空。", "一天塞太满，第二天就不想动了。"] }
  - { id: tpl_resume_01, speaker: adeng, when: tpl_resume, bubbles: ["写简历，没做过的一件都不写。", "缺的地方留空，等你来填。"] }
  - { id: tpl_notes_01, speaker: adeng, when: tpl_notes, bubbles: ["读书笔记啊。", "摘录只从你给的里面摘。"], reply: { speaker: xiaoju, bubbles: ["作者和年份我去查。"] } }
  - { id: tpl_travel_01, speaker: adeng, when: tpl_travel, bubbles: ["做旅行攻略，先把每天排开。"], reply: { speaker: xiaoju, bubbles: ["开放时间和票价我去查。"] } }
  - { id: tpl_tool_01, speaker: adeng, when: tpl_tool, bubbles: ["小工具，能做成网页就做成网页。"], reply: { speaker: laoshi, bubbles: ["试的时候只用样例。"] } }
  - { id: handed_01, speaker: adeng, when: handed, bubbles: ["东西我收下了，先看看。", "{brief}……嗯，好。"], reply: { speaker: xiaoju, bubbles: ["我去复印一份！"] } }
  - { id: opening_01, speaker: adeng, bubbles: ["{brief}……嗯，好。", "小橘，老石，来活儿了。"] }
  - { id: opening_02, speaker: adeng, bubbles: ["是要{brief}吧？", "我先泡壶茶，你坐。", "我们从哪儿开始呢。"] }
  - { id: opening_xiaoju_01, speaker: xiaoju, bubbles: ["新委托？我先把围巾放下！"] }

planning:
  - { id: plan_01, speaker: adeng, bubbles: ["我先画个草图。"] }
  - { id: plan_02, speaker: adeng, bubbles: ["先做哪块好……"] }
  - { id: plan_03, speaker: adeng, bubbles: ["分三步吧。"] }

writing:
  - { id: write_01, speaker: adeng, bubbles: ["正式的开始写了。"] }
  - { id: write_02, speaker: adeng, bubbles: ["这块写完了，下一块。"] }
  - { id: write_03, speaker: adeng, bubbles: ["先把架子搭起来。"] }

# Lines with `when: sky_...` or `when: holiday_...` fit only on such a day (game/weather.ts) and come first then.
sub_go_xiaoju:
  - { id: go_xj_rain, speaker: adeng, when: sky_rain, bubbles: ["小橘，帮我跑一趟：{topic}。"], reply: { speaker: xiaoju, bubbles: ["我拿把伞就去！"] } }
  - { id: go_xj_snow, speaker: adeng, when: sky_snow, bubbles: ["小橘，帮我跑一趟：{topic}。", "路滑，慢点走。"], reply: { speaker: xiaoju, bubbles: ["围巾围好了！"] } }
  - { id: go_xj_01, speaker: adeng, bubbles: ["小橘，帮我跑一趟：{topic}。"], reply: { speaker: xiaoju, bubbles: ["我去去就回！"] } }
  - { id: go_xj_02, speaker: adeng, bubbles: ["你去找东西最快。", "别又带一堆零食回来。"], reply: { speaker: xiaoju, bubbles: ["那不行。"] } }
  - { id: go_xj_03, speaker: xiaoju, bubbles: ["我去去就回！"] }

sub_go_laoshi:
  - { id: go_ls_01, speaker: adeng, bubbles: ["老石，帮我敲一敲这个。"], reply: { speaker: laoshi, bubbles: ["嗯。"] } }
  - { id: go_ls_02, speaker: adeng, bubbles: ["老石，帮我看看？"], reply: { speaker: laoshi, bubbles: ["嗯。"] } }
  - { id: go_ls_03, speaker: laoshi, bubbles: ["拿来。"] }

sub_go_qingdai:
  - { id: go_qd_rain, speaker: qingdai, when: sky_rain, bubbles: ["下雨天，颜色调淡一点。", "我先去黑板上画个底稿。"] }
  - { id: go_qd_01, speaker: adeng, bubbles: ["青黛，先帮我们定个样。"], reply: { speaker: qingdai, bubbles: ["好，我去翻色卡。"] } }
  - { id: go_qd_02, speaker: adeng, bubbles: ["这次要耐看点，你来配颜色。"], reply: { speaker: qingdai, bubbles: ["我挑挑看。"] } }
  - { id: go_qd_03, speaker: qingdai, bubbles: ["我先去黑板上画几笔。"] }

sub_queue:
  - { id: sub_queue_01, speaker: adeng, when: who_xiaoju, bubbles: ["等小橘回来再去。"] }
  - { id: sub_queue_02, speaker: adeng, bubbles: ["{who}手上还有一件，这个排队。"] }
  - { id: sub_queue_03, speaker: adeng, bubbles: ["先放着，等{who}忙完这件。"] }

sub_back_xiaoju:
  - { id: back_xj_rain, speaker: xiaoju, when: sky_rain, bubbles: ["外面雨好大！", "资料揣在怀里，一张没湿。"] }
  - { id: back_xj_snow, speaker: xiaoju, when: sky_snow, bubbles: ["回来啦，路上全是我的脚印。", "找到的都在这儿。"] }
  - { id: back_xj_leaves, speaker: xiaoju, when: sky_leaves, bubbles: ["路上捡了片红叶子，给你夹书里。", "资料也找齐了。"] }
  - { id: back_xj_petals, speaker: xiaoju, when: sky_petals, bubbles: ["我头上是不是全是花瓣？", "先看资料，再帮我摘。"] }
  - { id: back_xj_halloween, speaker: xiaoju, when: holiday_halloween, bubbles: ["面包店在卖南瓜饼！", "我买了三个，一人一个。"] }
  - { id: back_xj_christmas, speaker: xiaoju, when: holiday_christmas, bubbles: ["街上的彩灯全亮了！", "图书馆门口也有一棵树。"] }
  - { id: back_xj_new_year, speaker: xiaoju, when: holiday_new_year, bubbles: ["街口在贴春联！", "邮局送了我一个红包袋。"] }
  - { id: back_xj_01, speaker: xiaoju, bubbles: ["找到了找到了！", "有{count}个能用的——", "还有这个，给你的。"] }
  - { id: back_xj_02, speaker: xiaoju, bubbles: ["外面好冷……", "然后，我找到一个特别好看的。"] }
  - { id: back_xj_03, speaker: xiaoju, bubbles: ["回来啦。先分零食。"] }

sub_back_laoshi:
  - { id: back_ls_issue, speaker: laoshi, when: has_issues, bubbles: ["{issueCount}处不对。标出来了。"] }
  - { id: back_ls_ok, speaker: laoshi, when: no_issues, bubbles: ["……还行。"], reply: { speaker: xiaoju, bubbles: ["他说还行！"] } }
  - { id: back_ls_ok2, speaker: laoshi, when: no_issues, bubbles: ["嗯。没毛病。"] }

sub_back_qingdai:
  - { id: back_qd_01, speaker: qingdai, bubbles: ["样子定好了。", "五个颜色，从浅到深排。"], reply: { speaker: adeng, bubbles: ["好，我们就照这个做。"] } }
  - { id: back_qd_02, speaker: qingdai, bubbles: ["色卡贴这儿了。", "偏暖一点，久看也不累。"] }
  - { id: back_qd_03, speaker: qingdai, bubbles: ["画好了，你看看。"], reply: { speaker: laoshi, bubbles: ["……字小了。"] } }

stuck:
  - { id: stuck_01, speaker: adeng, bubbles: ["嗯？这里对不上。", "我换个法子。"] }
  - { id: stuck_02, speaker: adeng, bubbles: ["又是这儿。"] }
  - { id: stuck_03, speaker: xiaoju, bubbles: ["咦，跟我想的不一样。"] }
  - { id: stuck_04, speaker: laoshi, bubbles: ["不对。{whatsWrong}。"] }
  - { id: stuck_05, speaker: laoshi, bubbles: ["……不对。", "再看一遍。"] }

stuck_long:
  - { id: stuck_long_01, speaker: adeng, bubbles: ["这块有点难啃。", "我要多试几次，得多等一会儿。", "你去忙你的也行。"] }
  - { id: stuck_long_02, speaker: adeng, bubbles: ["还在弄，没忘。"] }
  - { id: stuck_long_03, speaker: adeng, bubbles: ["再给我一会儿。"] }

waiting:
  - { id: wait_01, speaker: adeng, bubbles: ["还得一会儿。"] }
  - { id: wait_02, speaker: adeng, bubbles: ["它在跑，我们等等。"] }
  - { id: wait_03, speaker: adeng, bubbles: ["窗外好像要下雨了。"] }

ask:
  - { id: ask_color, speaker: adeng, when: demo_color, bubbles: ["奶油白和浅薄荷，我纠结半天了。", "你觉得哪个更像你要的？"] }
  - { id: ask_01, speaker: adeng, bubbles: ["有件事想问你。", "{question}"] }
  - { id: ask_02, speaker: adeng, bubbles: ["这里有两种做法。", "你更想要哪种？"] }

react_adopted:
  - { id: react_ad_adeng, speaker: adeng, bubbles: ["好，就照你说的。"] }
  - { id: react_ad_laoshi, speaker: laoshi, bubbles: [] }
  - { id: react_ad_xiaoju, speaker: xiaoju, bubbles: ["那我去把贴纸找出来！"] }

react_rejected:
  - { id: react_rj_adeng, speaker: adeng, bubbles: ["好，听你的。"] }
  - { id: react_rj_laoshi, speaker: laoshi, bubbles: ["……我选的另一个。"] }
  - { id: react_rj_xiaoju, speaker: xiaoju, bubbles: ["那我去把贴纸找出来！"] }

react_delegated:
  - { id: react_dl_00, speaker: adeng, bubbles: ["好，那我来定。", "定好了跟你说。"] }
  - { id: react_dl_01, speaker: adeng, bubbles: ["那我选{choice}，因为{reason}。", "不喜欢随时说。"] }
  - { id: react_dl_02, speaker: adeng, bubbles: ["好，我先定{choice}。", "不合适再换。"] }
  - { id: react_dl_03, speaker: adeng, bubbles: ["那就{choice}。", "理由我写在本子上了。"] }

serious:
  - { id: serious_01, speaker: adeng, bubbles: ["这一步要{action}。", "做了就{consequence}。", "你看一下再决定。"] }
  - { id: serious_02, speaker: adeng, bubbles: ["这里要你确认一下。", "{action}，{consequence}。"] }
  - { id: serious_03, speaker: adeng, bubbles: ["这一步是认真的。", "你看清楚再点。"] }

refused:
  - { id: refused_01, speaker: adeng, bubbles: ["这个我不能碰。", "换条路走。"] }
  - { id: refused_02, speaker: adeng, bubbles: ["这个不归我们碰。"] }
  - { id: refused_03, speaker: adeng, bubbles: ["那边是你的私事，我不去翻。"] }

serious_yes:
  - { id: serious_yes_01, speaker: adeng, bubbles: ["好，我来做。"] }
  - { id: serious_yes_02, speaker: adeng, bubbles: ["知道了，这就做。"] }
  - { id: serious_yes_03, speaker: adeng, bubbles: ["好。"] }

serious_no:
  - { id: serious_no_01, speaker: adeng, bubbles: ["好，不动它。", "我换个不需要这样的办法。"] }
  - { id: serious_no_02, speaker: adeng, bubbles: ["好，先放着。"] }
  - { id: serious_no_03, speaker: adeng, bubbles: ["不做了。我绕开它。"] }

done:
  - { id: done_day, speaker: adeng, when: daytime, bubbles: ["做好了，放桌上了。", "你看看合不合心意？"] }
  - { id: done_dusk, speaker: adeng, when: dusk, bubbles: ["做好了。", "正好天也快黑了。"] }
  - { id: done_night, speaker: adeng, when: night, bubbles: ["做好了。", "这么晚了，看完早点睡。"] }
  - { id: done_xiaoju, speaker: xiaoju, bubbles: ["收工！零食分你一半。"] }
  - { id: done_laoshi, speaker: laoshi, when: reviewed, bubbles: ["……还行。"] }

failed:
  - { id: failed_01, speaker: adeng, bubbles: ["这次没做成，对不起。", "卡在{stuckAt}。", "我记在本子上了。", "你愿意的话，下次换个办法。"] }
  - { id: failed_02, speaker: adeng, bubbles: ["没弄成。", "卡在{stuckAt}，我记下了。"] }
  - { id: failed_03, speaker: adeng, bubbles: ["今天先到这儿。", "问题我写在本子上了。"] }

net_retry:
  - { id: net_retry_01, speaker: adeng, bubbles: ["外面好像断电了，我等等再试。"] }
  - { id: net_retry_02, speaker: adeng, bubbles: ["电话没打通，我再拨一次。"] }
  - { id: net_retry_03, speaker: adeng, bubbles: ["门外没人应，过会儿再敲。"] }

cancelled:
  - { id: cancelled_01, speaker: adeng, bubbles: ["好，那先放着。"] }
  - { id: cancelled_02, speaker: adeng, bubbles: ["行，做好的都留着。"] }
  - { id: cancelled_03, speaker: adeng, bubbles: ["好，先不做了。"] }

idle_mutter:
  - { id: idle_adeng, speaker: adeng, bubbles: ["杯子又多了一道缝。"] }
  - { id: idle_xiaoju, speaker: xiaoju, bubbles: ["明天想吃桂花糕。"] }
  - { id: idle_laoshi, speaker: laoshi, bubbles: ["嗯。"] }
  - { id: idle_adeng_02, speaker: adeng, bubbles: ["明天进点新茶叶。"] }
  - { id: idle_xiaoju_02, speaker: xiaoju, bubbles: ["这本书我看过三遍了。"] }
  - { id: idle_laoshi_02, speaker: laoshi, bubbles: ["……歪了。"] }
  - { id: idle_qingdai, speaker: qingdai, bubbles: ["这面墙刷成豆绿就好了。"] }
  - { id: idle_qingdai_02, speaker: qingdai, bubbles: ["粉笔又短了一截。"] }
  # In the study (shared/scenes.ts): the same moments, said to fit the room.
  - { id: idle_adeng, scene: study, speaker: adeng, bubbles: ["书桌抽屉又卡住了。"] }
  - { id: idle_study_xiaoju, scene: study, speaker: xiaoju, bubbles: ["沙发比店里的椅子软多了。"] }
  - { id: idle_study_laoshi, scene: study, speaker: laoshi, bubbles: ["这块地板会响。"] }
  - { id: idle_study_qingdai, scene: study, speaker: qingdai, bubbles: ["书按颜色排才好看。"] }

# A meeting at the big table (the bell on the counter). Replies from someone out on an errand are left out.
meeting_call:
  - { id: meeting_call_01, speaker: adeng, bubbles: ["来，都过来一下。"], reply: { speaker: xiaoju, bubbles: ["开会？"] } }
  - { id: meeting_call_02, speaker: adeng, bubbles: ["铃响了，先停一停。"], reply: { speaker: laoshi, bubbles: ["嗯。"] } }
  - { id: meeting_call_03, speaker: xiaoju, bubbles: ["来了来了！"] }
meeting_heard:
  - { id: meeting_heard_01, speaker: adeng, bubbles: ["好，记下了。", "我们照这个改。"], reply: { speaker: laoshi, bubbles: ["嗯。"] } }
  - { id: meeting_heard_02, speaker: adeng, bubbles: ["明白。", "接着干活。"], reply: { speaker: xiaoju, bubbles: ["收到！"] } }
  - { id: meeting_heard_03, speaker: adeng, bubbles: ["这个好办。", "改完我叫你看。"] }
meeting_late:
  - { id: meeting_late_01, speaker: adeng, bubbles: ["这单刚收尾。", "下次一开始就告诉我。"] }
  - { id: meeting_late_02, speaker: adeng, bubbles: ["哎，已经交了。", "要改就再递一张单子。"] }
  - { id: meeting_late_03, speaker: adeng, bubbles: ["晚了一步。", "我记着，下回先问你。"] }

# Long commissions (over 20 minutes): Adeng says how it is going, at most every 10 minutes. Taken in turn.
progress:
  - { id: progress_01, speaker: adeng, bubbles: ["做了{minutes}分钟了。", "{done}步做完，还剩{left}步。"] }
  - { id: progress_02, speaker: adeng, bubbles: ["还在{doing}。", "没忘，你忙你的。"] }
  - { id: progress_03, speaker: adeng, bubbles: ["慢是慢了点。", "不过一直在往前走。"] }

app_open:
  - { id: open_01, speaker: adeng, bubbles: ["{name}，来啦。"] }
  - { id: open_rain, speaker: adeng, when: sky_rain, bubbles: ["{name}，来啦。", "外面下雨，先擦擦。"] }
  - { id: open_snow, speaker: adeng, when: sky_snow, bubbles: ["{name}，来啦。", "雪大，过来烤烤手。"] }
  - { id: open_halloween, speaker: adeng, when: holiday_halloween, bubbles: ["{name}，来啦。", "今天有南瓜汤。"] }
  - { id: open_christmas, speaker: adeng, when: holiday_christmas, bubbles: ["{name}，来啦。", "栗子把彩灯扯下来两回了。"] }
  - { id: open_new_year, speaker: adeng, when: holiday_new_year, bubbles: ["{name}，新年好。", "门上的福是小橘贴的。"] }
  - { id: open_mem, speaker: adeng, when: has_memory, bubbles: ["{name}，来啦。", "「{lastCommission}」还好用吗？"] }
  - { id: open_first, speaker: adeng, when: first_time, bubbles: ["来啦。怎么称呼你？"] }
  # In the study (shared/scenes.ts): the same moments, said to fit the room.
  - { id: open_01, scene: study, speaker: adeng, bubbles: ["{name}，来啦。", "随便坐，这儿是家里。"] }

app_close:
  - { id: close_01, speaker: adeng, bubbles: ["好，那我们收拾一下。"] }
  - { id: close_02, speaker: adeng, bubbles: ["好，下次见。"] }
  - { id: close_03, speaker: adeng, bubbles: ["灯我先关一半。"] }

# Out in the back garden (game/garden.ts): each line is for one spot (when: spot_veg, spot_flowers, spot_bench,
# spot_lawn) or for a kind of weather (when: sky_snow, ...), said by whoever is out there. The cat just dozes.
garden:
  - { id: garden_veg_xiaoju, speaker: xiaoju, when: spot_veg, bubbles: ["这根萝卜比我胳膊还粗。"] }
  - { id: garden_veg_xiaoju_02, speaker: xiaoju, when: spot_veg, bubbles: ["番茄红了一个。", "就尝一口。"] }
  - { id: garden_veg_laoshi, speaker: laoshi, when: spot_veg, bubbles: ["这一垄种歪了。"] }
  - { id: garden_veg_laoshi_02, speaker: laoshi, when: spot_veg, bubbles: ["有虫。", "……放它走。"] }
  - { id: garden_flowers_xiaoju, speaker: xiaoju, when: spot_flowers, bubbles: ["浇水浇水，快快长。"] }
  - { id: garden_flowers_xiaoju_02, speaker: xiaoju, when: spot_flowers, bubbles: ["这朵给栗子闻闻。"] }
  - { id: garden_flowers_adeng, speaker: adeng, when: spot_flowers, bubbles: ["明天剪几枝放柜台上。"] }
  - { id: garden_flowers_adeng_02, speaker: adeng, when: spot_flowers, bubbles: ["这盆开得正好。"] }
  - { id: garden_bench_adeng, speaker: adeng, when: spot_bench, bubbles: ["坐一会儿，就一会儿。"] }
  - { id: garden_bench_adeng_02, speaker: adeng, when: spot_bench, bubbles: ["在这儿也听得见店里的铃。"] }
  - { id: garden_bench_laoshi, speaker: laoshi, when: spot_bench, bubbles: ["这椅子该上油了。"] }
  - { id: garden_bench_laoshi_02, speaker: laoshi, when: spot_bench, bubbles: ["……", "树长高了。"] }
  - { id: garden_lawn_adeng, speaker: adeng, when: spot_lawn, bubbles: ["这本看到哪儿了……"] }
  - { id: garden_lawn_adeng_02, speaker: adeng, when: spot_lawn, bubbles: ["这一页折过角。", "是小橘折的。"] }
  - { id: garden_lawn_xiaoju, speaker: xiaoju, when: spot_lawn, bubbles: ["草地上看书最舒服了。"] }
  - { id: garden_lawn_xiaoju_02, speaker: xiaoju, when: spot_lawn, bubbles: ["有只蚂蚁爬到书上了。"] }
  - { id: garden_flowers_qingdai, speaker: qingdai, when: spot_flowers, bubbles: ["这朵是灰紫色的，我记一下。"] }
  - { id: garden_flowers_qingdai_02, speaker: qingdai, when: spot_flowers, bubbles: ["花瓣边上那一点紫。", "怎么都调不出来。"] }
  - { id: garden_lawn_qingdai, speaker: qingdai, when: spot_lawn, bubbles: ["草叶背面的绿，比正面淡。"] }
  - { id: garden_lawn_qingdai_02, speaker: qingdai, when: spot_lawn, bubbles: ["云一过，天的蓝就变了。"] }
  - { id: garden_hens_xiaoju, speaker: xiaoju, when: spot_hens, bubbles: ["咕咕咕，开饭啦！"] }
