# The neighbours' stories (road-to-1.4.md D4): five chapters each, told on the street when one is waiting.
# When a chapter comes and what it leaves: app/shared/stories.ts. `left` must match that table.
# Each line is one bubble (max 20 characters, same writing rules as cafe.yaml). `note` says what was left behind.

mechanic:
  - title: 废品站的车
    left: bell
    note: 老周把旧车铃挂在了工坊窗边。
    lines:
      - 前天去废品站，看见一辆旧车。
      - 二八大杠，跟我年轻时骑的一个样。
      - 我掏了二十块，推回来了。
      - 车铃还能响，先挂你们窗边。
  - title: 拆开看看
    left: toolbox
    note: 工坊门口多了老周的工具箱。
    lines:
      - 车架锈得厉害，链条也断了。
      - 我把工具箱搬过来，就在这儿修。
      - 铺子里太挤，街上敞亮。
  - title: 打气筒
    left: pump
    note: 工坊门边靠着一个老打气筒。
    lines:
      - 新轮胎到了，气就是打不进去。
      - 气门芯老了，换一个就好。
      - 打气筒留这儿，谁的车瘪了都来打。
  - title: 旧车牌
    left: plate
    note: 工坊墙上钉了一块旧车牌。
    lines:
      - 拆车座的时候，掉出来一块铁牌子。
      - 以前自行车也上牌照，你们没见过。
      - 我翻出老本子一对，号码一样。
      - 这就是我当年那辆车。
  - title: 送给小店
    left: bicycle
    note: 修好的旧自行车靠在咖啡馆门口。
    lines:
      - 修好了，骑了一圈，闸也灵。
      - 我腿脚不如从前，骑不远了。
      - 放你们门口，跑腿用得上。
      - 就一条，铃要常响着。

granny:
  - title: 晒太阳
    left: cushion
    note: 长椅上多了一个碎花坐垫。
    lines:
      - 这张椅子晒得到下午的太阳。
      - 邮局就在街那头，阿信一来我就看见。
      - 孙女在外地念书，说好每月写信。
      - 椅子凉，我带了个垫子。
  - title: 麻雀
    left: millet
    note: 长椅边放了一小碟小米。
    lines:
      - 信还没来，麻雀倒是天天来。
      - 我带一把小米，它们认得我。
      - 那只秃尾巴的胆子最大。
  - title: 月季
    left: rose
    note: 长椅边摆了一盆月季。
    lines:
      - 孙女来信了，说那边冬天长。
      - 她小时候最爱月季，说比牡丹好看。
      - 我种了一盆，等她回来正好开花。
  - title: 鸟窝
    left: birdhouse
    note: 长椅后面的墙上挂了一个小木鸟窝。
    lines:
      - 老周帮我钉了个鸟窝。
      - 麻雀住进去了，一窝三只。
      - 孙女说要看照片，我拍了十几张。
  - title: 回来了
    left: stool
    note: 长椅边多了一张小板凳。
    lines:
      - 孙女昨天到家了，过年都在。
      - 她一早就跟我出来晒太阳。
      - 椅子坐不下两个人，我搬了张小板凳。
      - 她说这条街的店，比她走的时候多了。

student:
  - title: 换题目
    left: books
    note: 书房门口堆了一摞小禾的书。
    lines:
      - 导师让我换题目，我想写这条街。
      - 一条街，几间老店，怎么开起来的。
      - 书我先搬来了，在这儿看着街写。
  - title: 告示
    left: notice
    note: 书房门边贴了一张找街坊聊天的告示。
    lines:
      - 我贴了张告示，想找街坊聊聊。
      - 桂姨说面包房开了二十年。
      - 老周说他那铺子比桂姨还早。
      - 两个人为这个争了一下午。
  - title: 仙人掌
    left: cactus
    note: 书房窗台上多了一盆仙人掌。
    lines:
      - 陈婆婆送我一盆仙人掌。
      - 她说这个好养，忘了浇也不怕。
      - 跟我差不多，几天不管也活着。
  - title: 借书角
    left: bookshelf
    note: 书房门外立了一个借书的小书架。
    lines:
      - 访谈记了三个本子，书也越堆越多。
      - 我钉了个小书架，大家随便拿。
      - 看完放回来就行，不用登记。
  - title: 毕业
    left: cap
    note: 小书架顶上放着一顶学士帽。
    lines:
      - 论文过了，封面是印刷铺印的。
      - 书架上放了一本，写的就是你们。
      - 帽子留这儿，我下个月去外地上班。
      - 回来了，还来这儿坐着写东西。
