<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:" />
    <title>Lamplight Nook</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- Watercolor edges: turbulence displaces the paper so its rim bleeds and wobbles (used by .paper::before). -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <filter id="wc-edge" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="4" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="9" xChannelSelector="R" yChannelSelector="G" />
      </filter>
      <filter id="wc-edge-small" x="-8%" y="-15%" width="116%" height="130%">
        <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="2" seed="9" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>
    <div id="game"></div>
    <div id="labels"></div>
    <div id="ui"></div>
    <details id="debug">
      <summary>Debug</summary>
      <div id="env"></div>
      <label>Actor <select id="actor"></select></label>
      <label>to <select id="anchor"></select></label>
      <button id="walk">Walk</button>
      <hr />
      <button id="commission">New commission (or click the counter)</button>
      <button id="preview-cards">Preview decision cards</button>
      <button id="replay">Replay recording (no API calls)</button>
      <button id="run-hello">Debug task: write hello.txt</button>
      <button id="run-sub">Debug task: two subagents</button>
      <pre id="log"></pre>
    </details>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
