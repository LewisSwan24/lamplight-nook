# Print shop rules (road-to-1.4.md D2): the same format as rules/cafe.yaml, whose header explains it.
# All the work goes to Aqian the typesetter; Adeng only minds the counter until D3 sends work over.
# The cafe's spots go by other names here: counter = composing desk with the type case, board = the press,
# shelf = paper rack, table = cutting table, corner = binding table. Nobody goes out: helpers' errands are
# Aqian walking to a spot. The filing cabinet and the letter holder are the home shop's, so they stay out of it.

- on: session_start
  actor: aqian
  state: ready
  moveTo: counter
  anim: idle
  lines: opening
  priority: work
  extra:
    - { actor: adeng, state: ready, moveTo: counter, anim: idle, priority: chat }

# Laying out the job on the press bed.
- on: plan
  actor: aqian
  state: working
  moveTo: board
  anim: write
  bubble: note
  lines: planning
  priority: work

- on: thinking
  actor: aqian
  state: thinking
  anim: read
  bubble: dots
  priority: work

# Helpers' errands: looking it up at the paper rack, checking proofs at the binding table, laying out at the press.
- on: subagent_start
  when: { agent: researcher }
  actor: aqian
  state: working
  moveTo: shelf
  anim: read
  lines: sub_go_research
  priority: subagent

- on: subagent_stop
  when: { agent: researcher }
  actor: aqian
  state: ready
  moveTo: counter
  anim: gift
  lines: sub_back_research
  priority: subagent

- on: subagent_start
  when: { agent: reviewer }
  actor: aqian
  state: checking
  moveTo: corner
  anim: read
  lines: sub_go_review
  priority: subagent

- on: subagent_stop
  when: { agent: reviewer }
  actor: aqian
  state: ready
  moveTo: counter
  anim: idle
  lines: sub_back_review
  priority: subagent

- on: subagent_start
  when: { agent: designer }
  actor: aqian
  state: working
  moveTo: board
  anim: read
  bubble: idea
  lines: sub_go_design
  priority: subagent

- on: subagent_stop
  when: { agent: designer }
  actor: aqian
  state: ready
  moveTo: counter
  anim: gift
  lines: sub_back_design
  priority: subagent

# Unrecognized helpers: looked up at the paper rack too.
- on: subagent_start
  actor: aqian
  state: working
  moveTo: shelf
  anim: read
  lines: sub_go_research
  priority: subagent

- on: subagent_stop
  actor: aqian
  state: ready
  moveTo: counter
  anim: gift
  lines: sub_back_research
  priority: subagent

- on: tool_start
  when: { agent: researcher }
  actor: aqian
  state: working
  anim: read
  bubble: note
  priority: work

- on: tool_start
  when: { agent: reviewer }
  actor: aqian
  state: checking
  anim: read
  priority: work

- on: tool_start
  when: { agent: designer }
  actor: aqian
  state: working
  anim: read
  bubble: idea
  priority: work

- on: tool_start
  when: { agent: unknown }
  actor: aqian
  state: working
  anim: read
  bubble: note
  priority: work

# The list on the press changes: Aqian goes over and reads it through.
- on: progress
  when: { agent: main }
  actor: aqian
  state: working
  moveTo: board
  anim: read
  priority: chat

# Office tools: a document is read at the paper rack; a finished file is laid on the composing desk.
- on: tool_start
  when: { agent: main, tool: mcp__nook-office__read_document }
  actor: aqian
  state: working
  moveTo: shelf
  anim: read
  priority: work

- on: tool_ok
  when: { agent: main, tool: [mcp__nook-office__make_docx, mcp__nook-office__make_xlsx, mcp__nook-office__make_pptx, mcp__nook-office__make_pdf, mcp__nook-office__edit_docx, mcp__nook-office__edit_xlsx, mcp__nook-office__edit_pptx, mcp__nook-office__render_png] }
  actor: aqian
  state: working
  moveTo: counter
  anim: gift
  priority: work

# Connections: no letter holder here, so what comes in is read at the composing desk.
- on: tool_start
  when: { agent: main, tool: [mcp__nook-calendar__events, mcp__nook-folder__list, mcp__nook-folder__read] }
  actor: aqian
  state: working
  moveTo: counter
  anim: read
  priority: work

- on: tool_ok
  when: { agent: main, tool: mcp__nook-folder__save_copy }
  actor: aqian
  state: working
  moveTo: shelf
  anim: gift
  priority: work

- on: tool_ok
  when: { agent: main, tool: mcp__nook-maildraft__draft }
  actor: aqian
  state: working
  moveTo: counter
  anim: gift
  lines: draft_ready
  priority: work

# Setting type at the composing desk.
- on: tool_start
  when: { agent: main, tool: [Write, Edit, MultiEdit, NotebookEdit] }
  actor: aqian
  state: working
  moveTo: counter
  anim: write
  lines: writing
  priority: work

# Running something is pulling the press.
- on: tool_start
  when: { agent: main, tool: [Bash, PowerShell] }
  actor: aqian
  state: working
  moveTo: board
  anim: lift
  priority: work

- on: tool_start
  when: { agent: main, tool: [WebSearch, WebFetch] }
  actor: aqian
  state: working
  moveTo: counter
  anim: phone
  priority: work

- on: tool_start
  when: { agent: main, tool: [Read, Glob, Grep] }
  actor: aqian
  state: working
  moveTo: shelf
  anim: read
  priority: work

- on: tool_start
  when: { agent: main }
  actor: aqian
  state: working
  moveTo: table
  anim: write
  priority: work

- on: long_wait
  actor: aqian
  state: waiting
  moveTo: window
  anim: drink
  bubble: tea
  lines: waiting
  priority: work

- on: tool_fail
  when: { failStreak: { lt: 3 } }
  actor: aqian
  state: stuck
  anim: scratch_head
  bubble: sweat
  lines: stuck
  own_lines: true
  priority: fail

- on: tool_fail
  actor: aqian
  state: stuck
  anim: scratch_head
  bubble: sweat
  lines: stuck_long
  priority: fail

- on: tool_ok
  when: { agent: main }
  actor: aqian
  state: working
  priority: chat

- on: ask_user
  actor: aqian
  state: asking
  moveTo: counter
  anim: idle
  bubble: question
  lines: ask
  priority: ask

- on: permission
  when: { risk: [serious, blocked] }
  actor: aqian
  state: serious
  moveTo: counter
  anim: idle
  bubble: alert
  lines: serious
  priority: serious

- on: permission
  actor: aqian
  state: asking
  moveTo: counter
  anim: idle
  bubble: question
  lines: ask
  priority: ask

- on: decision
  when: { choice: picked }
  actor: aqian
  state: reacting
  anim: idle
  lines: react_adopted
  own_lines: true
  priority: fail

- on: decision
  when: { choice: delegated }
  actor: aqian
  state: reacting
  anim: idle
  lines: react_delegated
  priority: fail

- on: decision
  when: { choice: allowed, risk: serious }
  actor: aqian
  state: reacting
  lines: serious_yes
  priority: fail

- on: decision
  when: { choice: denied, risk: blocked }
  actor: aqian
  state: working
  lines: refused
  priority: fail

- on: decision
  when: { choice: denied, risk: serious }
  actor: aqian
  state: reacting
  lines: serious_no
  priority: fail

- on: decision
  when: { choice: allowed }
  actor: aqian
  state: reacting
  lines: react_adopted
  own_lines: true
  priority: fail

- on: decision
  actor: aqian
  state: reacting
  lines: react_rejected
  own_lines: true
  priority: fail

- on: done
  actor: aqian
  state: wrapping
  moveTo: counter
  anim: idle
  lines: done
  priority: fail

- on: failed
  actor: aqian
  state: low
  moveTo: counter
  anim: idle
  lines: failed
  priority: fail

- on: net_error
  actor: aqian
  state: low
  moveTo: counter
  anim: idle
  bubble: alert
  lines: failed
  priority: fail

- on: net_retry
  actor: aqian
  state: waiting
  moveTo: window
  anim: idle
  bubble: dots
  lines: net_retry
  priority: fail

- on: cancelled
  actor: aqian
  state: idle
  moveTo: counter
  anim: idle
  lines: cancelled
  priority: fail
