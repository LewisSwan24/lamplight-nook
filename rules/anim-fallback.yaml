# Animation fallbacks: animations the purchased art doesn't have yet are mapped to ones it does.
# `available` lists animations that really exist; `fallback` maps rule animation names to them, optionally with a bubble.
# Once an animation is drawn, add it to `available` and delete its fallback line.
# Source: the LimeZu character generator's built-in animations; the shop cat only has a lying/tail-wag loop.

staff:
  available: [idle, walk, sleep, sit, phone, read, push, pick_up, gift, lift, throw]
  fallback:
    # Drawn at the hand (game/props.ts): the pack has no writing or drinking, so a pencil or a cup does the telling.
    write: { anim: sit, prop: pencil }
    drink: { anim: idle, prop: cup, bubble: tea }
    spin_cup: { anim: idle, prop: cup, bubble: dots }
    hammer: { anim: lift, prop: hammer, bubble: dots }
    # No coat in the pack: leaving through the door says it well enough.
    put_on_coat: { anim: walk }
    # No such move in the pack: the sweat drop is the point.
    scratch_head: { anim: idle, bubble: sweat }

cat:
  available: [lie, walk]
  fallback:
    idle: { anim: lie }
    sleep: { anim: lie }
    rub_leg: { anim: lie, bubble: idea }
