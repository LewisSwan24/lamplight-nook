# Once a week: the three small commissions of tools/real/check.ts against the latest Claude Code (the official
# installer, as a user would have it) with the test key, the same against the stand-in, and the comparison.
# The run fails, and GitHub emails the owner, when something the shop relies on did not hold, or when Claude Code
# shows an event kind or tool the stand-in does not play (see tools/real/compare.mjs).
#
# Needs the repository secret LAMPLIGHT_TEST_KEY: an Anthropic API key for testing, ideally in a workspace with
# its own spending limit. Without it only the stand-in part runs. Spending: each commission stops at $0.40, and
# none starts that could take the total past the budget ($1 unless given by hand).
name: real-check

on:
  schedule:
    - cron: '23 4 * * 1' # Mondays, 04:23 UTC
  workflow_dispatch:
    inputs:
      budget:
        description: 'Most to spend in dollars (each commission is capped at 0.40)'
        default: '1.00'
      lang:
        description: 'zh-CN or en'
        default: 'zh-CN'

permissions:
  contents: read

concurrency:
  group: real-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_KEY: ${{ secrets.LAMPLIGHT_TEST_KEY != '' }}
      BUDGET: ${{ inputs.budget || '1.00' }}
      CHECK_LANG: ${{ inputs.lang || 'zh-CN' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Claude Code (official installer, latest)
        if: env.HAS_KEY == 'true'
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Against the stand-in (free)
        run: npx tsx tools/real/check.ts --sim --lang "$CHECK_LANG" --out real-check/sim
      - name: Against Claude Code
        if: env.HAS_KEY == 'true'
        env:
          LAMPLIGHT_TEST_KEY: ${{ secrets.LAMPLIGHT_TEST_KEY }}
        run: npx tsx tools/real/check.ts --lang "$CHECK_LANG" --budget "$BUDGET" --out real-check/real
      - name: Compare
        if: always()
        run: |
          node tools/real/compare.mjs real-check/real real-check/sim | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-check
          # The report zips only: no key, the home folder replaced. The work folders stay on the runner.
          path: real-check/*/report.zip
          if-no-files-found: ignore
